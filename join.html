<!doctype html>
<html lang="en">
<head>

<script>if (window.top !== window.self) { document.documentElement.style.display = 'none'; try { window.top.location.replace(window.self.location.href); } catch (e) {} }</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<title>Loyalty card</title>
<link rel="icon" href="favicon.png">

<style>

  @font-face { font-family: 'Space Grotesk'; src: url('/fonts/space-grotesk-latin-wght-normal.woff2') format('woff2-variations'); font-weight: 300 700; font-display: swap; }
  @font-face { font-family: 'Space Grotesk'; src: url('/fonts/space-grotesk-latin-ext-wght-normal.woff2') format('woff2-variations'); font-weight: 300 700; font-display: swap; unicode-range: U+0100-024F, U+1E00-1EFF, U+20A0-20C0; }
  :root {
    color-scheme: light dark;
    --bg: #f1ece1; --card: #ffffff; --line: rgba(58, 50, 40, 0.14);
    --text: #14120f; --muted: #5d5446;
    --accent: #ff5c00; --accent-ink: #1a0e05; --accent-text: #b03e00;
    --bad-bg: #fdecea; --bad-line: #f1b4ad; --bad-ink: #8f1d12;
    --r: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121415; --card: #191c1e; --line: rgba(255, 255, 255, 0.08);
      --text: #ece7df; --muted: rgba(236, 231, 223, 0.74); --accent-text: #ff8340;
      --bad-bg: rgba(239, 83, 64, 0.14); --bad-line: rgba(239, 83, 64, 0.45); --bad-ink: #ffb4a8;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Space Grotesk', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.45;
  }
  button, input { font: inherit; color: inherit; }
  .top {
    background: var(--accent); color: var(--accent-ink);
    padding: calc(22px + env(safe-area-inset-top)) 16px 20px;
  }
  .top h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
  .top p { margin: 6px 0 0; font-size: 14.5px; opacity: .9; }
  main { max-width: 440px; margin: 0 auto; padding: 16px 16px 40px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 16px; }
  label { display: block; font-size: 14px; font-weight: 650; margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  label span { font-weight: 400; color: var(--muted); }
  input {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); font-size: 16px;
  }
  .go {
    width: 100%; margin-top: 18px; padding: 14px; border: 0; border-radius: 14px;
    background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 16px; cursor: pointer;
  }
  .go:disabled { opacity: .5; }
  .msg { min-height: 22px; margin-top: 12px; font-size: 14.5px; color: var(--muted); text-align: center; }

  .msg.bad { background: var(--bad-bg); border: 1px solid var(--bad-line); color: var(--bad-ink); border-radius: 12px;
    padding: 10px 12px; font-weight: 600; text-align: left; }
  .msg.bad b { display: block; font-size: 15.5px; margin-bottom: 2px; }
  .note { font-size: 12.5px; color: var(--muted); margin-top: 14px; text-align: center; }
  .note a { color: inherit; text-decoration: underline; }
  .loyal { text-align: center; }
  .loyal .shop { font-size: 15px; font-weight: 650; color: var(--muted); }
  .loyal .who { font-size: 22px; font-weight: 800; margin-top: 4px; }
  .qr { background: #fff; border-radius: 14px; padding: 14px; width: 250px; height: 250px; margin: 16px auto 10px; }
  .qr svg { width: 100%; height: 100%; display: block; }

  .stamps { display: grid; grid-template-columns: repeat(5, 34px); justify-content: center; column-gap: 12px; row-gap: 10px; margin: 16px 0 6px; }
  .stamps i { display: block; width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); }
  .stamps i.on { background: var(--accent); border-color: var(--accent); }
  .stampline { font-size: 15px; font-weight: 700; }
  .stampline.ready { color: var(--accent-text); }
  .code { font-family: ui-monospace, "Courier New", monospace; font-size: 19px; letter-spacing: 2px; font-weight: 700; }
  .made { text-align: center; font-size: 12px; color: var(--muted); margin-top: 22px; }
  .made a { color: var(--muted); font-weight: 700; text-decoration: none; border-bottom: 1px solid var(--line); }
  .waitdot { display: inline-block; width: 8px; height: 8px; border-radius: 99px; background: var(--accent); margin-right: 8px; vertical-align: 1px; }

  @keyframes cardIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes qrIn { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
  @keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: no-preference) {
    main > .card { animation: cardIn .4s cubic-bezier(.2,.8,.2,1) both; }
    .loyal > * { animation: cardIn .42s cubic-bezier(.2,.8,.2,1) both; }
    .loyal > .who { animation-delay: .06s; }
    .loyal > .qr { animation: qrIn .5s .14s cubic-bezier(.2,.9,.3,1.2) both; }
    .loyal > .code { animation-delay: .24s; }
    .loyal > .note { animation-delay: .3s; }
    .msg.bad { animation: shake .34s ease-out; }
    .waitdot { animation: breathe 1.2s ease-in-out infinite; }
    .go { transition: transform .1s ease; }
    .go:not(:disabled):active { transform: scale(.97); }
  }
</style>
</head>
<body>
<div class="top"><h1 id="title">Loyalty card</h1><p id="sub">Collect stamps and get free items.</p></div>
<main id="main"><div class="card"><div class="msg">Loading…</div></div></main>
<div class="made">Powered by <a href="https://emberpos.net" target="_blank" rel="noopener">Ember POS</a></div>
<script src="vendor/qrcode-generator-1.4.4.js"></script>
<script>
const URLB = 'https://qqmkgafyfxrcnwdkkyxc.supabase.co';
const ANON = 'sb_publishable_-cAsxVwroAl8NPHIQnrKMw_PsBEYAYX';
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const KEY = 'ember.card.' + TOKEN.slice(0, 12);
const el = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

async function rpc(fn, args) {
  const r = await fetch(URLB + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: ANON, Authorization: 'Bearer ' + ANON },
    body: JSON.stringify(args),
  });
  if (!r.ok) throw new Error('network');
  return await r.json();
}

function cardHtml(c) {
  let svg = '';
  try {
    const q = qrcode(0, 'M');
    q.addData('EMBER-CARD:' + c.code);
    q.make();
    svg = q.createSvgTag({ cellSize: 6, margin: 0, scalable: true });
  } catch (e) { svg = ''; }
  const shown = c.code.length === 10 ? c.code.slice(0, 5) + ' ' + c.code.slice(5) : c.code;
  return '<div class="card loyal">' +
    '<div class="shop">' + esc(c.shop || 'Loyalty card') + '</div>' +
    '<div class="who">' + esc(c.name) + '</div>' +
    (svg ? '<div class="qr">' + svg + '</div>' : '') +
    '<div class="code">' + esc(shown) + '</div>' +
    '<div id="stampbox"></div>' +
    '<div class="note">Show this at the counter every time you order. Take a screenshot to keep it handy, ' +
    'or open this link again, your card stays on this phone.</div></div>';
}

function showCard(c) {
  el('title').textContent = c.shop ? c.shop : 'Loyalty card';
  el('sub').textContent = 'Your loyalty card';
  el('main').innerHTML = cardHtml(c);
  loadStamps(c);
}

async function loadStamps(c) {
  try {
    const r = await rpc('loyalty_card_status', { p_token: TOKEN, p_code: c.code });
    if (!r || !r.ok) return;
    const req = Math.max(1, Math.min(50, Number(r.required) || 10));
    const have = Math.max(0, Number(r.stamps) || 0);
    const shownDots = Math.min(have, req);
    let dots = '';
    if (req <= 20) for (let i = 0; i < req; i++) dots += '<i class="' + (i < shownDots ? 'on' : '') + '"></i>';
    const left = req - have;
    const line = r.free_ready ? 'You have a free one ready. Ask at the counter!'
      : (left === 1 ? '1 more stamp for a free one.' : left + ' more stamps for a free one.');
    const box = el('stampbox');
    if (!box) return;
    box.innerHTML = (dots ? '<div class="stamps" aria-hidden="true">' + dots + '</div>' : '') +
      '<div class="stampline' + (r.free_ready ? ' ready' : '') + '">' + have + ' of ' + req + ' stamps</div>' +
      '<div class="note" style="margin-top:4px">' + esc(line) + '</div>';
  } catch (e) {  }
}

function showForm(shop) {
  el('title').textContent = shop.shop || 'Loyalty card';
  el('sub').textContent = 'Join our loyalty card: get a stamp with every visit, and a free item after ' + shop.required + '.';
  el('main').innerHTML =
    '<div class="card">' +
      '<label for="nm">Your name</label>' +

      '<input id="nm" autocomplete="name" maxlength="60" placeholder="Your name">' +
      '<label for="ph">Mobile number</label>' +
      '<input id="ph" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="Mobile number">' +
      '<label for="bd">Birthday <span>(optional, for a birthday treat)</span></label>' +
      '<input id="bd" type="date" autocomplete="bday">' +
      '<button class="go" id="go">Get my card</button>' +
      '<div class="msg" id="msg"></div>' +
      '<div class="note"><a href="#" id="have">I already have a card from the shop</a></div>' +
      '<div class="note">Your name and number (and birthday, if you add it) go to this shop only, for its loyalty card. Ember stores them for that shop. See the <a href="customer-terms.html">customer terms</a> and the <a href="privacy-policy.html">privacy policy</a>.</div>' +
    '</div>';

  const say = (text, kind) => {
    const m = el('msg');
    m.classList.remove('bad');
    if (kind === 'wait') { m.innerHTML = '<span class="waitdot"></span>' + esc(text); return; }
    m.textContent = text;
    if (kind === 'bad') { void m.offsetWidth; m.classList.add('bad'); }
  };

  const sayTaken = () => {
    const m = el('msg');
    m.classList.remove('bad');
    m.innerHTML = '<b>This number is already saved at this shop.</b>' +
      'Check the number you typed. If it is right, show this screen at the counter and they will give you your card there.';
    void m.offsetWidth; m.classList.add('bad');
  };
  el('have').onclick = function (e) { e.preventDefault(); showHaveCard(shop); };
  el('go').onclick = async function () {
    if (el('go').disabled) return;
    const name = el('nm').value.trim(), phone = el('ph').value.trim(), bday = el('bd').value || null;
    if (name.length < 2) { say('Type your name.', 'bad'); return; }
    if (phone.replace(/\D/g, '').length < 10) { say('Type your full mobile number.', 'bad'); return; }
    el('go').disabled = true; say('Making your card…', 'wait');
    try {
      const r = await rpc('loyalty_join', { p_token: TOKEN, p_name: name, p_phone: phone, p_birthday: bday });
      if (r && r.exists) { sayTaken(); el('go').disabled = false; return; }
      if (!r || !r.ok) { say((r && r.error) || 'Please ask at the counter.', 'bad'); el('go').disabled = false; return; }
      const card = { code: r.card_code, name: name, shop: r.shop || shop.shop || '' };
      try { localStorage.setItem(KEY, JSON.stringify(card)); } catch (e) {  }
      showCard(card);
    } catch (e) {
      say('No connection. Try again in a moment.', 'bad');
      el('go').disabled = false;
    }
  };
}

const CODE_RE = /^[A-HJ-KM-NP-Z2-9]{10}$/;
function codeFromHash() {
  const m = /(?:^|[#&])c=([A-Za-z0-9 \-]+)/.exec(location.hash || '');
  const c = m ? m[1].replace(/[\s-]/g, '').toUpperCase() : '';
  return CODE_RE.test(c) ? c : '';
}
async function openByCode(code, shopName) {
  const r = await rpc('loyalty_card_status', { p_token: TOKEN, p_code: code });
  if (!r || !r.ok) return false;
  const card = { code: code, name: r.first_name || 'Loyalty card', shop: shopName || '' };
  try { localStorage.setItem(KEY, JSON.stringify(card)); } catch (e) {  }

  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {  }
  showCard(card);
  return true;
}
function showHaveCard(shop) {
  el('title').textContent = shop.shop || 'Loyalty card';
  el('sub').textContent = 'See the stamps on the card the shop gave you.';
  el('main').innerHTML =
    '<div class="card">' +
      '<label for="cc">The code under the QR on your card</label>' +
      '<input id="cc" autocomplete="off" autocapitalize="characters" maxlength="14" placeholder="ABCDE FGHJK">' +
      '<button class="go" id="go">Show my stamps</button>' +
      '<div class="msg" id="msg"></div>' +
      '<div class="note"><a href="#" id="back">I do not have a card yet</a></div>' +
    '</div>';
  el('back').onclick = function (e) { e.preventDefault(); showForm(shop); };
  el('go').onclick = async function () {
    if (el('go').disabled) return;
    const code = el('cc').value.replace(/[\s-]/g, '').toUpperCase();
    const m = el('msg');
    m.classList.remove('bad');
    if (!CODE_RE.test(code)) { m.textContent = 'Type the 10 letters and numbers under the QR on your card.'; void m.offsetWidth; m.classList.add('bad'); return; }
    el('go').disabled = true; m.textContent = 'Looking for your card…';
    try {
      if (await openByCode(code, shop.shop)) return;
      m.textContent = 'That code is not a card of this shop. Check it and try again, or ask at the counter.';
      void m.offsetWidth; m.classList.add('bad');
    } catch (e) {
      m.textContent = 'No connection. Try again in a moment.';
    }
    el('go').disabled = false;
  };
}

(async function () {
  if (!TOKEN) { el('main').innerHTML = '<div class="card"><div class="msg">This link is not complete. Please scan the QR code again.</div></div>'; return; }
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { saved = null; }
  const scanned = codeFromHash();
  if (scanned && !(saved && saved.code === scanned)) {
    try {
      const shop = await rpc('loyalty_join_shop', { p_token: TOKEN });
      if (await openByCode(scanned, shop && shop.ok ? shop.shop : '')) return;
    } catch (e) {  }
  }
  if (saved && saved.code) { showCard(saved); return; }
  try {
    const shop = await rpc('loyalty_join_shop', { p_token: TOKEN });
    if (!shop || !shop.ok) { el('main').innerHTML = '<div class="card"><div class="msg">' + esc((shop && shop.error) || 'Please ask at the counter.') + '</div></div>'; return; }
    showForm(shop);
  } catch (e) {
    el('main').innerHTML = '<div class="card"><div class="msg">No connection. Check your signal and try again.</div></div>';
  }
})();
</script>
</body>
</html>
