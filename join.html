<body>
<div class="glow" aria-hidden="true"></div>
<div class="embers" id="embers" aria-hidden="true"></div>
<div class="top"><h1 id="title">Loyalty card</h1><p id="sub">Collect stamps and get free items.</p></div>
<main id="main"><div class="panel"><div class="msg">Loading…</div></div></main>
<div class="made">Powered by <a href="https://emberpos.net" target="_blank" rel="noopener">Ember POS</a></div>
<script src="vendor/qrcode-generator-1.4.4.js"></script>
<script>
const URLB = 'https://qqmkgafyfxrcnwdkkyxc.supabase.co';
const ANON = 'sb_publishable_-cAsxVwroAl8NPHIQnrKMw_PsBEYAYX';
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const KEY = 'ember.card.' + TOKEN.slice(0, 12);
const el = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const calmMotion = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

(function () {
  if (calmMotion()) return;
  let h = '';
  for (let i = 0; i < 12; i++) {
    h += '<i style="left:' + ((i * 37 + 11) % 100) + '%;--dx:' + (((i * 53) % 60) - 30) + 'px;--dur:' + (8 + (i * 7) % 6) + 's;--del:' + ((i * 1.3) % 9).toFixed(1) + 's;width:' + (3 + (i % 3)) + 'px;height:' + (3 + (i % 3)) + 'px"></i>';
  }
  el('embers').innerHTML = h;
})();

async function rpc(fn, args) {
  const r = await fetch(URLB + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: ANON, Authorization: 'Bearer ' + ANON },
    body: JSON.stringify(args),
  });
  if (!r.ok) throw new Error('network');
  return await r.json();
}

let lastQr = '';

function cardHtml(c) {
  let svg = '';
  try {
    const q = qrcode(0, 'M');
    q.addData('EMBER-CARD:' + c.code);
    q.make();
    svg = q.createSvgTag({ cellSize: 6, margin: 0, scalable: true });
  } catch (e) { svg = ''; }
  const shown = c.code.length === 10 ? c.code.slice(0, 5) + ' ' + c.code.slice(5) : c.code;
  const first = String(c.name || '').trim().split(/\s+/)[0] || '';
  lastQr = svg;
  return '<div class="stage" id="stage">' +
    (first ? '<div class="hi">Hi <b>' + esc(first) + '</b></div>' : '') +
    '<div class="cardwrap" id="cardwrap"><div class="tilt" id="tilt"><div class="flipper" id="flipper" role="button" tabindex="0" aria-label="Loyalty card. Press to turn it over.">' +
    '<div id="stampbox" class="cardface wait">Opening your card\u2026</div><div id="backbox" class="cardface rear" aria-hidden="true"></div></div><span class="sheen"></span></div></div>' +
    '<div class="seg" role="group" aria-label="Side of the card"><button type="button" id="sfront" aria-pressed="true">Front</button><button type="button" id="sback" aria-pressed="false">Back</button></div>' +
    '<div id="progress"></div>' +
    '<section class="panel counter"><h2>Show this at the counter</h2>' +
    (svg ? '<div class="qr">' + svg + '</div>' : '') +
    '<div class="code">' + esc(shown) + '</div>' +
    '<div class="note">Show it every time you order. This card is saved on this phone, so opening this page again shows it at once.</div></section>' +
    '<section class="panel keep"><div class="how"><b>Keep it one tap away.</b> iPhone: tap Share, then Add to Home Screen. ' +
    'Android: open the menu, then Add to home screen.</div>' +
    '<div class="note"><a href="#" id="forget">Remove this card from this phone</a></div></section></div>';
}

function showCard(c) {
  el('title').textContent = '';
  el('sub').textContent = 'Your loyalty card';
  try { document.title = c.shop ? c.shop + ' loyalty card' : 'Loyalty card'; } catch (e) {  }
  el('main').innerHTML = cardHtml(c);
  const forget = el('forget');
  if (forget) forget.onclick = function (e) { e.preventDefault(); forgetCard(phoneStore(), KEY, c.code); showRemoved(); };
  drawBack(c, null, 0, '');
  turnCard(false);
  const fl = el('flipper');
  if (fl) {
    fl.onclick = function () { turnCard(); };
    fl.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); turnCard(); } };
  }
  if (el('sfront')) el('sfront').onclick = function () { turnCard(false); };
  if (el('sback')) el('sback').onclick = function () { turnCard(true); };
  loadStamps(c);
  leanCard();
}

function turnCard(to) {
  const f = el('flipper');
  if (!f) return;
  const t = to === undefined ? !f.classList.contains('turned') : !!to;
  f.classList.toggle('turned', t);
  if (el('sfront')) { el('sfront').setAttribute('aria-pressed', String(!t)); el('sback').setAttribute('aria-pressed', String(t)); }
  if (el('stampbox')) el('stampbox').setAttribute('aria-hidden', String(t));
  if (el('backbox')) el('backbox').setAttribute('aria-hidden', String(!t));
}

function backSvg(c, have, req, shop) {
  const CREAM = '#f6ead9', QUIET = '#c9b39c', GOLD = '#e8c27a', FOIL = 'url(#bk-gold)';
  const name = cutText(shop || 'Loyalty card', 22);
  const txt = (x, y, w, size, fill, words, extra) => '<text x="' + x + '" y="' + y + '" font-family="' + (extra && extra.f || 'system-ui, sans-serif') + '" font-weight="' + w + '" font-size="' + size + '" fill="' + fill + '"' + (extra && extra.a ? ' text-anchor="' + extra.a + '"' : '') + (extra && extra.ls ? ' letter-spacing="' + extra.ls + '"' : '') + '>' + esc(words) + '</text>';
  const first = cutText(String(c.name || '').trim().split(/\s+/)[0] || 'Customer', 24);
  const shown = c.code.length === 10 ? c.code.slice(0, 5) + ' ' + c.code.slice(5) : c.code;
  const PS = 27.4, PX = 85.6 - 5 - PS, PY = 19.2;
  let q = lastQr || '';
  q = q.replace('<svg', '<svg x="' + (PX + 1).toFixed(2) + '" y="' + (PY + 1).toFixed(2) + '" width="' + (PS - 2).toFixed(2) + '" height="' + (PS - 2).toFixed(2) + '"');
  const full = have !== null && have >= req;
  return '<svg class="face" viewBox="0 0 85.6 54" role="img" aria-label="' + esc(name + ', back of the card, code ' + shown) + '"><defs>' +
    '<radialGradient id="bk-glow" cx=".5" cy="1.15" r=".85"><stop offset="0" stop-color="#ff5a1a" stop-opacity=".5"/><stop offset=".45" stop-color="#b8300c" stop-opacity=".2"/><stop offset="1" stop-color="#17110e" stop-opacity="0"/></radialGradient>' +
    '<radialGradient id="bk-vig" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient>' +
    '<linearGradient id="bk-fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e8c27a" stop-opacity="0"/><stop offset=".5" stop-color="#e8c27a"/><stop offset="1" stop-color="#e8c27a" stop-opacity="0"/></linearGradient>' +
    '<linearGradient id="bk-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5dcaa"/><stop offset=".5" stop-color="#c9954a"/><stop offset="1" stop-color="#f0d08e"/></linearGradient></defs>' +
    '<rect width="85.6" height="54" fill="#17110e"/><rect width="85.6" height="54" fill="url(#bk-vig)"/><rect width="85.6" height="54" fill="url(#bk-glow)"/>' +
    txt(5.5, 9.6, 700, name.length > 16 ? 4.1 : 4.8, FOIL, name, { f: 'Georgia, serif' }) +

function leanCard() {
  const wrap = el('cardwrap'), tilt = el('tilt');
  if (!wrap || !tilt || calmMotion()) return;
  let frame = 0;
  const lean = function (e) {
    const r = wrap.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(function () { tilt.style.transform = 'rotateY(' + (x * 12).toFixed(2) + 'deg) rotateX(' + (-y * 9).toFixed(2) + 'deg)'; });
  };
  const rest = function () { cancelAnimationFrame(frame); tilt.style.transform = ''; };
  wrap.addEventListener('pointermove', lean);
  wrap.addEventListener('pointerdown', lean);
  wrap.addEventListener('pointerup', rest);
  wrap.addEventListener('pointerleave', rest);
  wrap.addEventListener('pointercancel', rest);
}

function phoneStore() { try { return window.localStorage; } catch (e) { return null; } }
function saveCard(store, key, card) {
  if (!store) return false;
  try { store.setItem(key, JSON.stringify(card)); return true; } catch (e) { return false; }
}
function forgetCard(store, key, code) {
  if (!store) return false;
  try { store.removeItem(key); if (code) store.removeItem('ember.stamps.' + code); return true; } catch (e) { return false; }
}
function showRemoved() {
  el('title').textContent = 'Loyalty card';

}

    txt(80.6, 13.6, 600, 1.6, GOLD, full ? 'free item ready' : 'stamps', { a: 'end', ls: '.5' });
  const totalH = g.rows * D + (g.rows - 1) * g.rowGap, top = 18.6 + (28 - totalH) / 2;
  for (let i = 0; i < req; i++) {
    const row = Math.floor(i / g.cols), col = i - row * g.cols, inRow = Math.min(g.cols, req - row * g.cols);
    const left = 5 + (75.6 - (inRow * D + (inRow - 1) * 2.4)) / 2;
    const cx = (left + col * (D + 2.4) + D / 2).toFixed(2), cy = (top + row * (D + g.rowGap) + D / 2).toFixed(2), r = (D / 2 - 0.15).toFixed(2);
    const at = 'cx="' + cx + '" cy="' + cy + '"';
    if (i < have) {
      const l = stampLook(code, i);
      const press = from >= 0 && i >= from;
      const delay = press ? ((i - from) * 0.24).toFixed(2) : (i * 0.07).toFixed(2);
      out += '<g class="' + (press ? 'press' : 'pop') + '" style="--d:' + delay + 's"><circle ' + at + ' r="' + r + '" fill="#ff5a1a" fill-opacity=".14"/><circle ' + at + ' r="' + r + '" fill="none" stroke="' + FOIL + '" stroke-width=".25"/>' +
        (press ? '<circle class="ink" ' + at + ' r="' + (D / 2 - 1).toFixed(2) + '"/>' : '') +
        '<g class="mk"><g transform="translate(' + (Number(cx) + l.dx * D).toFixed(2) + ' ' + (Number(cy) + (l.dy - 0.02) * D).toFixed(2) + ') rotate(' + l.rot.toFixed(2) + ') scale(' + (D * 1.12).toFixed(2) + ')" opacity="' + l.opacity.toFixed(4) + '"><use href="#emb-logo"/></g></g></g>';
      continue;
    }
    const last = i === req - 1;
    if (last && req <= 21) out += '<circle ' + at + ' r="' + r + '" fill="none" stroke="' + FOIL + '" stroke-width=".3"/><circle ' + at + ' r="' + (D / 2 - 1).toFixed(2) + '" fill="none" stroke="' + FOIL + '" stroke-width=".15"/>' +
      txt(cx, (Number(cy) + D * 0.07).toFixed(2), 700, (D * 0.21).toFixed(2), GOLD, 'FREE', { a: 'middle', ls: (D * 0.04).toFixed(2) });
    else if (last) out += '<circle ' + at + ' r="' + r + '" fill="none" stroke="' + FOIL + '" stroke-width=".3"/>';
    else out += '<circle ' + at + ' r="' + r + '" fill="none" stroke="' + FOIL + '" stroke-opacity=".55" stroke-width=".2" stroke-dasharray=".5 .7"/>';
  }
  out += txt(80.6, 50, 500, 1.3, GOLD, 'Made with Ember POS', { a: 'end', ls: '.5' }).replace('<text ', '<text opacity=".65" ') + '</svg>';
  return out;
}

function countUp(to) {
  const t = el('bignum');
  if (!t || calmMotion() || to < 1) return;
  const start = performance.now(), dur = 900 + to * 40;
  t.textContent = '0';
  const tick = function (now) {
    const k = Math.min(1, (now - start - 650) / dur);
    if (now - start >= 650) t.textContent = String(Math.round(to * (1 - Math.pow(1 - Math.max(0, k), 3))));
    if (k < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

async function loadStamps(c) {
  try {
    const r = await rpc('loyalty_card_status', { p_token: TOKEN, p_code: c.code });
    if (!r || !r.ok) return;
    const box = el('stampbox');
    if (!box) return;
    const req = Math.max(1, Math.min(50, Number(r.required) || 10));
    const have = Math.max(0, Number(r.stamps) || 0);
    const shownDots = Math.min(have, req);

    let from = -1;
    try {
      const key = 'ember.stamps.' + c.code;
      const was = localStorage.getItem(key);
      localStorage.setItem(key, String(shownDots));
      const prev = was === null ? NaN : parseInt(was, 10);
      if (Number.isFinite(prev) && shownDots > prev) from = Math.max(prev, shownDots - 3);
    } catch (e) {  }
    const calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const dots = stampsSvg(shownDots, req, c.code, calm ? -1 : from, c.shop);
    if (from >= 0 && !calm && navigator.vibrate) {
      for (let k = 0; k < shownDots - from; k++) setTimeout(function () { try { navigator.vibrate(15); } catch (e) {} }, k * 240 + 1100);
    }
    const left = req - have;
    const line = r.free_ready ? 'You have a free one ready. Ask at the counter!'
      : (left === 1 ? '1 more stamp for a free one.' : left + ' more stamps for a free one.');
    box.className = 'cardface';
    box.innerHTML = '<div class="stamps">' + dots + '</div>';
    drawBack(c, shownDots, req, c.shop);
    const stage = el('stage');
    if (stage && r.free_ready) stage.classList.add('ready');
    const prog = el('progress');
    if (prog) prog.innerHTML = '<div class="hero"><b id="bignum">' + shownDots + '</b><i>/' + req + '</i></div>' +
      '<div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="' + req + '" aria-valuenow="' + shownDots + '"><i style="--s:' + (shownDots / req).toFixed(3) + '"></i></div>' +
      '<div class="stampline' + (r.free_ready ? ' ready' : '') + '">' + esc(line) + '</div>';
    countUp(shownDots);
  } catch (e) {
    const box = el('stampbox');
    if (box) box.textContent = 'No signal. Turn the card over: your code still works at the counter.';
  }
}

function showForm(shop) {
  el('title').textContent = shop.shop || 'Loyalty card';
  el('sub').textContent = 'Join our loyalty card: a stamp with every visit, a free item after ' + shop.required + '.';
  el('main').innerHTML =
    '<div class="panel">' +
      '<label for="nm">Your name</label>' +

      '<input id="nm" autocomplete="name" maxlength="60" placeholder="Your name">' +
      '<label for="ph">Mobile number</label>' +
      '<input id="ph" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="Mobile number">' +
      '<label for="bd">Birthday <span>(optional, for a birthday treat)</span></label>' +
      '<input id="bd" type="date" autocomplete="bday">' +
      '<button class="go" id="go">Get my card</button>' +
      '<div class="msg" id="msg"></div>' +
      '<div class="note"><a href="#" id="have">I already have a card from the shop</a></div>' +
      '<div class="note">Your name and number (and birthday, if you add it) go to this shop only, for its loyalty card. Ember stores them for that shop. See the <a href="customer-terms.html">customer terms</a> and the <a href="privacy-policy.html">privacy policy</a>.</div>' +
    '</div>';

  const say = (text, kind) => {
    const m = el('msg');
    m.classList.remove('bad');
    if (kind === 'wait') { m.innerHTML = '<span class="waitdot"></span>' + esc(text); return; }
    m.textContent = text;
    if (kind === 'bad') { void m.offsetWidth; m.classList.add('bad'); }
  };

  const sayTaken = () => {
    const m = el('msg');
    m.classList.remove('bad');
    m.innerHTML = '<b>This number is already saved at this shop.</b>' +
      'Check the number you typed. If it is right, show this screen at the counter and they will give you your card there.';
    void m.offsetWidth; m.classList.add('bad');
  };
  el('have').onclick = function (e) { e.preventDefault(); showHaveCard(shop); };
  el('go').onclick = async function () {
    if (el('go').disabled) return;
    const name = el('nm').value.trim(), phone = el('ph').value.trim(), bday = el('bd').value || null;
    if (name.length < 2) { say('Type your name.', 'bad'); return; }
    if (phone.replace(/\D/g, '').length < 10) { say('Type your full mobile number.', 'bad'); return; }
    el('go').disabled = true; say('Making your card…', 'wait');
    try {
      const r = await rpc('loyalty_join', { p_token: TOKEN, p_name: name, p_phone: phone, p_birthday: bday });
      if (r && r.exists) { sayTaken(); el('go').disabled = false; return; }
      if (!r || !r.ok) { say((r && r.error) || 'Please ask at the counter.', 'bad'); el('go').disabled = false; return; }
      const card = { code: r.card_code, name: name, shop: r.shop || shop.shop || '' };
      saveCard(phoneStore(), KEY, card);
      showCard(card);
    } catch (e) {
      say('No connection. Try again in a moment.', 'bad');
      el('go').disabled = false;
    }
  };
}

const CODE_RE = /^[A-HJ-KM-NP-Z2-9]{10}$/;
function codeFromHash() {
  const m = /(?:^|[#&])c=([A-Za-z0-9 \-]+)/.exec(location.hash || '');
  const c = m ? m[1].replace(/[\s-]/g, '').toUpperCase() : '';
  return CODE_RE.test(c) ? c : '';
}
async function openByCode(code, shopName) {
  const r = await rpc('loyalty_card_status', { p_token: TOKEN, p_code: code });
  if (!r || !r.ok) return false;
  const card = { code: code, name: r.first_name || 'Loyalty card', shop: shopName || '' };
  saveCard(phoneStore(), KEY, card);

  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {  }
  showCard(card);
  return true;
}
function showHaveCard(shop) {
  el('title').textContent = shop.shop || 'Loyalty card';
  el('sub').textContent = 'See the stamps on the card the shop gave you.';
  el('main').innerHTML =
    '<div class="panel">' +
      '<label for="cc">The code under the QR on your card</label>' +
      '<input id="cc" autocomplete="off" autocapitalize="characters" maxlength="14" placeholder="ABCDE FGHJK">' +
      '<button class="go" id="go">Show my stamps</button>' +
      '<div class="msg" id="msg"></div>' +
      '<div class="note"><a href="#" id="back">I do not have a card yet</a></div>' +
    '</div>';
  el('back').onclick = function (e) { e.preventDefault(); showForm(shop); };
  el('go').onclick = async function () {
    if (el('go').disabled) return;
    const code = el('cc').value.replace(/[\s-]/g, '').toUpperCase();
    const m = el('msg');
    m.classList.remove('bad');
    if (!CODE_RE.test(code)) { m.textContent = 'Type the 10 letters and numbers under the QR on your card.'; void m.offsetWidth; m.classList.add('bad'); return; }
    el('go').disabled = true; m.textContent = 'Looking for your card…';
    try {
      if (await openByCode(code, shop.shop)) return;
      m.textContent = 'That code is not a card of this shop. Check it and try again, or ask at the counter.';
      void m.offsetWidth; m.classList.add('bad');
    } catch (e) {
      m.textContent = 'No connection. Try again in a moment.';
    }
    el('go').disabled = false;
  };
}

(async function () {
  if (!TOKEN) { el('main').innerHTML = '<div class="panel"><div class="msg">This link is not complete. Please scan the QR code again.</div></div>'; return; }
  let saved = null;
  try { saved = JSON.parse(phoneStore().getItem(KEY) || 'null'); } catch (e) { saved = null; }
  const scanned = codeFromHash();
  if (scanned && !(saved && saved.code === scanned)) {
    try {
      const shop = await rpc('loyalty_join_shop', { p_token: TOKEN });
      if (await openByCode(scanned, shop && shop.ok ? shop.shop : '')) return;
    } catch (e) {  }
  }
  if (saved && saved.code) { showCard(saved); return; }
  try {
    const shop = await rpc('loyalty_join_shop', { p_token: TOKEN });
    if (!shop || !shop.ok) { el('main').innerHTML = '<div class="panel"><div class="msg">' + esc((shop && shop.error) || 'Please ask at the counter.') + '</div></div>'; return; }
    showForm(shop);
  } catch (e) {
    el('main').innerHTML = '<div class="panel"><div class="msg">No connection. Check your signal and try again.</div></div>';
  }
})();
</script>
