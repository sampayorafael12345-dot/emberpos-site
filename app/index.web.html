<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- THIS PAGE ALREADY HAS A DARK THEME - DO NOT RE-TINT IT.
         Android WebView will otherwise "force dark" the page whenever the
         tablet's own system theme is dark, guessing element by element: it
         flipped the Menu screen's near-black tab strip to light grey and left
         the white writing on it untouched, which on the shop's iMin terminal
         was an unreadable strip that a laptop never showed. Declared here as
         well as in the stylesheet so it is true before any CSS has parsed. -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#151210" />
    <!--
      Content Security Policy.

      `script-src` has to keep 'unsafe-inline': the boot screen below is an inline
      script (on purpose — it is what shows a readable message when the bundle is
      too modern for an old WebView), and @vitejs/plugin-legacy emits its own
      inline System.import loader with a per-build hashed filename. So this policy
      does NOT try to prevent script injection.

      What it does instead is contain one: `connect-src` means an injected script
      cannot POST the shop's Supabase session token to an attacker's server, which
      is the step that turns XSS into a stolen shop. `object-src`/`base-uri` close
      the usual bypasses, and `frame-ancestors` stops clickjacking of the web
      build. Escaping in the print templates (src/lib/output.ts) remains the
      primary defence; this is the net under it.
    -->
    <!-- media-src is here because the customer screen plays the SHOP'S OWN
         file from that device when the counter is quiet (cds-idle-media.ts).
         There was no media-src line at all until 22 Sep 2026, so video fell
         through to `default-src 'self'` and a picked file was refused -
         measured on the running app: "media-src <- blob", "Media load rejected
         by URL safety check". The picture beside it loaded, because img-src has
         listed blob: for years. Deliberately no http(s): the idle screen may
         play what the shop put on the glass and nothing off the internet. -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: blob: https:;
      media-src 'self' data: blob:;
      font-src 'self' data:;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co;
      object-src 'none';
      base-uri 'self';
      form-action 'none';
      frame-ancestors 'none';
    " />
    <title>Ember POS</title>
    <!-- Browser-tab niceties for the web deploy. Inert inside Capacitor (no
         tabs) and harmless in dev. noindex: this is an app shell, not content
         — the landing page is what search engines should hold. -->
    <!-- A SQUARE file, not the trimmed mark: a tab slot is square and the
         browser stretches rather than letterboxes, which fattened the flame. -->
    <link rel="icon" href="/app/brand/favicon.png" type="image/png" />
    <meta name="robots" content="noindex" />
    <!-- INSTALLABLE ON A PHONE HOME SCREEN.
         This matters most on iPhone: there is no App Store build yet, so
         Safari's "Add to Home Screen" is how an iOS shop gets an app icon and
         a full-screen app with no browser chrome. Safari ignores the manifest
         for the icon and the status bar, hence the apple-* tags alongside it.
         Paths are relative so they resolve under whatever base the build uses
         (/app/ on the website, / in dev, unused inside Capacitor). -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ember POS" />
    <style>html,body{color:#ece7df;background:#151210;height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#boot{text-align:center;background:radial-gradient(600px 360px at 50% 30%,rgba(255,92,0,.16),transparent 65%),#151210;justify-content:center;align-items:center;padding:24px;display:flex;position:fixed;top:0;bottom:0;left:0;right:0}#boot .msg{max-width:560px;font-size:15px;line-height:1.5}#boot .err{white-space:pre-wrap;word-break:break-word;color:#fca5a5;text-align:left;background:rgba(0,0,0,.3);border-radius:8px;max-height:50vh;margin-top:14px;padding:10px;font-size:12px;overflow:auto}#boot strong{color:#fbbf24}#boot .tile{justify-content:center;align-items:center;height:76px;margin:0 auto 14px;animation:1.6s ease-in-out infinite bootpulse;display:flex}#boot .tile img{filter:drop-shadow(0 6px 26px rgba(255,92,0,.4));width:auto;height:76px;display:block}#boot .word{letter-spacing:3px;color:#ff6a1a;font-size:26px;font-weight:800}#boot .word span{color:#feb700}#boot .sub{color:rgba(236,231,223,.5);margin-top:6px;font-size:13px}@keyframes bootpulse{0%,to{opacity:1;transform:scale(1)}50%{opacity:.85;transform:scale(.94)}}</style>
    
  </head>
  <body>
    <div id="root"></div>
    <!-- Boot screen: branded splash while the bundle loads, and readable text
         instead of a black screen if the app can't start (common on very old
         device WebViews). Plain ES5 + static markup only, so it works even when
         the main bundle's syntax is too modern for the WebView. -->
    <div id="boot"><div class="msg">
      <div class="tile"><img src="/app/brand/logo-mark.png" height="76" alt=""></div>
      <div class="word">EMBER <span>POS</span></div>
      <div class="sub">Starting up&hellip;</div>
    </div></div>
    <script>
      (function () {
        function show(title, detail) {
          var b = document.getElementById('boot');
          if (!b) return;
          b.style.display = 'flex';
          var html = '<div class="msg"><strong>' + title + '</strong>';
          if (detail) { html += '<div class="err">' + String(detail).replace(/</g, '&lt;') + '</div>'; }
          html += '</div>';
          b.innerHTML = html;
        }
        // Called by the app once React has mounted, to clear this boot screen.
        window.__emberHideBoot = function () { var b = document.getElementById('boot'); if (b) b.parentNode.removeChild(b); };
        window.addEventListener('error', function (e) {
          show('Ember POS could not start on this device.',
            (e && e.message ? e.message : 'Script error') + (e && e.filename ? '\n' + e.filename + ':' + e.lineno : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason;
          show('Ember POS hit an error while starting.', r && r.message ? r.message : String(r));
        });
        // Failsafe: nothing rendered after 12s -> almost always an out-of-date WebView.
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childNodes.length === 0) {
            show('Ember POS did not finish loading.',
              'The page loaded but the app did not render. This usually means the device\'s "Android System WebView" is out of date and cannot run the app. Update Android System WebView / Chrome, or check the internet connection, then reopen.');
          }
        }, 12000);
      })();
    </script>
    <script crossorigin id="vite-legacy-polyfill" src="/app/assets/polyfills-legacy-BAS5e7E2.js"></script>
    <script crossorigin id="vite-legacy-entry" data-src="/app/assets/index.web-legacy-BDYnzpfy.js">System.import(document.getElementById('vite-legacy-entry').getAttribute('data-src'))</script>
  </body>
</html>
