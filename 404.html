<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found: Ember POS</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#ff5c00" />
<link rel="icon" href="/favicon.png" type="image/png" />
<style>
  /* THE KITCHEN RAIL, like the rest of the site (27 Sep 2026): a page that is
     not there is an order that never came in. Absolute paths on purpose:
     GitHub Pages serves this page for any missing URL, at any depth. */
  @font-face { font-family: 'Space Grotesk'; src: url('/fonts/space-grotesk-latin-wght-normal.woff2') format('woff2-variations'); font-weight: 300 700; font-display: swap; }
  @font-face { font-family: 'Poster'; src: url('/fonts/big-shoulders-display-latin-wght.woff2') format('woff2-variations'); font-weight: 100 900; font-display: swap; }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 48px 20px;
    background: radial-gradient(rgba(11,12,13,.14) 1.4px, transparent 1.7px) 0 0 / 22px 22px, #ff5c00;
    color: #0b0c0d; font: 17px/1.6 'Space Grotesk', system-ui, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .box { position: relative; width: 460px; max-width: 100%; text-align: center; display: flex; flex-direction: column; align-items: center;
    background: #fbfaf7; border-radius: 8px; padding: 0 28px 30px; box-shadow: 0 1px 0 rgba(0,0,0,.08), 0 26px 40px -26px rgba(0,0,0,.5); }
  .box::before { content: ""; position: absolute; left: 50%; top: -14px; width: 54px; height: 22px; margin-left: -27px; border-radius: 4px 4px 2px 2px; background: #3a3f45; box-shadow: inset 0 -3px 0 rgba(0,0,0,.35); }
  .code { order: -1; align-self: stretch; margin: 0 -28px 26px; padding: 12px 18px; border-radius: 8px 8px 0 0; background: #b91c1c; color: #fff;
    font: 700 13px ui-monospace, 'Cascadia Mono', Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; text-align: left; }
  .box img { height: 46px; width: auto; display: block; margin: 0 auto 8px; }
  h1 { font: 900 clamp(52px, 13vw, 76px)/.88 'Poster', 'Space Grotesk', sans-serif; text-transform: uppercase; margin-top: 10px; }
  p { color: #3d444c; margin-top: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 26px; align-self: stretch; }
  .row a {
    flex: 1 1 160px; display: inline-flex; justify-content: center; align-items: center; min-height: 52px; padding: 0 18px;
    border-radius: 10px; border: 2.5px solid #0b0c0d; text-decoration: none; font-weight: 700; font-size: 16px;
    transition: transform 120ms ease, box-shadow 140ms ease;
  }
  .row a:active { transform: translateY(1px); }
  .flame { background: #0b0c0d; color: #fff; }
  .ghost { background: #fff; color: #0b0c0d; }
  @media (hover: hover) { .row a:hover { transform: translateY(-2px); box-shadow: 0 5px 0 #ff5c00; } }
  a:focus-visible { outline: 3px solid #0b0c0d; outline-offset: 3px; }
  /* A shop's short link (emberpos.net/k8s) lands here first - see the script
     at the bottom. While it is looked up, say that instead of "not found". */
  .looking .box > :not(.opening) { display: none; }
  .opening { display: none; color: #3d444c; }
  .looking .opening { display: block; padding-top: 24px; }
</style>
<script>
  // Decided before the page paints, so a shop link never flashes "not found".
  (function () {
    var slug = location.pathname.replace(/^\/+|\/+$/g, '');
    if (/^[A-Za-z0-9-]{3,30}$/.test(slug)) document.documentElement.className = 'looking';
  })();
</script>
</head>
<body>
<main class="box">
  <img src="/logo.png" alt="Ember POS" />
  <p class="opening">Opening the shop&hellip;</p>
  <span class="code">#404 &middot; Page not found</span>
  <h1>This page does not exist.</h1>
  <p>The link may have a typo, or the page was moved. You can go back to the home page or open the app.</p>
  <div class="row">
    <a class="flame" href="/">Home page</a>
    <a class="ghost" href="/app/">Open the app</a>
  </div>
</main>
<script>
  /* A SHOP'S SHORT LINK (1.5.0, migration 0216). emberpos.net/<name> is not a
     file, so GitHub Pages serves this page. Ask which shop owns the name and
     go to its ordering page; if nobody does, show "not found" after all. */
  (function () {
    if (document.documentElement.className !== 'looking') return;
    var slug = location.pathname.replace(/^\/+|\/+$/g, '');
    var URLB = 'https://qqmkgafyfxrcnwdkkyxc.supabase.co';
    var ANON = 'sb_publishable_-cAsxVwroAl8NPHIQnrKMw_PsBEYAYX';
    var done = function () { document.documentElement.className = ''; };
    fetch(URLB + '/rest/v1/rpc/shop_link_token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: ANON, Authorization: 'Bearer ' + ANON },
      body: JSON.stringify({ p_slug: slug }),
    }).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (token) {
        if (typeof token === 'string' && token) location.replace('/order.html?t=' + encodeURIComponent(token));
        else done();
      })
      .catch(done);
  })();
</script>
</body>
</html>
