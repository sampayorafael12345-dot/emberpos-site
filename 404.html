<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found: Ember POS</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.png" type="image/png" />
<style>
  /* The counter machine's "no such item" slip: coal room, one receipt. */
  @font-face { font-family: 'Big Shoulders Display'; src: url('/fonts/big-shoulders-display-latin-wght.woff2') format('woff2-variations'); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: 'Azeret Mono'; src: url('/fonts/azeret-mono-latin-wght.woff2') format('woff2-variations'); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: 'Barlow'; src: url('/fonts/barlow-latin-400.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    background: #16120f; color: #efe9df; padding: 24px;
    font: 17px/1.55 'Barlow', system-ui, 'Segoe UI', Roboto, sans-serif;
  }
  .slip {
    width: 360px; max-width: 100%; background: #f7f4ee; color: #171411; padding: 26px 22px 30px;
    font-family: 'Azeret Mono', ui-monospace, monospace; font-size: 13px; line-height: 1.5;
    box-shadow: 0 14px 30px -12px rgba(0,0,0,.6);
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 7px), 95% 100%, 90% calc(100% - 7px), 85% 100%, 80% calc(100% - 7px), 75% 100%, 70% calc(100% - 7px), 65% 100%, 60% calc(100% - 7px), 55% 100%, 50% calc(100% - 7px), 45% 100%, 40% calc(100% - 7px), 35% 100%, 30% calc(100% - 7px), 25% 100%, 20% calc(100% - 7px), 15% 100%, 10% calc(100% - 7px), 5% 100%, 0 calc(100% - 7px));
  }
  .slip img { height: 44px; width: auto; display: block; margin: 0 auto 10px; }
  .slip h1 { font-family: 'Big Shoulders Display', Impact, sans-serif; font-weight: 800; text-transform: uppercase; font-size: 34px; line-height: .95; text-align: center; letter-spacing: 0; }
  .slip .rule { border-top: 1px dashed #cfc8bd; margin: 14px 0; }
  .slip .ln { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
  .slip .ln span:last-child { font-weight: 600; }
  .slip p { font-family: 'Barlow', system-ui, sans-serif; color: #3f3a34; font-size: 15px; margin-top: 8px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .row a {
    flex: 1; display: inline-flex; justify-content: center; padding: 13px 14px; border-radius: 6px; text-decoration: none;
    font-family: 'Azeret Mono', ui-monospace, monospace; font-weight: 600; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    box-shadow: inset 0 1px 0 #332a24, inset 0 -1px 0 #0b0908; transition: background 140ms ease, transform 90ms ease;
  }
  .row a:active { transform: translateY(1px); }
  .flame { background: #ff5c00; color: #fff; }
  .flame:hover { background: #d94e00; }
  .ghost { background: #211b17; color: #efe9df; }
  .ghost:hover { background: #332a24; }
</style>
</head>
<body>
<div class="slip">
  <img src="/logo.png" alt="" />
  <h1>No such item</h1>
  <div class="rule"></div>
  <div class="ln"><span>Page</span><span>not on the menu</span></div>
  <div class="ln"><span>Reason</span><span>moved or mistyped</span></div>
  <div class="ln"><span>Charge</span><span>&#8369;0.00</span></div>
  <div class="rule"></div>
  <p>The address may have a small mistake in it, or the page has moved. The front page and the app are still where they were.</p>
  <div class="row">
    <a class="flame" href="/">Front page</a>
    <a class="ghost" href="/app/">Open the app</a>
  </div>
</div>
</body>
</html>
