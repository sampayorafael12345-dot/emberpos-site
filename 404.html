<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found: Ember POS</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.png" type="image/png" />
<style>
  @font-face {
    font-family: 'Space Grotesk';
    src: url('/fonts/space-grotesk-latin-wght-normal.woff2') format('woff2-variations');
    font-weight: 300 700; font-display: swap;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(600px 360px at 50% 30%, rgba(255,92,0,.14), transparent 65%), #0c0a09;
    color: #ece7df; text-align: center; padding: 24px;
    font: 16.5px/1.6 'Space Grotesk', ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif;
  }
  img { width: 64px; height: 64px; margin: 0 auto 18px; display: block; }
  h1 { font-size: 30px; letter-spacing: -.01em; margin-bottom: 8px; }
  p { color: #a89c90; max-width: 380px; margin: 0 auto 26px; }
  .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a {
    display: inline-flex; padding: 12px 22px; border-radius: 12px; font-weight: 600;
    text-decoration: none; transition: transform 160ms cubic-bezier(0.23,1,0.32,1), filter 160ms cubic-bezier(0.23,1,0.32,1);
  }
  a:active { transform: scale(.97); }
  .flame { background: #ff5c00; color: #fff; }
  .ghost { border: 1.5px solid #2b2420; color: #ece7df; }
  @media (hover: hover) and (pointer: fine) {
    .flame:hover { filter: brightness(1.08); }
    .ghost:hover { border-color: #ff5c00; }
  }
</style>
</head>
<body>
<div>
  <img src="/logo.png" alt="" />
  <h1>That page is not here.</h1>
  <p>The address may have been typed with a small mistake, or the page has moved.</p>
  <div class="row">
    <a class="flame" href="/">Go to the front page</a>
    <a class="ghost" href="/app/">Open the back office</a>
  </div>
</div>
</body>
</html>
