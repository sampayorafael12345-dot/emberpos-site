<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found: Ember POS</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0b0c0d" />
<link rel="icon" href="/favicon.png" type="image/png" />
<style>
  /* Graphite and flame, like the rest of the site (23 Sep 2026). Absolute
     paths on purpose: GitHub Pages serves this page for any missing URL, at
     any depth. */
  @font-face { font-family: 'Space Grotesk'; src: url('/fonts/space-grotesk-latin-wght-normal.woff2') format('woff2-variations'); font-weight: 300 700; font-display: swap; }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px;
    background: #0b0c0d;
    color: #f2f3f4; font: 17px/1.6 'Space Grotesk', system-ui, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .box { width: 440px; max-width: 100%; text-align: center; }
  .box img { height: 48px; width: auto; display: block; margin: 0 auto 26px; }
  .code { display: inline-block; font-weight: 600; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: #ff7a33; padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(255,122,51,.4); background: rgba(255,92,0,.08); }
  h1 { font-size: clamp(34px, 8vw, 48px); line-height: 1.02; letter-spacing: -0.045em; margin-top: 18px; font-weight: 700; }
  p { color: #b3bac1; margin-top: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 28px; }
  .row a {
    flex: 1 1 160px; display: inline-flex; justify-content: center; align-items: center; min-height: 50px; padding: 0 18px;
    border-radius: 14px; text-decoration: none; font-weight: 600; font-size: 16px;
    transition: background-color 160ms ease, transform 120ms ease;
  }
  .row a:active { transform: scale(.97); }
  .flame { background: #ff5c00; color: #0b0c0d; }
  .flame:hover { background: #ff7a33; }
  .ghost { background: rgba(255,255,255,.04); color: #f2f3f4; border: 1px solid rgba(255,255,255,.14); }
  .ghost:hover { background: rgba(255,255,255,.09); }
  a:focus-visible { outline: 2px solid #ff5c00; outline-offset: 3px; }
  /* A shop's short link (emberpos.net/k8s) lands here first - see the script
     at the bottom. While it is looked up, say that instead of "not found". */
  .looking .box > :not(.opening) { display: none; }
  .opening { display: none; color: #b3bac1; }
  .looking .opening { display: block; }
</style>
<script>
  // Decided before the page paints, so a shop link never flashes "not found".
  (function () {
    var slug = location.pathname.replace(/^\/+|\/+$/g, '');
    if (/^[A-Za-z0-9-]{3,30}$/.test(slug)) document.documentElement.className = 'looking';
  })();
</script>
</head>
<body>
<main class="box">
  <img src="/logo.png" alt="Ember POS" />
  <p class="opening">Opening the shop&hellip;</p>
  <span class="code">Page not found</span>
  <h1>This page does not exist.</h1>
  <p>The link may have a typo, or the page was moved. You can go back to the home page or open the app.</p>
  <div class="row">
    <a class="flame" href="/">Home page</a>
    <a class="ghost" href="/app/">Open the app</a>
  </div>
</main>
<script>
  /* A SHOP'S SHORT LINK (1.5.0, migration 0216). emberpos.net/<name> is not a
     file, so GitHub Pages serves this page. Ask which shop owns the name and
     go to its ordering page; if nobody does, show "not found" after all. */
  (function () {
    if (document.documentElement.className !== 'looking') return;
    var slug = location.pathname.replace(/^\/+|\/+$/g, '');
    var URLB = 'https://qqmkgafyfxrcnwdkkyxc.supabase.co';
    var ANON = 'sb_publishable_-cAsxVwroAl8NPHIQnrKMw_PsBEYAYX';
    var done = function () { document.documentElement.className = ''; };
    fetch(URLB + '/rest/v1/rpc/shop_link_token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: ANON, Authorization: 'Bearer ' + ANON },
      body: JSON.stringify({ p_slug: slug }),
    }).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (token) {
        if (typeof token === 'string' && token) location.replace('/order.html?t=' + encodeURIComponent(token));
        else done();
      })
      .catch(done);
  })();
</script>
</body>
</html>
