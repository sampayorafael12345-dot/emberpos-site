<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- THIS PAGE ALREADY HAS A DARK THEME - DO NOT RE-TINT IT.
         Android WebView will otherwise "force dark" the page whenever the
         tablet's own system theme is dark, guessing element by element: it
         flipped the Menu screen's near-black tab strip to light grey and left
         the white writing on it untouched, which on the shop's iMin terminal
         was an unreadable strip that a laptop never showed. Declared here as
         well as in the stylesheet so it is true before any CSS has parsed. -->
    <meta name="color-scheme" content="dark light" />
    <!--
      CSP for the public demo. As strict as the desktop renderer's, plus the
      one thing sql.js needs in a browser: 'wasm-unsafe-eval' to instantiate
      its WebAssembly.

      connect-src is the promise this page makes, ENFORCED rather than
      described: the sample shop fetches its own wasm and its own seeded
      demo-shop.db, and the only other address it may reach in the world is
      the one named below. That is the demo-ping function, which takes a
      random id the device made up for itself and nothing else — no account,
      no shop, nothing typed in here (see src/demo/ping.ts and migration
      0154). Anything else the code might one day try to send anywhere is
      stopped by the browser, not by a comment.

      NOTE THE PATH. What is allowed is not the Supabase ORIGIN but one exact
      endpoint, and that distinction is the whole control — because this
      bundle is NOT free of the cloud client. It bundles the shared app code,
      which drags supabase-js and the publishable key in with it. Allowing the
      bare origin would have left the REST and auth APIs reachable from this
      page; scoped to this path they are not, whatever the code tries, because
      the browser refuses the request before it is sent.

      Adding a host here is therefore a deliberate act, and there should never
      be a second one. Note also that a blocked request FAILS SILENTLY by
      design (the ping swallows its own errors so it can never break the cafe)
      — so a ping added without its path here would ship dead and look fine,
      which is exactly what happened before this line existed.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'wasm-unsafe-eval';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: blob:;
      font-src 'self' data:;
      connect-src 'self' https://qqmkgafyfxrcnwdkkyxc.supabase.co/functions/v1/demo-ping;
      object-src 'none';
      base-uri 'self';
      form-action 'none';
    " />
    <meta name="robots" content="noindex" />
    <title>Ember POS — Live Demo</title>
    <style>html,body{background:#151210;height:100%;margin:0}#demo-boot{color:#a89c90;z-index:9999;background:#151210;flex-direction:column;justify-content:center;align-items:center;gap:14px;font:15px/1.5 ui-sans-serif,system-ui,sans-serif;transition:opacity .3s;display:flex;position:fixed;inset:0}#demo-boot .logo{height:84px}</style>
    <script type="module" crossorigin src="/demo/assets/index.demo-BQj0GC6P.js"></script>
  </head>
  <body class="bg-ember-coal text-white">
    <div id="demo-boot">
      <div class="logo" data-ember-logo></div>
      <div id="demo-boot-msg">Opening your demo shop&hellip;</div>
    </div>
    <div id="root"></div>
    <script src="brand/logo-loader.js"></script>
  </body>
</html>
