<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<title>Order</title>
<link rel="icon" href="favicon.png">
<!--
  EmberPOS self-order page. A customer scans the QR on their table (or taps a
  kiosk tablet) and lands here:  order.html?t=<token>

  It talks to exactly three SECURITY DEFINER functions in the database
  (kiosk_menu / kiosk_place_order / kiosk_order_status, migrations 0044+0045).
  There is no table access: an anonymous caller has no business under RLS, so
  those three doors are the entire attack surface. Prices are recomputed
  server-side on every order, so nothing this page says about money is
  believed. Orders land unpaid and, unless the shop opts in, wait for staff.

  Deployed by dropping the netlify-drop folder on Netlify, same as the legal
  pages. Dependency-free on purpose: it has to open instantly on a cheap phone
  over café wifi, and a customer will not wait for a framework to boot.
-->
<style>
  /* One theme system, following the phone. A diner in daylight gets a light
     page they can actually read; the same shop at night gets the dark one. */
  :root {
    color-scheme: light dark;
    --bg: #ffffff;          --bg-sub: #f4f4f5;
    --card: #ffffff;        --line: #e4e4e7;
    --text: #18181b;        --muted: #5f5f6b;
    --accent: #c2410c;      --accent-ink: #ffffff;
    --ok: #047857;          --warn: #b45309;
    --shadow: 0 1px 2px rgb(0 0 0 / .06), 0 8px 24px rgb(0 0 0 / .06);
    --r-sm: 10px; --r-md: 14px; --r-lg: 20px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111214;        --bg-sub: #17181b;
      --card: #1b1c20;      --line: #2c2e34;
      --text: #f4f4f5;      --muted: #a5a5ae;
      --accent: #ff6b1a;    --accent-ink: #1a0e05;
      --ok: #34d399;        --warn: #fbbf24;
      --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 10px 30px rgb(0 0 0 / .35);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overscroll-behavior-y: none; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.45;
    padding-bottom: calc(104px + env(safe-area-inset-bottom));
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  /* Header ------------------------------------------------------------- */
  .top {
    position: sticky; top: 0; z-index: 20; background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: calc(14px + env(safe-area-inset-top)) 16px 0;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .brand h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .where { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .mine {
    margin-left: auto; flex: 0 0 auto; align-self: center; white-space: nowrap;
    border: 1px solid var(--line); background: var(--bg-sub); color: var(--text);
    border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 600;
  }
  /* One vertical rhythm for the whole page. Section gap 18px, card gap 10px. */
  .sec-gap { height: 18px; }
  .search { position: relative; margin: 12px 0; }
  .search input {
    width: 100%; padding: 11px 14px 11px 38px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--bg-sub); font-size: 15px;
  }
  .search input::placeholder { color: var(--muted); }
  .search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .cats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
  .cats::-webkit-scrollbar { display: none; }
  .cat {
    flex: 0 0 auto; padding: 8px 14px; border-radius: 999px; font-size: 14px;
    border: 1px solid var(--line); background: var(--bg-sub); color: var(--muted);
  }
  .cat[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

  /* Menu ---------------------------------------------------------------- */
  .list { padding: 14px 16px; display: grid; gap: 10px; }
  .item {
    display: flex; gap: 12px; align-items: center; width: 100%; text-align: left;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md);
    padding: 10px; transition: border-color .15s, transform .1s;
  }
  .item:active { transform: scale(.99); border-color: var(--accent); }
  .thumb {
    width: 62px; height: 62px; border-radius: var(--r-sm); flex: 0 0 auto;
    object-fit: cover; background: var(--bg-sub);
    display: grid; place-items: center; font-weight: 700; color: var(--muted); font-size: 20px;
  }
  .item .nm { font-weight: 600; font-size: 15px; line-height: 1.3; }
  .item .ds { color: var(--muted); font-size: 12.5px; margin-top: 3px;
              display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item .meal { color: var(--accent); font-size: 12.5px; font-weight: 600; margin-top: 3px; }
  .item .pr { margin-left: auto; font-weight: 700; white-space: nowrap; align-self: flex-start; }
  /* Sold out: SHOWN, not hidden. Diners kept asking the counter whether an
     item was available because a missing item looks the same as one that was
     never on the menu. Greyed, unpressable, and it says so. */
  .item.out { opacity: .48; }
  .item.out:active { transform: none; border-color: var(--line); }
  .item.out .thumb { filter: grayscale(1); }
  .item.out .pr { text-decoration: line-through; color: var(--muted); }
  .soldout {
    display: inline-block; margin-top: 4px; padding: 2px 7px; border-radius: 999px;
    font-size: 10.5px; font-weight: 700; letter-spacing: .02em;
    background: var(--line); color: var(--muted);
  }
  /* Category heading: 18px above, 8px below its cards, never doubled up. */
  .grp { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .04em;
         text-transform: uppercase; padding: 18px 16px 0; }
  .grp:first-of-type { padding-top: 14px; }
  .list-tight { padding-top: 8px; padding-bottom: 0; }
  .list-tight:last-of-type { padding-bottom: 14px; }

  /* Bottom bar ---------------------------------------------------------- */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--card);
    border-top: 1px solid var(--line); box-shadow: var(--shadow);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    display: flex; gap: 12px; align-items: center;
  }
  .bar .sum { min-width: 92px; }
  .bar .sum b { display: block; font-size: 18px; }
  .bar .sum span { color: var(--muted); font-size: 12px; }
  .primary {
    flex: 1; background: var(--accent); color: var(--accent-ink); border-radius: var(--r-sm);
    padding: 14px 16px; font-size: 16px; font-weight: 700; white-space: nowrap;
    transition: transform .1s, opacity .15s;
  }
  .primary:active { transform: translateY(1px); }
  .primary[disabled] { opacity: .4; cursor: default; }
  .ghost {
    border: 1px solid var(--line); background: var(--bg-sub); border-radius: var(--r-sm);
    padding: 14px 18px; font-weight: 600;
  }

  /* Sheet --------------------------------------------------------------- */
  .scrim { position: fixed; inset: 0; z-index: 40; background: rgb(0 0 0 / .5); display: none; }
  .scrim.on { display: block; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; max-height: 90vh; overflow: auto;
    background: var(--bg); border-radius: var(--r-lg) var(--r-lg) 0 0;
    padding: 8px 16px calc(16px + env(safe-area-inset-bottom));
    animation: rise .22s cubic-bezier(.16,1,.3,1);
  }
  @keyframes rise { from { transform: translateY(14px); opacity: .6 } to { transform: none; opacity: 1 } }
  @media (prefers-reduced-motion: reduce) {
    .sheet { animation: none; }
    .item:active, .primary:active { transform: none; }
  }
  .grab { width: 38px; height: 4px; border-radius: 99px; background: var(--line); margin: 6px auto 14px; }
  .sheet h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: -.01em; }
  .sheet .lede { color: var(--muted); font-size: 14px; margin: 0 0 4px; }
  .label { font-size: 12.5px; font-weight: 700; color: var(--muted); margin: 18px 0 8px; letter-spacing: .04em; text-transform: uppercase; }
  /* "Required" sits inside its section heading so the ask reads as part of it. */
  .req {
    display: inline-block; margin-left: 8px; padding: 2px 7px; border-radius: 999px;
    font-size: 10.5px; font-weight: 700; letter-spacing: .02em; text-transform: none;
    background: var(--line); color: var(--muted); vertical-align: 1px;
  }
  .req-on { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .opt {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    border: 1px solid var(--line); background: var(--card); border-radius: var(--r-sm);
    padding: 13px; margin-bottom: 8px; font-size: 15px;
  }
  .opt[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); font-weight: 600; }
  .opt .delta { margin-left: auto; color: var(--muted); font-size: 14px; }
  .opt[aria-pressed="true"] .delta { color: var(--accent); }
  .note-in { width: 100%; padding: 12px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--bg-sub); }
  .stepper { display: flex; align-items: center; gap: 14px; }
  .stepper button { width: 42px; height: 42px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--bg-sub); font-size: 20px; font-weight: 700; }
  .stepper span { min-width: 26px; text-align: center; font-weight: 700; font-size: 17px; }
  /* Add-on rows carry their own little stepper once one is taken, so a diner
     who wants double pearls can say so instead of asking at the counter. */
  .adq { display: flex; align-items: center; gap: 4px; margin-left: 10px; }
  .adq button {
    width: 34px; height: 34px; border-radius: var(--r-sm); border: 1px solid var(--line);
    background: var(--bg-sub); font-size: 18px; font-weight: 700; line-height: 1;
  }
  .adq b { min-width: 20px; text-align: center; font-size: 15px; }
  .opt .adq + .delta, .opt .delta.pushed { margin-left: 0; }
  .row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .row:last-of-type { border-bottom: 0; }
  .totals { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 12px; }
  .totals div { display: flex; justify-content: space-between; padding: 3px 0; color: var(--muted); font-size: 14px; }
  .totals div.grand { color: var(--text); font-weight: 800; font-size: 19px; padding-top: 8px; }

  /* States -------------------------------------------------------------- */
  .center { text-align: center; padding: 56px 24px; }
  .center h2 { margin: 0 0 8px; font-size: 20px; }
  .center p { color: var(--muted); margin: 0 auto; max-width: 320px; font-size: 14.5px; }
  .skel { background: var(--bg-sub); border-radius: var(--r-md); height: 84px; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .55 } }
  @media (prefers-reduced-motion: reduce) { .skel { animation: none } }
  .toast {
    position: fixed; left: 50%; bottom: calc(112px + env(safe-area-inset-bottom));
    transform: translateX(-50%); z-index: 60;
    background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 600; box-shadow: var(--shadow); max-width: 90vw;
  }
  .num { font-size: 40px; font-weight: 800; letter-spacing: .5px; margin: 10px 0 18px; }
  .steps { display: grid; gap: 10px; max-width: 320px; margin: 0 auto; text-align: left; }
  .step { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: var(--r-sm);
          border: 1px solid var(--line); background: var(--card); color: var(--muted); font-size: 14.5px; }
  .step.on { border-color: var(--accent); color: var(--text); font-weight: 700; }
  .step.done { color: var(--text); }
  .dot { width: 10px; height: 10px; border-radius: 99px; background: var(--line); flex: 0 0 auto; }
  .step.on .dot { background: var(--accent); }
  .step.done .dot { background: var(--ok); }
</style>
</head>
<body>
<main id="app" aria-live="polite">
  <div class="list" aria-hidden="true">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </div>
</main>
<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const URLB = 'https://qqmkgafyfxrcnwdkkyxc.supabase.co';
const ANON = 'sb_publishable_-cAsxVwroAl8NPHIQnrKMw_PsBEYAYX';

const el = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

async function rpc(fn, args) {
  const r = await fetch(URLB + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: ANON, Authorization: 'Bearer ' + ANON },
    body: JSON.stringify(args),
  });
  if (!r.ok) throw new Error('network');
  return await r.json();
}

/* shop-pay's kiosk actions: fenced by this page's own link token + the order
   number that token created. The shop's key never comes anywhere near here -
   only a QR image and a paid/unpaid answer do. */
async function payFn(args) {
  const r = await fetch(URLB + '/functions/v1/shop-pay', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: ANON, Authorization: 'Bearer ' + ANON },
    body: JSON.stringify(args),
  });
  var j = null; try { j = await r.json(); } catch (e) { /* not JSON */ }
  return j || {};
}

function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } }

let MENU = null, CART = [], CUR = '₱', TAXPCT = 0, CAT = 'all', Q = '';
/* STOREFRONT (v1.1.94): non-null only when the link's kind is 'store'. Holds
   the shop's ordering rules straight from kiosk_menu - the server re-checks
   every one of them in kiosk_place_order, so this is display, not the fence. */
let STORE = null;
let OMODE = 'pickup';       // 'pickup' | 'delivery'
let PAYCHOICE = 'later';    // 'now' | 'later'

// Headings for each kind of add-on, matching the register's wording.
const ADDON_LABELS = {
  addons: 'Add to this', temp: 'Temperature', sugar: 'Sugar level',
  omit: 'Leave out', spice: 'Spice', service: 'Service', other: 'Options',
};

const money = (c) => CUR + (c / 100).toFixed(2);
const count = () => CART.reduce((s, l) => s + l.qty, 0);
const subtotal = () => CART.reduce((s, l) => s + l.price * l.qty, 0);
// Mirror of the server's arithmetic (migrations 0045 + 0137) so the number
// the customer agrees to is the number the shop charges. The delivery fee is
// a vatable line on the server, so it joins the tax base here too.
const deliveryFee = () => (STORE && OMODE === 'delivery' ? (STORE.delivery_fee_cents || 0) : 0);
const taxOf = () => Math.round((CART.reduce((s, l) => s + (l.taxExempt ? 0 : l.price * l.qty), 0) + deliveryFee()) * TAXPCT / 100);
const total = () => subtotal() + deliveryFee() + taxOf();
const minPay = () => (STORE && STORE.min_prepay_cents) || 2000;

let toastTimer;
function toast(msg) {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  const d = document.createElement('div');
  d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = msg;
  document.body.appendChild(d);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => d.remove(), 2600);
}

function thumb(i) {
  if (i.image && String(i.image).startsWith('data:')) {
    return '<img class="thumb" src="' + esc(i.image) + '" alt="" loading="lazy">';
  }
  return '<div class="thumb" aria-hidden="true">' + esc((i.name || '?').trim().charAt(0).toUpperCase()) + '</div>';
}

function visibleItems() {
  const q = Q.trim().toLowerCase();
  const list = MENU.items.filter((i) => {
    if (CAT !== 'all' && i.category_id !== CAT) return false;
    if (!q) return true;
    return i.name.toLowerCase().includes(q) || (i.description || '').toLowerCase().includes(q);
  });
  // Sold-out items sink to the bottom of their category. They are still on the
  // page — the whole point — but nobody has to scroll past them to order.
  // A stable sort, so the shop's own display order survives inside each half.
  return list
    .map((i, n) => [i, n])
    .sort((a, b) => (soldOut(a[0]) - soldOut(b[0])) || (a[1] - b[1]))
    .map((p) => p[0]);
}

function render() {
  const shop = MENU.shop, link = MENU.link || {};
  const items = visibleItems();
  const mine = loadOrders();
  const catName = (id) => (MENU.categories.find((c) => c.id === id) || {}).name || '';

  let body = '';
  if (!items.length) {
    body = '<div class="center"><h2>Nothing matches</h2><p>' +
      (Q ? 'Try a different word, or browse the categories above.' : 'This part of the menu is not being served right now.') + '</p></div>';
  } else if (CAT === 'all' && !Q) {
    // Grouped by category so a long menu stays scannable. Items arrive in the
    // shop's own display order, NOT grouped, so walk the categories and pull
    // each one's items out; otherwise the same heading repeats down the page.
    body = MENU.categories.map((c) => {
      const inCat = items.filter((i) => i.category_id === c.id);
      if (!inCat.length) return '';
      return '<div class="grp">' + esc(c.name) + '</div>' +
        '<div class="list list-tight">' + inCat.map(itemCard).join('') + '</div>';
    }).join('');
  } else {
    body = '<div class="list">' + items.map(itemCard).join('') + '</div>';
  }

  el('app').innerHTML =
    '<div class="top">' +
      '<div class="brand"><h1>' + esc(shop.name) + '</h1>' +
        (link.label ? '<span class="where">' + esc(link.label) + '</span>' : '') +
        (mine.length ? '<button class="mine" id="mine">Your orders (' + mine.length + ')</button>' : '') + '</div>' +
      '<div class="search">' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>' +
        '<input id="q" type="text" inputmode="search" placeholder="Search the menu" value="' + esc(Q) + '" aria-label="Search the menu">' +
      '</div>' +
      '<div class="cats" role="group" aria-label="Categories">' +
        '<button class="cat" data-c="all" aria-pressed="' + (CAT === 'all') + '">All</button>' +
        MENU.categories.map((c) => '<button class="cat" data-c="' + c.id + '" aria-pressed="' + (CAT === c.id) + '">' + esc(c.name) + '</button>').join('') +
      '</div>' +
    '</div>' + body +
    // Rate-your-visit: same token, straight into the owner's Logbook. Sits
    // above the cart bar so it never competes with "Review order".
    '<div style="text-align:center;padding:6px 0 90px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">' +
      '<button class="ghost" id="rate" style="font-size:14px">☆ Rate your visit</button>' +
      // Only when the shop opted in. The RPC checks the same setting server-side,
      // so a cached page can never keep asking after it is switched off.
      ((MENU.shop && MENU.shop.loyalty) ? '<button class="ghost" id="stamps" style="font-size:14px">🎟 My stamps</button>' : '') +
    '</div>' +
    '<div class="bar">' +
      '<div class="sum"><b>' + money(total()) + '</b><span>' + count() + (count() === 1 ? ' item' : ' items') + '</span></div>' +
      '<button class="primary" id="review"' + (CART.length ? '' : ' disabled') + '>Review order</button>' +
    '</div>';

  const q = el('q');
  q.addEventListener('input', (e) => {
    Q = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const nq = el('q'); nq.focus(); try { nq.setSelectionRange(pos, pos); } catch (_) {}
  });
  document.querySelectorAll('.cat').forEach((b) => b.onclick = () => {
    CAT = b.dataset.c === 'all' ? 'all' : Number(b.dataset.c); render();
  });
  document.querySelectorAll('.item').forEach((b) => b.onclick = () => openItem(Number(b.dataset.i)));
  el('review').onclick = openCart;
  if (el('mine')) el('mine').onclick = () => showOrders();
  el('rate').onclick = openRating;
  if (el('stamps')) el('stamps').onclick = openStamps;
}

// ---- my stamps: the customer checks their own punch card -----------------
// Reads nothing but the shop's own loyalty counters, and only for a phone
// number that already belongs to one of its customers. See migration 0063 for
// the rate caps and for why the response is deliberately this small.
function openStamps() {
  var saved = '';
  try { saved = localStorage.getItem('ember.phone') || ''; } catch (_) {}
  openSheet(
    '<h2>My stamps</h2><p class="lede">Type the mobile number you give at the counter.</p>' +
    '<input id="ph" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" value="' + esc(saved) + '" ' +
      'placeholder="0917 123 4567" style="width:100%;border:1.5px solid var(--line);border-radius:12px;' +
      'background:transparent;color:var(--text);padding:12px;font:inherit;font-size:17px">' +
    '<div id="stout" style="padding:14px 0;min-height:26px;text-align:center"></div>' +
    '<div style="display:flex;gap:10px;margin-top:4px">' +
      '<button class="ghost" id="stcancel" style="flex:1">Close</button>' +
      '<button class="primary" id="stgo" style="flex:1">Check</button>' +
    '</div>'
  );
  el('stcancel').onclick = closeSheet;
  el('stgo').onclick = async function () {
    var phone = el('ph').value.trim();
    if (phone.replace(/\D/g, '').length < 10) {
      el('stout').innerHTML = '<span style="color:var(--muted)">Type your full mobile number.</span>';
      return;
    }
    el('stgo').disabled = true;
    el('stout').innerHTML = '<span style="color:var(--muted)">Checking…</span>';
    try {
      var r = await rpc('kiosk_my_stamps', { p_token: TOKEN, p_phone: phone });
      if (!r || !r.ok) {
        el('stout').innerHTML = '<span style="color:var(--muted)">' + esc((r && r.error) || 'Please ask at the counter.') + '</span>';
      } else if (!r.found) {
        el('stout').innerHTML = '<span style="color:var(--muted)">We could not find that number. Ask the counter to add you.</span>';
      } else {
        try { localStorage.setItem('ember.phone', phone); } catch (_) {}
        var have = r.stamps || 0, need = r.required || 10;
        var dots = '';
        for (var i = 0; i < need; i++) dots += (i < have ? '●' : '○');
        el('stout').innerHTML =
          '<div style="font-size:26px;letter-spacing:4px;line-height:1.4;word-break:break-all">' + dots + '</div>' +
          '<div style="margin-top:8px;font-size:15px">' +
            (r.free_ready
              ? '<b>Free item ready!</b> Claim it at the counter.'
              : esc(r.first_name || 'You') + ' — <b>' + have + ' of ' + need + '</b>. ' +
                (need - have) + ' more for a free item.') +
          '</div>';
      }
    } catch (_) {
      el('stout').innerHTML = '<span style="color:var(--muted)">No connection. Try again in a moment.</span>';
    }
    el('stgo').disabled = false;
  };
}

// ---- rate your visit → the shop's own logbook (kiosk_feedback RPC) --------
// v1.1.62: not just one star row. The diner rates the WHOLE visit — overall,
// the service, and each thing they ordered (pulled from their own last order
// on this phone, never the server) — and may sign it or stay anonymous.
let RATING = 0;
let SERVICE = 0;
function openRating() {
  RATING = 0;
  SERVICE = 0;
  const lastItems = ((loadOrders()[0] || {}).items || []).slice(0, 12);
  // itemVotes[i]: 1 = liked, -1 = not for me, 0 = no opinion.
  const itemVotes = lastItems.map(function () { return 0; });
  openSheet(
    '<h2>How was it?</h2><p class="lede">Goes straight to the owner — not to the internet.</p>' +
    '<div class="label">Overall</div>' +
    '<div id="stars" style="font-size:38px;letter-spacing:6px;text-align:center;padding:6px 0;cursor:pointer;user-select:none"></div>' +
    '<div class="label">The service</div>' +
    '<div id="svcstars" style="font-size:26px;letter-spacing:5px;text-align:center;padding:2px 0;cursor:pointer;user-select:none"></div>' +
    (lastItems.length ? '<div class="label">What you ordered</div><div id="fbitems"></div>' : '') +
    '<textarea id="fbtext" maxlength="400" placeholder="Anything you want them to know? (optional)" ' +
      'style="width:100%;min-height:70px;border:1.5px solid var(--line);border-radius:12px;background:transparent;color:var(--text);padding:10px;font:inherit;font-size:15px;margin-top:8px"></textarea>' +
    '<input id="fbname" type="text" maxlength="40" placeholder="Your name (optional — blank stays anonymous)" ' +
      'style="width:100%;border:1.5px solid var(--line);border-radius:12px;background:transparent;color:var(--text);padding:10px;font:inherit;font-size:14px;margin-top:8px">' +
    '<div style="display:flex;gap:10px;margin-top:12px">' +
      '<button class="ghost" id="fbcancel" style="flex:1">Cancel</button>' +
      '<button class="primary" id="fbsend" style="flex:1" disabled>Send</button>' +
    '</div>'
  );
  const draw = () => {
    el('stars').innerHTML = [1, 2, 3, 4, 5].map((n) =>
      '<span data-n="' + n + '" style="opacity:' + (n <= RATING ? 1 : 0.35) + '">' + (n <= RATING ? '★' : '☆') + '</span>').join('');
    el('stars').querySelectorAll('span').forEach((s) => s.onclick = () => { RATING = Number(s.dataset.n); draw(); });
    el('svcstars').innerHTML = [1, 2, 3, 4, 5].map((n) =>
      '<span data-n="' + n + '" style="opacity:' + (n <= SERVICE ? 1 : 0.35) + '">' + (n <= SERVICE ? '★' : '☆') + '</span>').join('');
    el('svcstars').querySelectorAll('span').forEach((s) => s.onclick = () => { SERVICE = Number(s.dataset.n); draw(); });
    if (el('fbitems')) {
      el('fbitems').innerHTML = lastItems.map(function (it, i) {
        var label = it.name + (it.variant_label ? ' (' + it.variant_label + ')' : '');
        return '<div style="display:flex;align-items:center;gap:8px;padding:5px 0">' +
          '<span style="flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(label) + '</span>' +
          '<button class="ghost" data-fi="' + i + '" data-v="1" style="padding:6px 10px;font-size:15px;' + (itemVotes[i] === 1 ? 'border-color:#2fbf71;color:#2fbf71' : '') + '">&#128077;</button>' +
          '<button class="ghost" data-fi="' + i + '" data-v="-1" style="padding:6px 10px;font-size:15px;' + (itemVotes[i] === -1 ? 'border-color:#e85200;color:#e85200' : '') + '">&#128078;</button>' +
        '</div>';
      }).join('');
      el('fbitems').querySelectorAll('button').forEach(function (b) {
        b.onclick = function () {
          var i = Number(b.dataset.fi), v = Number(b.dataset.v);
          itemVotes[i] = itemVotes[i] === v ? 0 : v;
          draw();
        };
      });
    }
    el('fbsend').disabled = RATING < 1;
  };
  draw();
  el('fbcancel').onclick = closeSheet;
  el('fbsend').onclick = async () => {
    el('fbsend').disabled = true;
    el('fbsend').textContent = 'Sending…';
    // Fold everything into the text the owner reads in the Logbook.
    var parts = [];
    if (SERVICE > 0) parts.push('Service ' + SERVICE + '/5');
    var liked = lastItems.filter(function (_, i) { return itemVotes[i] === 1; }).map(function (it) { return it.name; });
    var disliked = lastItems.filter(function (_, i) { return itemVotes[i] === -1; }).map(function (it) { return it.name; });
    if (liked.length) parts.push('Liked: ' + liked.join(', '));
    if (disliked.length) parts.push('Not for me: ' + disliked.join(', '));
    var note = (el('fbtext').value || '').trim();
    if (note) parts.push('"' + note + '"');
    var who = (el('fbname').value || '').trim();
    if (who) parts.push('From: ' + who);
    try {
      const r = await rpc('kiosk_feedback', { p_token: TOKEN, p_rating: RATING, p_text: parts.join(' | ') });
      if (r && r.ok) {
        openSheet('<h2>Thank you! 🙏</h2><p class="lede">The owner will see it.</p>' +
          '<button class="primary" id="fbdone" style="width:100%;margin-top:12px">Done</button>');
        el('fbdone').onclick = closeSheet;
      } else {
        el('fbsend').disabled = false;
        el('fbsend').textContent = 'Send';
        alert((r && r.error) || 'Could not send right now.');
      }
    } catch (e) {
      el('fbsend').disabled = false;
      el('fbsend').textContent = 'Send';
      alert('No connection. Check your signal and try again.');
    }
  };
}

/** Has the shop marked this item sold out? Older servers send no flag at all,
 *  and those only ever sent items that WERE available — so absent means yes. */
function soldOut(i) { return i.available === 0 || i.available === false; }

function itemCard(i) {
  const out = soldOut(i);
  const meal = (i.slots && i.slots.length)
    ? '<div class="meal">Meal, choose your ' + i.slots.map((s) => esc(s.label).toLowerCase()).join(' and ') + '</div>' : '';
  // Greyed and unpressable rather than gone: "baka pde po yung soldout items
  // grayed out lang po. Kasi nag a-ask pa rin po sila if available."
  return '<button class="item' + (out ? ' out' : '') + '" data-i="' + i.id + '"' +
      (out ? ' disabled aria-disabled="true"' : '') + '>' + thumb(i) +
    '<div style="flex:1;min-width:0"><div class="nm">' + esc(i.name) + '</div>' +
    (i.description ? '<div class="ds">' + esc(i.description) + '</div>' : '') + meal +
    (out ? '<div class="soldout">Sold out</div>' : '') + '</div>' +
    '<div class="pr">' + money(i.price_cents) + '</div></button>';
}

function openSheet(html) {
  el('sheet').innerHTML = '<div class="grab"></div>' + html;
  el('scrim').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function closeSheet() {
  el('scrim').classList.remove('on');
  document.body.style.overflow = '';
}
el('scrim').onclick = (e) => { if (e.target.id === 'scrim') closeSheet(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

function openItem(id) {
  const it = MENU.items.find((x) => x.id === id);
  if (soldOut(it)) { toast(it.name + ' is sold out right now.'); return; }
  let size = (it.sizes && it.sizes.length) ? it.sizes[0].id : null;
  let qty = 1;
  const picks = {};
  (it.slots || []).forEach((s) => { if (s.options.length) picks[s.id] = s.options[0].id; });

  // Paid add-ons and free kitchen instructions, same chips the register shows.
  // An item can be narrowed to its own short list; an empty list means the shop
  // never narrowed it, so everything shows.
  //
  // A COUNT per add-on, not a yes/no (v1.1.67). "May isang customer po kanina
  // na same item po na add on ang gusto niya. Di po siya pde maselect twice."
  // Double pearls is one add-on taken twice, and the old on/off toggle had no
  // way to say it — the diner had to ask at the counter, which is exactly the
  // trip the QR menu exists to save.
  const addonQty = new Map();
  const qtyOf = (aid) => addonQty.get(aid) || 0;
  const addonPicks = {
    has: (aid) => qtyOf(aid) > 0,
    delete: (aid) => addonQty.delete(aid),
    add: (aid) => addonQty.set(aid, qtyOf(aid) + 1),
  };
  const allow = (it.addon_ids && it.addon_ids.length) ? new Set(it.addon_ids) : null;
  // v1.1.63: an item ticked "no add-ons" hides the whole section - and the
  // server drops anything a tampered page sends for it, so this is honest.
  const addons = it.no_addons ? [] : (MENU.addons || []).filter((a) => !allow || allow.has(a.id));
  // Categories the customer MUST answer. The server checks these too.
  const reqCats = new Set(it.no_addons ? [] : (it.required_cats || []));
  // v1.1.62: how many the customer may pick from a REQUIRED group. Size-first:
  // a Barkada order may allow 2 flavors while Solo allows 1. Blank = exactly
  // one (the honest reading of "must choose one"); 0 = as many as they like.
  // v1.1.64: the same max now caps OPTIONAL groups too (milktea: skippable
  // add-ons but "2 max") - blank stays uncapped there, so nothing changes for
  // menus that never typed a max. The register enforces the same rule, and the
  // server re-checks on submit.
  const rawMax = () => {
    const v = size && it.sizes ? it.sizes.find((s) => s.id === size) : null;
    return (v && v.max_picks != null) ? v.max_picks
      : (it.addon_max_picks != null ? it.addon_max_picks : null);
  };
  // v1.1.80: how many a REQUIRED group MUST have, size-first like the cap.
  // 'Solo requires 1 flavor only while Barkada requires 2.' Blank = at least
  // one, the old rule.
  const rawMin = () => {
    const v = size && it.sizes ? it.sizes.find((s) => s.id === size) : null;
    return (v && v.min_picks != null) ? v.min_picks
      : (it.addon_min_picks != null ? it.addon_min_picks : null);
  };
  const minFor = () => {
    const raw = rawMin();
    const min = raw == null ? 1 : Math.max(1, raw);
    const cap = capFor();
    return cap === Infinity ? min : Math.min(min, cap);
  };
  const capFor = () => {
    const raw = rawMax();
    if (raw == null) return 1;
    return raw === 0 ? Infinity : Math.max(1, raw);
  };
  const capOpt = () => {
    const raw = rawMax();
    if (raw == null || raw === 0) return Infinity;
    return Math.max(1, raw);
  };
  const picksIn = (key) => addons.filter((a) => (a.category || 'other') === key && addonPicks.has(a.id));
  /** How many picks a group holds IN TOTAL — two of one add-on is two picks,
   *  which is what a "pick up to 2" cap has to count. */
  const countIn = (key) => addons.reduce((n, a) => n + ((a.category || 'other') === key ? qtyOf(a.id) : 0), 0);
  // A size switch can LOWER the cap (Barkada -> Solo): keep the first picks
  // that still fit and quietly drop the rest, so the button math stays honest.
  const trimToCap = () => {
    addonGroups.forEach((g) => {
      const cap = reqCats.has(g.key) ? capFor() : capOpt();
      if (cap === Infinity) return;
      let room = cap;
      g.items.forEach((a) => {
        const have = qtyOf(a.id);
        if (!have) return;
        const keep = Math.max(0, Math.min(have, room));
        room -= keep;
        if (keep) addonQty.set(a.id, keep); else addonQty.delete(a.id);
      });
    });
  };
  const addonGroups = [];
  addons.forEach((a) => {
    const k = a.category || 'other';
    let g = addonGroups.find((x) => x.key === k);
    if (!g) { g = { key: k, items: [] }; addonGroups.push(g); }
    g.items.push(a);
  });
  const missingCats = () => [...reqCats].filter((c) => {
    var got = 0;
    addons.forEach((a) => { if ((a.category || 'other') === c) got += qtyOf(a.id); });
    return got < minFor();
  });

  const unit = () => {
    let p = it.price_cents;
    if (size) { const v = it.sizes.find((s) => s.id === size); if (v) p += v.delta; }
    (it.slots || []).forEach((s) => { const o = s.options.find((x) => x.id === picks[s.id]); if (o) p += o.delta; });
    addons.forEach((a) => { p += Math.max(0, a.price_cents || 0) * qtyOf(a.id); });
    return p;
  };

  function draw() {
    openSheet(
      '<h2>' + esc(it.name) + '</h2>' +
      (it.description ? '<p class="lede">' + esc(it.description) + '</p>' : '') +
      ((it.sizes && it.sizes.length) ? '<div class="label">Size</div>' + it.sizes.map((s) =>
        '<button class="opt" data-sz="' + s.id + '" aria-pressed="' + (size === s.id) + '"><span>' + esc(s.label) + '</span>' +
        '<span class="delta">' + (s.delta ? (s.delta > 0 ? '+' : '') + money(s.delta) : 'Included') + '</span></button>').join('') : '') +
      (it.slots || []).map((s) => '<div class="label">' + esc(s.label) + '</div>' + s.options.map((o) =>
        '<button class="opt" data-sl="' + s.id + '" data-op="' + o.id + '" aria-pressed="' + (picks[s.id] === o.id) + '"><span>' + esc(o.label) + '</span>' +
        '<span class="delta">' + (o.delta ? '+' + money(o.delta) : 'Included') + '</span></button>').join('')).join('') +
      addonGroups.map((g) => {
        const need = reqCats.has(g.key);
        const unanswered = need && missingCats().indexOf(g.key) >= 0;
        const cap = need ? capFor() : capOpt();
        const badge = need
          ? (cap === Infinity ? 'Required' : cap === 1 ? 'Pick one' : 'Pick up to ' + cap)
          : (cap === Infinity ? '' : 'Up to ' + cap);
        return '<div class="label">' + esc(ADDON_LABELS[g.key] || g.key) +
          (badge ? '<span class="req' + (unanswered ? ' req-on' : '') + '">' + badge + '</span>' : '') + '</div>' +
          g.items.map((a) => {
            const n = qtyOf(a.id);
            // "Pick one" groups stay a radio — a quantity there means nothing
            // (you cannot have two of your one flavour choice). Everything
            // else gets a stepper once it is taken.
            const stepper = n > 0 && !(need && cap === 1);
            return '<div class="opt" data-ad="' + a.id + '" role="button" tabindex="0" aria-pressed="' + (n > 0) + '">' +
              '<span>' + esc(a.text) + '</span>' +
              '<span class="delta">' + (a.price_cents > 0 ? '+' + money(a.price_cents) : 'Free') + '</span>' +
              (stepper
                ? '<span class="adq"><button type="button" data-adm="' + a.id + '" aria-label="One less ' + esc(a.text) + '">&minus;</button>' +
                  '<b>' + n + '</b>' +
                  '<button type="button" data-adp="' + a.id + '" aria-label="One more ' + esc(a.text) + '">+</button></span>'
                : '') +
              '</div>';
          }).join('');
      }).join('') +
      '<div class="label">Anything to tell the kitchen?</div>' +
      '<input class="note-in" id="inote" type="text" maxlength="120" placeholder="Allergies, no onions, extra napkins" aria-label="Note for the kitchen">' +
      '<div class="label">How many?</div>' +
      '<div class="stepper"><button id="minus" aria-label="One less">&minus;</button><span id="qv" aria-live="polite">' + qty + '</span>' +
      '<button id="plus" aria-label="One more">+</button></div>' +
      '<div style="display:flex;gap:10px;margin-top:20px">' +
        '<button class="ghost" id="cancel">Back</button>' +
        (missingCats().length
          ? '<button class="primary" id="add" disabled>Choose ' +
              esc(missingCats().map((c) => (ADDON_LABELS[c] || c).toLowerCase()).join(' and ')) + '</button>'
          : '<button class="primary" id="add">Add ' + money(unit() * qty) + '</button>') +
      '</div>');

    document.querySelectorAll('[data-sz]').forEach((b) => b.onclick = () => { size = Number(b.dataset.sz); trimToCap(); redraw(); });
    document.querySelectorAll('[data-op]').forEach((b) => b.onclick = () => { picks[Number(b.dataset.sl)] = Number(b.dataset.op); redraw(); });
    /** Take one more of an add-on, respecting the group's cap. */
    function addOne(id) {
      const a = addons.find((x) => x.id === id);
      const key = (a && a.category) || 'other';
      const need = reqCats.has(key);
      const cap = need ? capFor() : capOpt();
      if (cap !== Infinity && countIn(key) >= cap) {
        if (need && cap === 1) {
          // "Pick one" behaves like a radio: the new pick replaces the old.
          picksIn(key).forEach((x) => addonPicks.delete(x.id));
        } else {
          toast('Up to ' + cap + ' only for ' + (ADDON_LABELS[key] || key).toLowerCase());
          return;
        }
      }
      addonPicks.add(id);
      redraw();
    }
    // The row's own +/− live INSIDE it, so a tap on either must not also count
    // as a tap on the row.
    document.querySelectorAll('[data-adp]').forEach((b) => b.onclick = (e) => { e.stopPropagation(); addOne(Number(b.dataset.adp)); });
    document.querySelectorAll('[data-adm]').forEach((b) => b.onclick = (e) => {
      e.stopPropagation();
      const id = Number(b.dataset.adm);
      const n = qtyOf(id);
      if (n <= 1) addonPicks.delete(id); else addonQty.set(id, n - 1);
      redraw();
    });
    document.querySelectorAll('[data-ad]').forEach((b) => {
      const tap = () => {
        const id = Number(b.dataset.ad);
        // Tapping a taken add-on clears it — the same "tap again to remove"
        // it has always had. The stepper is for going past one.
        if (addonPicks.has(id)) { addonPicks.delete(id); redraw(); return; }
        addOne(id);
      };
      b.onclick = tap;
      b.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(); } };
    });
    el('minus').onclick = () => { if (qty > 1) { qty--; redraw(); } };
    el('plus').onclick = () => { if (qty < 20) { qty++; redraw(); } };
    el('cancel').onclick = closeSheet;
    el('add').onclick = () => {
      const v = size ? it.sizes.find((s) => s.id === size) : null;
      CART.push({
        item_id: it.id, name: it.name, qty, price: unit(),
        taxExempt: !!it.tax_exempt,
        variant_id: size, variant_label: v ? v.label : null,
        options: Object.values(picks),
        option_labels: (it.slots || []).map((s) => { const o = s.options.find((x) => x.id === picks[s.id]); return o ? o.label : null; }).filter(Boolean),
        // One entry PER unit — the server prices each entry, so two of an
        // add-on charge twice. It also re-checks the group cap against the
        // same count, so a tampered page cannot smuggle in a third flavour.
        addons: addons.flatMap((a) => Array(qtyOf(a.id)).fill(a.id)),
        addon_labels: addons.filter((a) => qtyOf(a.id) > 0)
          .map((a) => (qtyOf(a.id) > 1 ? qtyOf(a.id) + '× ' + a.text : a.text)),
        note: (el('inote').value || '').trim(),
      });
      closeSheet(); render();
      // The same upgrade the cashier is offered: this item has a meal version.
      const meal = it.meal_item_id ? MENU.items.find((x) => x.id === it.meal_item_id) : null;
      if (meal) offerMeal(it, meal);
      else toast(qty + ' ' + it.name + ' added');
    };
  }
  // Keep the typed note when the sheet redraws after a size or option tap.
  function redraw() { const n = el('inote') ? el('inote').value : ''; draw(); if (n) el('inote').value = n; }
  draw();
}

/** "Make it a meal?" - the same nudge the register gives the cashier. Swaps the
 *  a-la-carte line for the meal so the customer never pays for both. */
function offerMeal(from, meal) {
  const extra = Math.max(0, meal.price_cents - from.price_cents);
  openSheet('<h2>Make it a meal?</h2>' +
    '<p class="lede">Add ' + esc(meal.slots.map((s) => esc(s.label).toLowerCase()).join(' and ')) +
    ' for about ' + money(extra) + ' more.</p>' +
    '<div style="display:flex;gap:10px;margin-top:20px">' +
      '<button class="ghost" id="nomeal">No thanks</button>' +
      '<button class="primary" id="yesmeal">Make it a meal</button></div>');
  el('nomeal').onclick = () => { closeSheet(); toast(from.name + ' added'); };
  el('yesmeal').onclick = () => {
    // Drop the plain item we just added, then build the meal properly.
    for (let i = CART.length - 1; i >= 0; i--) { if (CART[i].item_id === from.id) { CART.splice(i, 1); break; } }
    closeSheet(); render(); openItem(meal.id);
  };
}

function openCart() {
  function draw() {
    if (!CART.length) { closeSheet(); render(); return; }
    const tax = taxOf();
    openSheet('<h2>Your order</h2>' +
      CART.map((l, idx) => '<div class="row"><div style="flex:1;min-width:0">' +
        '<div style="font-weight:600">' + esc(l.name) + (l.variant_label ? ', ' + esc(l.variant_label) : '') + '</div>' +
        (l.option_labels.length ? '<div class="lede" style="font-size:13px">' + esc(l.option_labels.join(', ')) + '</div>' : '') +
        ((l.addon_labels || []).length ? '<div class="lede" style="font-size:13px">' + esc(l.addon_labels.map((a) => '+ ' + a).join(', ')) + '</div>' : '') +
        (l.note ? '<div class="lede" style="font-size:13px">' + esc(l.note) + '</div>' : '') +
        '<div class="lede" style="font-size:13px">' + money(l.price) + ' each</div></div>' +
        '<div class="stepper"><button data-m="' + idx + '" aria-label="One less">&minus;</button>' +
        '<span>' + l.qty + '</span><button data-p="' + idx + '" aria-label="One more">+</button></div></div>').join('') +
      '<div class="totals">' +
        ((tax > 0 || deliveryFee() > 0) ? '<div><span>Subtotal</span><span>' + money(subtotal()) + '</span></div>' : '') +
        (deliveryFee() > 0 ? '<div><span>Delivery fee</span><span>' + money(deliveryFee()) + '</span></div>' : '') +
        (tax > 0 ? '<div><span>Tax</span><span>' + money(tax) + '</span></div>' : '') +
        '<div class="grand"><span>Total</span><span>' + money(total()) + '</span></div>' +
      '</div>' +
      storeFields() +
      '<div class="label">Your name</div>' +
      '<input class="note-in" id="who" type="text" maxlength="40" placeholder="' + (STORE ? 'Who is this order for?' : 'So the staff can call you') + '" aria-label="Your name">' +
      (STORE ? payChoiceHtml() : '') +
      '<div style="display:flex;gap:10px;margin-top:20px">' +
        '<button class="ghost" id="back">Add more</button>' +
        '<button class="primary" id="send">' + esc(sendLabel()) + '</button></div>' +
      (STORE ? '' : '<p class="lede" style="font-size:13px;margin-top:12px">Your order goes to the counter first. Pay there, then it is made.</p>'));

    document.querySelectorAll('[data-m]').forEach((b) => b.onclick = () => {
      const i = Number(b.dataset.m); CART[i].qty--; if (CART[i].qty <= 0) CART.splice(i, 1); redrawKeeping(); render();
    });
    document.querySelectorAll('[data-p]').forEach((b) => b.onclick = () => {
      const i = Number(b.dataset.p); if (CART[i].qty < 20) CART[i].qty++; redrawKeeping(); render();
    });
    if (STORE) {
      // Remembered from the last order on this phone - typing an address twice
      // is how a customer gives up.
      if (el('who') && !el('who').value) el('who').value = lsGet('ember.who');
      if (el('oph') && !el('oph').value) el('oph').value = lsGet('ember.phone');
      if (el('oaddr') && !el('oaddr').value) el('oaddr').value = lsGet('ember.addr');
      document.querySelectorAll('[data-omode]').forEach(function (b) {
        b.onclick = function () { OMODE = b.getAttribute('data-omode'); PAYCHOICE = defaultPayChoice(); redrawKeeping(); };
      });
      document.querySelectorAll('[data-paych]').forEach(function (b) {
        b.onclick = function () { PAYCHOICE = b.getAttribute('data-paych'); redrawKeeping(); };
      });
    }
    el('back').onclick = closeSheet;
    el('send').onclick = send;
  }
  /* Redraw the sheet without eating what the customer already typed. */
  function redrawKeeping() {
    var w = el('who') ? el('who').value : '';
    var ph = el('oph') ? el('oph').value : '';
    var ad = el('oaddr') ? el('oaddr').value : '';
    draw();
    if (el('who') && w) el('who').value = w;
    if (el('oph') && ph) el('oph').value = ph;
    if (el('oaddr') && ad) el('oaddr').value = ad;
  }
  if (STORE) PAYCHOICE = defaultPayChoice();
  draw();
}

/* ---- Storefront helpers (v1.1.94) --------------------------------------- */
function storeFields() {
  if (!STORE) return '';
  var h = '';
  if (STORE.pickup && STORE.delivery) {
    h += '<div class="label">How do you want it?</div>' +
      '<div style="display:flex;gap:8px">' +
      '<button class="' + (OMODE === 'pickup' ? 'primary' : 'ghost') + '" data-omode="pickup" style="flex:1">🛍 Pickup</button>' +
      '<button class="' + (OMODE === 'delivery' ? 'primary' : 'ghost') + '" data-omode="delivery" style="flex:1">🛵 Delivery</button></div>';
  } else if (OMODE === 'pickup') {
    h += '<div class="label">🛍 Pickup order' + (STORE.address ? ' — collect at ' + esc(STORE.address) : '') + '</div>';
  } else {
    h += '<div class="label">🛵 Delivery order</div>';
  }
  h += '<div class="label">Your mobile number</div>' +
    '<input class="note-in" id="oph" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="0917 123 4567" aria-label="Your mobile number">';
  if (OMODE === 'delivery') {
    h += '<div class="label">Delivery address</div>' +
      '<textarea class="note-in" id="oaddr" rows="2" maxlength="300" placeholder="House no., street, barangay, city — a landmark helps" aria-label="Delivery address"></textarea>';
  }
  return h;
}

function defaultPayChoice() {
  if (!STORE || !STORE.prepay || total() < minPay()) return 'later';
  return 'now';
}

function payChoiceHtml() {
  var canNow = STORE.prepay && total() >= minPay();
  var canLater = OMODE === 'pickup' ? true : STORE.cod !== false;
  if (!canNow && canLater) { PAYCHOICE = 'later'; return ''; }
  if (!canNow && !canLater) {
    return '<div class="lede" style="font-size:12.5px;margin-top:10px">⚠️ This shop takes delivery orders with online payment only' +
      (total() < minPay() ? ' (minimum ' + money(minPay()) + ' — add a little more)' : '') + '.</div>';
  }
  if (canNow && !canLater) {
    PAYCHOICE = 'now';
    return '<div class="lede" style="font-size:12.5px;margin-top:10px">Pays online (GCash / Maya / bank app) — the shop sees it instantly.</div>';
  }
  return '<div class="label">Payment</div>' +
    '<div style="display:flex;gap:8px">' +
    '<button class="' + (PAYCHOICE === 'now' ? 'primary' : 'ghost') + '" data-paych="now" style="flex:1">Pay now (GCash/Maya)</button>' +
    '<button class="' + (PAYCHOICE === 'later' ? 'primary' : 'ghost') + '" data-paych="later" style="flex:1">' +
      (OMODE === 'delivery' ? 'Cash on delivery' : 'Pay at the counter') + '</button></div>';
}

function sendLabel() {
  if (!STORE) return 'Send to the cashier for payment';
  if (STORE.prepay && PAYCHOICE === 'now' && total() >= minPay()) return 'Place order & pay ' + money(total());
  return OMODE === 'delivery' ? 'Place delivery order' : 'Place pickup order';
}

/* Every send ATTEMPT for the current cart carries the same ref (v1.1.64):
   a retry after a lost response (slow cafe wifi, page killed mid-send) then
   returns the order that already landed instead of creating a second one —
   the server dedupes on it. A NEW cart gets a new ref. */
let SEND_REF = null;
async function send() {
  const btn = el('send');
  if (btn.disabled) return;
  const who = (el('who').value || '').trim();
  var phone = null, addr = null;
  if (STORE) {
    phone = ((el('oph') && el('oph').value) || '').trim();
    addr = ((el('oaddr') && el('oaddr').value) || '').trim();
    if (!who) { toast('Please give your name.'); return; }
    if (phone.replace(/[^0-9]/g, '').length < 7) { toast('Please give a mobile number the shop can reach you on.'); return; }
    if (OMODE === 'delivery' && !addr) { toast('Please give the delivery address.'); return; }
    if (OMODE === 'delivery' && STORE.cod === false && (!STORE.prepay || total() < minPay())) {
      toast('This shop takes delivery orders with online payment only.'); return;
    }
    lsSet('ember.who', who); lsSet('ember.phone', phone); if (addr) lsSet('ember.addr', addr);
  }
  btn.disabled = true; btn.textContent = 'Sending…';
  if (!SEND_REF) SEND_REF = 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  try {
    const res = await rpc('kiosk_place_order', {
      p_token: TOKEN,
      p_items: CART.map((l) => ({ item_id: l.item_id, qty: l.qty, variant_id: l.variant_id, options: l.options, addons: l.addons || [], note: l.note })),
      p_name: who || null, p_note: null, p_order_type: STORE ? OMODE : null,
      p_client_ref: SEND_REF,
      p_phone: STORE ? phone : null, p_address: (STORE && OMODE === 'delivery') ? addr : null,
    });
    if (!res || !res.ok) {
      toast((res && res.error) || 'Could not send. Please ask a staff member.');
      btn.disabled = false; btn.textContent = sendLabel(); return;
    }
    rememberOrder({
      num: res.order_number, at: Date.now(), total: res.total_cents,
      type: STORE ? (res.order_type || OMODE) : null, prepaid: false,
      // v1.1.62: the pickup label is STAMPED on the order server-side; keeping
      // it here means this phone shows the exact same number as the board even
      // if the shop re-words its numbers later in the day.
      pickup: res.pickup || null,
      state: res.accepted ? 'making' : 'waiting',
      items: CART.map((l) => ({
        name: l.name, qty: l.qty, price: l.price, variant_label: l.variant_label,
        option_labels: l.option_labels || [], addon_labels: l.addon_labels || [], note: l.note,
      })),
    });
    var payNow = STORE && STORE.prepay && PAYCHOICE === 'now' && (res.total_cents || 0) >= minPay() && !res.duplicate;
    CART = []; SEND_REF = null; closeSheet(); showOrders(res.order_number);
    // The unmistakable confirmation the shop asked for — the screen also
    // switches to "Your orders" with this order on top.
    toast(res.duplicate
      ? (STORE ? 'This order was already sent to the shop — here it is.' : 'This order was already sent to the cashier — here it is.')
      : (STORE ? '✓ Order sent to the shop!' : '✓ Order sent to the cashier!'));
    if (payNow) openPaySheet(res.order_number);
  } catch (e) {
    toast('No connection. Try again in a moment — your order was NOT sent twice.');
    btn.disabled = false; btn.textContent = sendLabel();
  }
}

/* ---- Scan-to-pay (v1.1.94): the shop's own PayMongo, from this phone ------
   One QR Ph code for this exact order, made by the shop's own account. This
   page polls until PayMongo confirms, and the shop's till lights the ticket
   up as PAID the moment it does. Backing out is always allowed - the order
   stays, payment just moves to the counter / the rider. */
function markPrepaid(num) {
  const a = loadOrders();
  const i = a.findIndex(function (x) { return x.num === num; });
  if (i >= 0) { a[i].prepaid = true; writeOrders(a); }
}
async function openPaySheet(num) {
  openSheet('<h2>Pay now</h2><p class="lede" style="text-align:center;padding:26px 0" id="paywait">Getting your payment code…</p>' +
    '<div style="display:flex;gap:10px"><button class="ghost" id="payabort" style="flex:1">Not now</button></div>');
  el('payabort').onclick = function () { closeSheet(); showOrders(num); };
  var r;
  try { r = await payFn({ action: 'kiosk_create', token: TOKEN, orderNumber: num }); }
  catch (e) { r = null; }
  if (r && (r.alreadyPaid || r.paid)) { markPrepaid(num); closeSheet(); showOrders(num); toast('✓ Already paid!'); return; }
  if (!r || !r.ok) {
    closeSheet(); showOrders(num);
    toast(((r && r.error) || 'Could not start the payment.') + ' You can pay ' +
      (OMODE === 'delivery' ? 'the rider in cash.' : 'at the counter.'));
    return;
  }
  var intent = r.intentId, stopped = false;
  openSheet('<h2>Scan to pay</h2>' +
    '<div style="text-align:center"><img src="' + r.qrImage + '" alt="QR Ph payment code" ' +
      'style="width:230px;max-width:78vw;border-radius:12px;background:#fff;padding:8px"></div>' +
    '<div style="text-align:center;font-weight:900;font-size:24px;margin:8px 0">' + money(r.amountCents) + '</div>' +
    '<p class="lede" style="text-align:center;font-size:13px">Open GCash, Maya or your bank app and scan this QR Ph code' +
    ' — or screenshot it and upload inside the app.<br>This screen confirms by itself the moment the money lands.</p>' +
    '<div class="lede" id="paystate" style="text-align:center;padding:6px 0" aria-live="polite">Waiting for the payment…</div>' +
    '<div style="display:flex;gap:10px;margin-top:8px">' +
      '<button class="ghost" id="paylater" style="flex:1">' +
        (OMODE === 'delivery' ? 'Pay cash instead' : 'Pay at the counter instead') + '</button></div>');
  el('paylater').onclick = function () {
    stopped = true;
    payFn({ action: 'kiosk_cancel', token: TOKEN, orderNumber: num, intentId: intent }).then(function (c) {
      // The customer-paid-in-the-same-breath race: cancel of a paid intent
      // comes back PAID, and the money is honored, never lost.
      if (c && c.paid) { markPrepaid(num); toast('✓ Paid!'); }
      closeSheet(); showOrders(num);
    }).catch(function () { closeSheet(); showOrders(num); });
  };
  var tickPay = function () {
    if (stopped || !el('paystate')) return;   // sheet was replaced or closed
    payFn({ action: 'kiosk_status', token: TOKEN, orderNumber: num, intentId: intent }).then(function (st) {
      if (stopped) return;
      if (st && st.paid) {
        stopped = true; markPrepaid(num); closeSheet(); showOrders(num);
        toast('✓ Paid — the shop sees it instantly!');
        return;
      }
      setTimeout(tickPay, 3000);
    }).catch(function () { setTimeout(tickPay, 4000); });
  };
  setTimeout(tickPay, 3000);
}

/* ---- My orders -------------------------------------------------------------
   A table can order more than once in a sitting, so every order this phone
   sends is kept (on the phone, not the server) and tracked side by side. The
   contents live in localStorage rather than coming back from the database:
   anyone who scans the table's QR could otherwise read what the last diner
   ordered. Keyed per link so two tables never mix. */
const LS_KEY = 'ember.qr.' + TOKEN;
/* States nothing more can happen to. "ready" is deliberately NOT here: the
   page keeps asking until staff mark the order collected, which is what tags
   it as collected on this phone. */
const FINAL = { collected: 1, cancelled: 1 };

function loadOrders() {
  try {
    const cut = Date.now() - 14 * 3600 * 1000; // a sitting, not a history book
    return JSON.parse(localStorage.getItem(LS_KEY) || '[]').filter((o) => o.at > cut);
  } catch (e) { return []; }
}
function writeOrders(list) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(list.slice(0, 20))); } catch (e) { /* private mode */ }
}
function rememberOrder(o) { const a = loadOrders(); a.unshift(o); writeOrders(a); }
/* Returns what changed so the tracker knows when to ring the phone. */
function markOrder(num, state, paid) {
  const a = loadOrders();
  const i = a.findIndex((x) => x.num === num);
  if (i < 0) return { becameReady: false, paidChanged: false, becameCollected: false };
  const becameReady = state === 'ready' && a[i].state !== 'ready';
  const becameCollected = state === 'collected' && a[i].state !== 'collected';
  const paidChanged = paid === true && !a[i].paid;
  if (a[i].state !== state || paidChanged) {
    a[i].state = state;
    if (paid === true) a[i].paid = true;
    writeOrders(a);
  }
  return { becameReady, paidChanged, becameCollected };
}

/* The diner pressed "Got it": stop the ringing for this order. Stored beside
   the order so a reload — or the screen locking and coming back — doesn't
   start the whole thing over again. */
function ackOrder(num) {
  const a = loadOrders();
  const i = a.findIndex((x) => x.num === num);
  if (i < 0) return;
  a[i].acked = true;
  writeOrders(a);
  stopRinging();
  showOrders();
}

/* ---- "Your order is ready" on the CUSTOMER'S phone -------------------------
   Ring + vibrate + flash the tab title when an order flips to ready, so the
   phone in their pocket does the pager's job. Web audio only runs after a
   real tap, so the context is primed by whatever tap they already made —
   adding to cart, sending the order — and resumed on every later tap. */
let AUDIO = null;
function primeAudio() {
  try {
    if (!AUDIO) AUDIO = new (window.AudioContext || window.webkitAudioContext)();
    if (AUDIO.state === 'suspended') AUDIO.resume();
  } catch (e) { /* no audio — vibration and the title still alert */ }
}
document.addEventListener('pointerdown', primeAudio);
function chime() {
  try {
    if (!AUDIO || AUDIO.state !== 'running') return;
    const t = AUDIO.currentTime;
    [880, 1175].forEach((f, i) => {
      const o = AUDIO.createOscillator(), g = AUDIO.createGain();
      o.frequency.value = f; o.connect(g); g.connect(AUDIO.destination);
      g.gain.setValueAtTime(0.0001, t + i * 0.18);
      g.gain.exponentialRampToValueAtTime(0.35, t + i * 0.18 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.18 + 0.5);
      o.start(t + i * 0.18); o.stop(t + i * 0.18 + 0.55);
    });
  } catch (e) { /* speaker said no */ }
}
/* The phone is the pager, so it has to behave like one: keep ringing until
   somebody answers. It stops on the diner's own "Got it" button, or when staff
   mark the order collected — never on a timer, because a phone face-down in a
   pocket that rings once has told nobody anything. */
const ORIG_TITLE = document.title;
let titleTimer = null;
let ringTimer = null;
function flashTitle(num) {
  if (titleTimer) return;
  let n = 0;
  titleTimer = setInterval(() => {
    document.title = (n++ % 2 === 0) ? '((🔔)) Order ' + num + ' is READY' : ORIG_TITLE;
  }, 900);
}
function buzz(num) {
  try { if (navigator.vibrate) navigator.vibrate([250, 120, 250, 120, 450]); } catch (e) { /* not supported */ }
  for (let i = 0; i < 2; i++) setTimeout(chime, i * 1400);
  flashTitle(num);
}
/* Orders that are ready and that nobody has acknowledged yet. */
function unackedReady() {
  return loadOrders().filter((o) => o.state === 'ready' && !o.acked);
}
function stopRinging() {
  if (ringTimer) { clearInterval(ringTimer); ringTimer = null; }
  if (titleTimer) { clearInterval(titleTimer); titleTimer = null; }
  document.title = ORIG_TITLE;
}
function alertReady(num) {
  var ord = loadOrders().find(function (x) { return x.num === num; }) || {};
  toast(ord.type === 'delivery'
    ? 'Order ' + pickupNum(num, ord.pickup) + ' is packed — the rider is on the way soon!'
    : 'Order ' + pickupNum(num, ord.pickup) + ' is ready — please collect it at the counter!');
  buzz(num);
  if (ringTimer) return;
  ringTimer = setInterval(() => {
    const live = unackedReady();
    if (!live.length) { stopRinging(); return; }
    buzz(live[0].num);
  }, 6000);
}
/* Re-arm on load: a diner who reopened the tab mid-wait should still be rung
   for an order that went ready while the page was closed. */
function resumeRinging() {
  const live = unackedReady();
  if (live.length && !ringTimer) alertReady(live[0].num);
}

/* ---- keep the pager ALIVE (v1.1.64) ----------------------------------------
   KOPIKOPI: "sobrang hirap kung hindi mag-ring ang phone kapag off ang screen
   o na-exit ang browser." A web page can't ring a closed browser — that
   honestly needs an installed app — but it CAN stop the screen turning off
   while an order is live (wake lock), fire a system notification when the tab
   is merely in the background, and re-check the moment the page comes back. */
let WAKE = null;
async function holdWake() {
  try {
    const live = loadOrders().some(function (o) {
      return o.state === 'waiting' || o.state === 'making' || (o.state === 'ready' && !o.acked);
    });
    if (!live) { if (WAKE) { try { WAKE.release(); } catch (e) { /* gone */ } WAKE = null; } return; }
    if (WAKE || !('wakeLock' in navigator)) return;
    WAKE = await navigator.wakeLock.request('screen');
    WAKE.addEventListener('release', function () { WAKE = null; });
  } catch (e) { WAKE = null; /* low battery or unsupported — the ring still works while open */ }
}
function askNotify() {
  try {
    if (!('Notification' in window)) return;               // iOS Safari tab: not offered
    if (Notification.permission === 'default') Notification.requestPermission().catch(function () { /* their call */ });
  } catch (e) { /* never block ordering on this */ }
}
function notifyReady(num, stamped) {
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    if (document.visibilityState === 'visible') return;    // the in-page ring already has them
    new Notification('Order ' + pickupNum(num, stamped) + ' is ready 🎉',
      { body: 'Please collect it at the counter.', tag: 'ember-ready' });
  } catch (e) { /* the title flash + ring remain */ }
}
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') { holdWake(); resumeRinging(); }
});

const STATE_TEXT = {
  waiting: 'Staff are confirming it',
  making: 'Being prepared',
  ready: 'Ready, please collect',
  collected: 'Collected — enjoy!',
  cancelled: 'Cancelled, ask a staff member',
};
/* The same four steps read differently when nobody is sitting at a table. */
const STATE_TEXT_BY_TYPE = {
  pickup: {
    waiting: 'The shop is confirming it',
    making: 'Being prepared',
    ready: 'Ready — come get it!',
    collected: 'Picked up — enjoy!',
    cancelled: 'Cancelled — please contact the shop',
  },
  delivery: {
    waiting: 'The shop is confirming it',
    making: 'Being prepared',
    ready: 'Packed — waiting for the rider',
    collected: 'On the way to you!',
    cancelled: 'Cancelled — please contact the shop',
  },
};
/* The shop's own wording for the number it calls out. Mirrors boardLabel() in
   src/lib/pickup.ts — the board, the claim stub, the kitchen ticket and this
   page must never disagree about what a customer is waiting for. */
function pickupNum(raw, stamped) {
  // The label stamped on the order at creation wins; computing is the
  // fallback for orders placed before the stamp existed.
  if (stamped) return String(stamped);
  var s = String(raw == null ? '' : raw);
  var mode = (MENU && MENU.shop && MENU.shop.pickup_mode) || 'full';
  if (mode === 'short') {
    var digits = s.replace(/\D/g, '');
    return digits ? digits.slice(-3).replace(/^0+(?=\d)/, '') : s;
  }
  if (mode === 'last4') {
    var t = s.replace(/[^A-Za-z0-9]/g, '');
    return t.length > 4 ? t.slice(-4) : t;
  }
  return s;
}

function stepsHtml(state, type) {
  const texts = (type && STATE_TEXT_BY_TYPE[type]) || STATE_TEXT;
  if (state === 'cancelled') {
    return '<div class="step on"><span class="dot"></span><span>' + texts.cancelled + '</span></div>';
  }
  const seq = ['waiting', 'making', 'ready', 'collected'];
  const at = seq.indexOf(state);
  return seq.map((s, i) => '<div class="step ' + (i < at ? 'done' : i === at ? 'on' : '') + '">' +
    '<span class="dot"></span><span>' + texts[s] + '</span></div>').join('');
}

function showOrders(highlight) {
  const list = loadOrders();
  if (!list.length) { render(); return; }

  el('app').innerHTML =
    '<div class="top" style="padding-bottom:14px"><div class="brand"><h1>Your orders</h1>' +
      (MENU && MENU.link && MENU.link.label ? '<span class="where">' + esc(MENU.link.label) + '</span>' : '') +
      '</div></div>' +
    // The page IS the pager: it can only ring while it exists. Say so plainly —
    // the shop reported diners closing the browser and missing every alert.
    (list.some((o) => !FINAL[o.state])
      ? '<div class="lede" style="margin:0 0 12px;padding:10px 12px;border:1px dashed var(--line);border-radius:var(--r-md);font-size:12.5px">' +
        '📟 <b>Keep this page open</b> — your phone rings and vibrates here when your order is ready. ' +
        'The screen is kept awake for you while you wait.</div>'
      : '') +
    '<div class="list">' + list.map((o) => {
      const isNew = o.num === highlight;
      return '<div style="background:var(--card);border:1px solid ' + (isNew ? 'var(--accent)' : 'var(--line)') +
        ';border-radius:var(--r-md);padding:14px">' +
        '<div style="display:flex;align-items:baseline;gap:10px">' +
          '<div><div style="font-weight:900;font-size:30px;letter-spacing:1px;line-height:1.05">' + esc(pickupNum(o.num, o.pickup)) + '</div>' +
            (pickupNum(o.num, o.pickup) !== o.num
              ? '<div class="lede" style="font-size:11.5px;letter-spacing:.4px">' + esc(o.num) + '</div>' : '') +
          '</div>' +
          '<div style="margin-left:auto;font-weight:700">' + money(o.total) + '</div></div>' +
        '<div class="lede" style="font-size:12px;margin-top:2px">Watch for this number</div>' +
        '<div class="lede" style="font-size:12.5px;margin:2px 0 10px">' +
          new Date(o.at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) +
          (o.paid ? ' · paid' : o.prepaid ? ' · paid online' :
            o.type === 'delivery' ? ' · cash on delivery' :
            o.type === 'pickup' ? ' · pay at pickup' : ' · pay at the counter') + '</div>' +
        // What they actually ordered, which is the bit that was missing.
        '<div style="border-top:1px solid var(--line);padding-top:10px;margin-bottom:12px">' +
          o.items.map((l) => '<div style="display:flex;gap:10px;padding:3px 0;font-size:14px">' +
            '<span style="color:var(--muted);min-width:22px">' + l.qty + 'x</span>' +
            '<span style="flex:1;min-width:0">' + esc(l.name) +
              (l.variant_label ? ', ' + esc(l.variant_label) : '') +
              ((l.option_labels || []).length ? '<span class="lede" style="display:block;font-size:12.5px">' + esc(l.option_labels.join(', ')) + '</span>' : '') +
              ((l.addon_labels || []).length ? '<span class="lede" style="display:block;font-size:12.5px">' + esc(l.addon_labels.map((a) => '+ ' + a).join(', ')) + '</span>' : '') +
              (l.note ? '<span class="lede" style="display:block;font-size:12.5px">' + esc(l.note) + '</span>' : '') +
            '</span>' +
            '<span style="color:var(--muted)">' + money(l.price * l.qty) + '</span></div>').join('') +
        '</div>' +
        // The phone is ringing for this one — the button that stops it has to
        // be the biggest thing on the card, not a line of small print.
        (o.state === 'ready' && !o.acked
          ? '<button class="primary" data-ack="' + esc(o.num) + '" style="width:100%;margin-bottom:12px">' +
              '🔔 Got it — stop ringing</button>'
          : '') +
        // Pickup orders say WHERE - the address is the half of "come get it"
        // a first-time customer does not have.
        (o.type === 'pickup' && STORE && STORE.address
          ? '<div class="lede" style="font-size:12.5px;margin-bottom:10px">📍 Pick up at: ' + esc(STORE.address) + '</div>'
          : '') +
        // Collected: the staff handed it over. Says so on the diner's phone.
        (o.state === 'collected'
          ? '<div style="display:flex;gap:8px;align-items:center;background:rgba(4,120,87,.12);' +
              'border:1px solid rgba(4,120,87,.45);border-radius:var(--r-md);padding:10px 12px;margin-bottom:12px">' +
              '<span style="font-size:15px;line-height:1.2">✅</span>' +
              '<b style="font-size:14.5px">' + (o.type === 'delivery' ? 'On the way — enjoy!' : 'Collected — enjoy!') + '</b></div>'
          : '') +
        // Unpaid orders say so LOUDLY, above the progress steps: a customer who
        // only sees "Staff are confirming it" assumes they are done and sits down.
        // Paid-online orders get the opposite banner, equally loud - the shop
        // must never ask this customer for money twice.
        (o.paid ? '' : o.prepaid
          ? '<div style="display:flex;gap:8px;align-items:center;background:rgba(4,120,87,.12);' +
              'border:1px solid rgba(4,120,87,.45);border-radius:var(--r-md);padding:10px 12px;margin-bottom:12px">' +
              '<span style="font-size:15px;line-height:1.2">✅</span>' +
              '<b style="font-size:14.5px">PAID online — show this screen if asked</b></div>'
          : o.state === 'cancelled' ? '' :
          '<div style="display:flex;gap:8px;align-items:flex-start;background:rgba(255,92,0,.12);' +
            'border:1px solid rgba(255,92,0,.45);border-radius:var(--r-md);padding:10px 12px;margin-bottom:12px">' +
            '<span style="font-size:15px;line-height:1.2">' + (o.type === 'delivery' ? '💵' : '💳') + '</span>' +
            (o.type === 'delivery'
              ? '<span><b style="display:block;font-size:14.5px">Cash on delivery</b>' +
                '<span class="lede" style="font-size:12.5px">Have ' + money(o.total) + ' ready for the rider.</span></span>'
              : o.type === 'pickup'
                ? '<span><b style="display:block;font-size:14.5px">Pay when you pick it up</b>' +
                  '<span class="lede" style="font-size:12.5px">Show this number: <b>' + esc(pickupNum(o.num, o.pickup)) + '</b>.</span></span>'
                : '<span><b style="display:block;font-size:14.5px">Please pay at the counter</b>' +
                  '<span class="lede" style="font-size:12.5px">Show this number at the counter: <b>' + esc(pickupNum(o.num, o.pickup)) + '</b>.</span></span>') +
          '</div>' +
          // A payment that was backed out of can be finished from right here.
          (o.type && STORE && STORE.prepay && o.total >= minPay()
            ? '<button class="primary" data-paynow="' + esc(o.num) + '" style="width:100%;margin-bottom:12px">Pay now — ' + money(o.total) + '</button>'
            : '')) +
        '<div class="steps" data-track="' + esc(o.num) + '">' + stepsHtml(o.state || 'waiting', o.type) + '</div>' +
      '</div>';
    }).join('') + '</div>' +
    '<div class="bar"><button class="primary" id="tomenu">Order more</button></div>';

  el('tomenu').onclick = () => { render(); };
  document.querySelectorAll('[data-ack]').forEach((b) => {
    b.onclick = () => ackOrder(b.getAttribute('data-ack'));
  });
  document.querySelectorAll('[data-paynow]').forEach((b) => {
    b.onclick = () => openPaySheet(b.getAttribute('data-paynow'));
  });
  trackAll();
  resumeRinging();
  // While an order is live: keep the screen awake (this page IS the pager) and
  // offer system notifications for when the tab slips into the background.
  holdWake();
  askNotify();
}

let tracking = null;
function trackAll() {
  const tick = async () => {
    // Keep polling unpaid orders even after "ready": the moment the cashier
    // takes payment, the "please pay at the counter" banner has to leave.
    const live = loadOrders().filter((o) => !FINAL[o.state] || (!o.paid && o.state !== 'cancelled'));
    if (!live.length) return;
    let redraw = false;
    for (const o of live) {
      try {
        const r = await rpc('kiosk_order_status', { p_token: TOKEN, p_order_number: o.num });
        if (r && r.ok) {
          const ch = markOrder(o.num, r.state, r.paid);
          // The server's word on the online payment - a payment finished on
          // ANOTHER device (or after this page reloaded) still lands here.
          if (r.prepaid && !o.prepaid) { markPrepaid(o.num); redraw = true; }
          // Redraw as well as ring: the "Got it" button lives outside the
          // steps box, so patching the steps alone would leave no way to stop
          // the ringing until the next full render.
          if (ch.becameReady) { alertReady(o.num); notifyReady(o.num, o.pickup); redraw = true; }
          // Handed over at the counter: stop any ringing and redraw so the
          // card says "Collected" instead of still asking them to come over.
          if (ch.becameCollected) { stopRinging(); redraw = true; }
          if (ch.paidChanged) redraw = true; // the paid badge + banner live outside the steps box
          const box = document.querySelector('[data-track="' + o.num + '"]');
          if (box) box.innerHTML = stepsHtml(r.state, o.type);
        }
      } catch (e) { /* keep the last known state and try again next tick */ }
    }
    // Only rebuild when the "Your orders" list is what's on screen.
    if (redraw && el('tomenu')) showOrders();
    holdWake(); // release the screen once nothing is live any more
  };
  tick();
  if (!tracking) tracking = setInterval(tick, 15000);
}

function fatal(title, msg) {
  el('app').innerHTML = '<div class="center"><h2>' + esc(title) + '</h2><p>' + esc(msg) + '</p>' +
    '<div style="margin-top:22px"><button class="ghost" id="retry">Try again</button></div></div>';
  el('retry').onclick = () => location.reload();
}

(async () => {
  if (!TOKEN) {
    fatal('Ordering link needed', 'Scan the QR code on your table to see the menu.');
    return;
  }
  try {
    const m = await rpc('kiosk_menu', { p_token: TOKEN });
    if (!m || !m.ok) {
      fatal('This link is not active', (m && m.error) || 'Please ask a staff member for help.');
      return;
    }
    // The shop gates QR ordering on an open shift (0068) and none is open.
    // Server-enforced too — this screen is just the polite version of the
    // refusal kiosk_place_order would give anyway.
    if (m.shop && m.shop.closed) {
      fatal((m.shop.name || 'This shop') + ' is closed right now',
        'Ordering opens again when the counter does. Please come back later!');
      return;
    }
    if (!m.items.length) {
      fatal('Not serving right now', 'The kitchen has nothing on the menu at the moment. Please ask a staff member.');
      return;
    }
    MENU = m;
    CUR = (m.shop && m.shop.currency) || '₱';
    TAXPCT = Number((m.shop && m.shop.tax_percent) || 0);
    if (m.link && m.link.kind === 'store') {
      STORE = (m.shop && m.shop.ordering) || {};
      if (!STORE.pickup && !STORE.delivery) {
        fatal('Online ordering is off',
          ((m.shop && m.shop.name) || 'This shop') + ' is not taking online orders right now. Please message the shop directly.');
        return;
      }
      OMODE = STORE.pickup ? 'pickup' : 'delivery';
    }
    render();
  } catch (e) {
    fatal('No connection', 'Check your signal and try again.');
  }
})();
</script>
</body>
</html>
