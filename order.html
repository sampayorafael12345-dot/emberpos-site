<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<title>Order</title>
<link rel="icon" href="favicon.png">

<style>

  :root {
    color-scheme: light dark;
    --bg: #f2f2f4;          --bg-sub: #ffffff;
    --card: #ffffff;        --line: #e8e8ec;
    --text: #18181b;        --muted: #5f5f6b;

    --accent: #ff5c00;      --accent-ink: #1a0e05;   --accent-text: #b84000;
    --ok: #047857;          --warn: #b45309;
    --shadow: 0 1px 2px rgb(0 0 0 / .06), 0 8px 24px rgb(0 0 0 / .06);
    --r-sm: 10px; --r-md: 14px; --r-lg: 20px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0f11;        --bg-sub: #1b1c20;
      --card: #17181b;      --line: #292b31;
      --text: #f4f4f5;      --muted: #a5a5ae;

      --accent: #ff5c00;    --accent-ink: #1a0e05;   --accent-text: #ff8340;
      --ok: #34d399;        --warn: #fbbf24;
      --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 10px 30px rgb(0 0 0 / .35);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overscroll-behavior-y: none; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.45;
    padding-bottom: env(safe-area-inset-bottom);
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  .hero {
    position: relative; overflow: hidden; color: #fff;
    background: linear-gradient(145deg, #ff7a2e 0%, var(--accent) 48%, #d94e00 100%);
    padding: calc(20px + env(safe-area-inset-top)) 16px 18px;
  }
  .hero::after {
    content: ''; position: absolute; right: -60px; top: -90px; width: 260px; height: 260px;
    border-radius: 50%; background: rgb(255 255 255 / .13); pointer-events: none;
  }
  .hero .mark { display: none; }
  .hero .id { display: flex; align-items: center; gap: 13px; position: relative; }

  .hero .logo {
    flex: 0 0 auto; width: 62px; height: 62px; border-radius: 14px;
    background: #fff; padding: 7px; object-fit: contain;
    box-shadow: 0 3px 12px -3px rgb(0 0 0 / .35);
  }
  .hero h1 {
    margin: 0; font-size: 25px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15;
    text-wrap: balance; min-width: 0;
  }
  .hero .meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; position: relative; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
    background: rgb(255 255 255 / .2); color: #fff; border-radius: 999px;
    padding: 5px 11px; font-size: 12.5px; font-weight: 650;
  }
  .chip.solid { background: #fff; color: #9a3412; }
  .hero .mine {
    position: relative; margin-top: 12px; width: 100%; display: block;
    background: rgb(255 255 255 / .16); color: #fff; border: 1px solid rgb(255 255 255 / .3);
    border-radius: 12px; padding: 11px 14px; font-size: 14px; font-weight: 700; text-align: center;
  }

  .stick {
    position: sticky; top: 0; z-index: 20; background: var(--bg-sub);
    border-bottom: 1px solid var(--line); padding: 10px 16px 0;
  }
  .search { position: relative; margin: 0 0 10px; }
  .search input {
    width: 100%; padding: 11px 14px 11px 38px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--bg); font-size: 15px;
  }
  .search input::placeholder { color: var(--muted); }
  .search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .cats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 9px; scrollbar-width: none; }
  .cats::-webkit-scrollbar { display: none; }

  .cat {
    flex: 0 0 auto; padding: 7px 2px 8px; font-size: 14.5px; font-weight: 650;
    color: var(--muted); border-bottom: 2.5px solid transparent; margin-right: 8px;
    background: none; border-radius: 0;
  }
  .cat[aria-current="true"] { color: var(--accent-text); border-bottom-color: var(--accent); }

  .cats-wrap { position: relative; }
  .cats-wrap::after {
    content: ''; position: absolute; right: -16px; top: 0; bottom: 9px; width: 38px;
    pointer-events: none; background: linear-gradient(to right, transparent, var(--bg-sub));
  }

  .list { padding: 0 16px; display: block; background: var(--bg-sub); }

  .item {
    display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left;
    background: none; border: 0; border-top: 1px solid var(--line);
    border-radius: 0; padding: 14px 0; transition: background .15s;
  }
  .list > .item:first-child { border-top: 0; }
  .item:active { background: color-mix(in srgb, var(--accent) 8%, transparent); }

  .shot { position: relative; flex: 0 0 auto; margin-left: auto; }
  .thumb {
    width: 84px; height: 84px; border-radius: 12px; display: block;
    object-fit: cover; background: var(--bg);
    font-weight: 800; font-size: 29px;
    display: grid; place-items: center;
  }

  .plus {
    position: absolute; right: -8px; bottom: -8px;
    width: 32px; height: 32px; border-radius: 999px;
    background: var(--accent); color: var(--accent-ink);
    border: 2px solid var(--bg-sub); box-shadow: 0 2px 8px -2px rgb(0 0 0 / .35);
    display: grid; place-items: center;
  }

  .plus svg { width: 16px; height: 16px; display: block; }
  .item:active .plus { transform: scale(.92); }

  .thumb.ph { background: hsl(var(--h) 26% 92%); color: hsl(var(--h) 24% 42%); }
  @media (prefers-color-scheme: dark) {
    .thumb.ph { background: hsl(var(--h) 16% 20%); color: hsl(var(--h) 26% 68%); }
  }
  .item .mid { min-width: 0; flex: 1; padding-top: 1px; }
  .item .nm { font-weight: 650; font-size: 15.5px; line-height: 1.3; letter-spacing: -.005em; }
  .item .ds { color: var(--muted); font-size: 13px; margin-top: 3px; line-height: 1.4;
              display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item .meal { color: var(--accent-text); font-size: 12.5px; font-weight: 650; margin-top: 3px; }

  .item .pr {
    font-weight: 800; white-space: nowrap; font-size: 15.5px; margin-top: 6px;
    font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1;
  }
  .item.out .plus { display: none; }

  .item.out { opacity: .48; }
  .item.out:active { background: none; }
  .item.out .thumb { filter: grayscale(1); }
  .item.out .pr { text-decoration: line-through; color: var(--muted); }
  .soldout {
    display: inline-block; margin-top: 4px; padding: 2px 7px; border-radius: 999px;
    font-size: 10.5px; font-weight: 700; letter-spacing: .02em;
    background: var(--line); color: var(--muted);
  }

  .grp {
    font-size: 18px; font-weight: 800; letter-spacing: -.015em;
    padding: 20px 16px 4px; background: var(--bg-sub); scroll-margin-top: 104px;
  }
  .sec { background: var(--bg-sub); }
  .sec + .sec { margin-top: 10px; border-top: 1px solid var(--line); }
  .list-tight { padding-top: 0; padding-bottom: 0; }
  .list-tight:last-of-type { padding-bottom: 10px; }

  .bar {
    position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
    z-index: 30; background: var(--accent); color: var(--accent-ink);
    border-radius: 14px; box-shadow: 0 6px 22px -6px rgb(0 0 0 / .45);
    padding: 0; display: flex; align-items: stretch; overflow: hidden;
    animation: pop .2s cubic-bezier(.16,1,.3,1);
  }
  @keyframes pop { from { transform: translateY(10px); opacity: 0 } to { transform: none; opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .bar { animation: none } }
  .bar .sum {
    display: flex; align-items: center; gap: 9px; padding: 14px 4px 14px 16px;
    font-weight: 800; font-size: 15.5px; font-variant-numeric: tabular-nums;
  }
  .bar .n {
    min-width: 23px; height: 23px; padding: 0 6px; border-radius: 999px;
    background: rgb(0 0 0 / .18); display: grid; place-items: center; font-size: 13px;
  }
  .bar .primary {
    flex: 0 0 auto; margin-left: auto;
    background: none; color: inherit; border-radius: 0; box-shadow: none;
    padding: 14px 16px; font-size: 15.5px; font-weight: 800;
  }

  .bar.solo { justify-content: center; }
  .bar.solo .primary { flex: 1 1 auto; margin-left: 0; text-align: center; }

  .bar.two .primary { flex: 1 1 0; margin-left: 0; text-align: center; }
  .bar.two .primary + .primary { box-shadow: inset 1px 0 0 rgb(0 0 0 / .22); }
  .primary {
    flex: 1; background: var(--accent); color: var(--accent-ink); border-radius: var(--r-sm);
    padding: 14px 16px; font-size: 16px; font-weight: 700; white-space: nowrap;
    transition: transform .1s, opacity .15s;
  }
  .primary:active { transform: translateY(1px); }
  .primary[disabled] {
    opacity: 1; cursor: default; background: var(--bg-sub);
    color: var(--muted); box-shadow: inset 0 0 0 1px var(--line);
  }
  .ghost {
    border: 1px solid var(--line); background: var(--bg-sub); border-radius: var(--r-sm);
    padding: 14px 18px; font-weight: 600;
  }

  .scrim { position: fixed; top: 0; right: 0; bottom: 0; left: 0; inset: 0; z-index: 40; background: rgb(0 0 0 / .5); display: none; }
  .scrim.on { display: block; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; max-height: 90vh; overflow: auto;
    background: var(--bg); border-radius: var(--r-lg) var(--r-lg) 0 0;
    padding: 8px 16px calc(16px + env(safe-area-inset-bottom));
    animation: rise .22s cubic-bezier(.16,1,.3,1);
  }

  .sheet .foot {
    position: sticky; bottom: calc(-16px - env(safe-area-inset-bottom)); z-index: 2;
    display: flex; gap: 10px; margin: 18px -16px 0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--bg); border-top: 1px solid var(--line);
  }
  .sheet .foot::before {
    content: ''; position: absolute; left: 0; right: 0; top: -24px; height: 24px;
    pointer-events: none; background: linear-gradient(to bottom, transparent, var(--bg));
  }
  .sheet .foot .ghost, .sheet .foot .primary { margin: 0; }
  @keyframes rise { from { transform: translateY(14px); opacity: .6 } to { transform: none; opacity: 1 } }

  .sheet.full {
    top: 0; max-height: none; height: 100%; border-radius: 0;
    padding-top: calc(8px + env(safe-area-inset-top));
    display: flex; flex-direction: column;
  }
  .sheet.full .foot { margin-top: auto; }
  .sheet.full .grab { display: none; }
  .sheet .shead {
    display: flex; align-items: flex-start; gap: 12px; margin: 2px 0 2px;
  }
  .sheet .shead h2 { flex: 1; }
  .sheet .x {
    flex: 0 0 auto; width: 36px; height: 36px; border-radius: 999px;
    background: var(--bg-sub); border: 1px solid var(--line);
    display: grid; place-items: center; color: var(--muted);
  }
  .sheet .biglead { color: var(--muted); font-size: 14.5px; margin: 2px 0 0; line-height: 1.45; }
  .sheet .bigprice { font-size: 19px; font-weight: 800; margin-top: 8px;
                     font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) {
    .sheet { animation: none; }
    .item:active, .primary:active { transform: none; }
  }
  .grab { width: 38px; height: 4px; border-radius: 99px; background: var(--line); margin: 6px auto 14px; }
  .sheet h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: -.01em; }
  .sheet .lede { color: var(--muted); font-size: 14px; margin: 0 0 4px; }

  .sheet .allergens {
    margin: 6px 0 2px; padding: 8px 10px; border-radius: 10px;
    background: rgba(255,176,32,0.14); border: 1px solid rgba(180,83,9,0.35);
    color: #7a4a00; font-size: 13px; line-height: 1.45;
  }
  .sheet .diet { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 2px; }
  .sheet .diet span {
    font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 3px 7px; border-radius: 999px;
    background: rgba(22,163,74,0.10); border: 1px solid rgba(22,163,74,0.35); color: #166534;
  }
  @media (prefers-color-scheme: dark) {
    .sheet .allergens { background: rgba(255,176,32,0.10); border-color: rgba(255,176,32,0.34); color: #ffd79a; }
    .sheet .diet span { background: rgba(74,222,128,0.12); border-color: rgba(74,222,128,0.30); color: #86efac; }
  }
  .sheet .nutri { color: var(--muted); font-size: 12px; margin: 4px 0 2px; }

  .csat { margin-top: 18px; text-align: center; }
  .csat .q { font-size: 14px; font-weight: 650; color: var(--text); margin-bottom: 8px; }
  .csat .row { display: flex; justify-content: center; gap: 6px; border-bottom: 0; }

  #stars button, #svcstars button {
    display: inline-grid; place-items: center; width: 44px; height: 44px; cursor: pointer;
    border: 0; background: none; padding: 0;
  }
  #stars .mi, #svcstars .mi { width: 27px; height: 27px; }

  .csat .row button {
    font: inherit; font-size: 20px; line-height: 1; cursor: pointer;
    background: var(--bg-sub); border: 1px solid var(--line); color: var(--text);
    border-radius: 999px; min-width: 52px; min-height: 52px;
  }
  .csat .row button:active { background: var(--line); color: var(--text); }
  .csat .done { color: var(--ok); font-size: 14px; }

  .label {
    font-size: 14px; font-weight: 650; color: var(--text);
    margin: 20px 0 9px; letter-spacing: -.005em;
    display: flex; align-items: center; gap: 7px;
  }
  .label .mi { color: var(--muted); }

  .req {
    display: inline-block; margin-left: 8px; padding: 2px 7px; border-radius: 999px;
    font-size: 10.5px; font-weight: 700; letter-spacing: .02em; text-transform: none;
    background: var(--line); color: var(--muted); vertical-align: 1px;
  }

  .req-on { background: var(--bg-sub); box-shadow: inset 0 0 0 1px var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent-text); }
  .opt {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    border: 1px solid var(--line); background: var(--card); border-radius: var(--r-sm);
    padding: 13px; margin-bottom: 8px; font-size: 15px;
  }
  .opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--bg-sub); background: color-mix(in srgb, var(--accent) 12%, transparent); font-weight: 600; }
  .opt .delta { margin-left: auto; color: var(--muted); font-size: 14px; }
  .opt[aria-pressed="true"] .delta { color: var(--accent-text); }
  .note-in { width: 100%; padding: 12px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--bg-sub);

    flex-shrink: 0; }

  #ocpn { text-transform: uppercase; letter-spacing: .5px; }
  #ocpn::placeholder { text-transform: none; letter-spacing: 0; }
  .stepper { display: flex; align-items: center; gap: 14px; }
  .stepper button { width: 42px; height: 42px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--bg-sub); font-size: 20px; font-weight: 700; }
  .stepper span { min-width: 26px; text-align: center; font-weight: 700; font-size: 17px; }

  .adq { display: flex; align-items: center; gap: 4px; margin-left: 10px; }
  .adq button {
    width: 34px; height: 34px; border-radius: var(--r-sm); border: 1px solid var(--line);
    background: var(--bg-sub); font-size: 18px; font-weight: 700; line-height: 1;
  }
  .adq b { min-width: 20px; text-align: center; font-size: 15px; }
  .opt .adq + .delta, .opt .delta.pushed { margin-left: 0; }
  .row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .row:last-of-type { border-bottom: 0; }
  .totals { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 12px; }
  .totals div { display: flex; justify-content: space-between; padding: 3px 0; color: var(--muted); font-size: 14px; }
  .totals div.grand { color: var(--text); font-weight: 800; font-size: 19px; padding-top: 8px; }
  .totals div span:last-child, .bar .sum b, .stepper span {
    font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1;
  }

  .center { text-align: center; padding: 56px 24px; }
  .center h2 { margin: 0 0 8px; font-size: 20px; }
  .center p { color: var(--muted); margin: 0 auto; max-width: 320px; font-size: 14.5px; }
  .skel { background: var(--bg-sub); border-radius: var(--r-sm); height: 68px; margin-bottom: 1px;
          animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .55 } }
  @media (prefers-reduced-motion: reduce) { .skel { animation: none } }
  .toast {
    position: fixed; left: 50%; bottom: calc(112px + env(safe-area-inset-bottom));
    transform: translateX(-50%); z-index: 60;
    background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 600; box-shadow: var(--shadow); max-width: 90vw;
  }
  .scrim.on:not(.closing) ~ .toast {
    bottom: auto; top: calc(76px + env(safe-area-inset-top));
  }
  .num { font-size: 40px; font-weight: 800; letter-spacing: .5px; margin: 10px 0 18px; }
  .steps { display: grid; gap: 10px; max-width: 320px; margin: 0 auto; text-align: left; }
  .step { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: var(--r-sm);
          border: 1px solid var(--line); background: var(--card); color: var(--muted); font-size: 14.5px; }
  .step.on { border-color: var(--accent); color: var(--text); font-weight: 700; }
  .step.done { color: var(--text); }
  .dot { width: 10px; height: 10px; border-radius: 99px; background: var(--line); flex: 0 0 auto; }
  .step.on .dot { background: var(--accent); }
  .step.done .dot { background: var(--ok); }

  body.has-cart .madeby { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  .madeby {
    text-align: center; padding: 26px 16px calc(24px + env(safe-area-inset-bottom));
    color: var(--muted); font-size: 12px; letter-spacing: .01em;
  }
  .madeby a { color: var(--muted); font-weight: 700; text-decoration: none; border-bottom: 1px solid var(--line); }
  .madeby .flame { color: var(--accent); font-weight: 800; }

  .mi { width: 18px; height: 18px; flex: 0 0 auto; vertical-align: -3px; }
  .modes { display: flex; gap: 8px; }
  .modes button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; }

  .whens { display: flex; gap: 8px; flex-wrap: wrap; }
  .when {
    flex: 1 1 auto; min-width: 96px; padding: 12px 10px; border-radius: var(--r-sm);
    border: 1px solid var(--line); background: var(--card); font-size: 14.5px; font-weight: 600;
  }
  .when[aria-pressed="true"] {
    border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent);
    background: var(--bg-sub); background: color-mix(in srgb, var(--accent) 12%, transparent);
    color: var(--accent-text);
  }
  .when-sel { width: 100%; padding: 12px; border-radius: var(--r-sm);
              border: 1px solid var(--line); background: var(--bg-sub); margin-top: 8px; }

  .when-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .trip { margin: 0 0 12px; padding: 12px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--bg-sub); }
  .trip .tt { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14.5px; }
  .trip .tt svg { color: var(--accent-text); }
  .trip .ti { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .trip .tripmap { height: 210px; margin-top: 10px; border-radius: var(--r-sm); overflow: hidden; background: var(--card); }
  .trip .tripmap > div { width: 100%; height: 100%; }

  .pinmap { height: 220px; margin-top: 8px; border-radius: var(--r-sm); overflow: hidden; border: 1px solid var(--line); background: var(--card); }
  .pinmap > div { width: 100%; height: 100%; }
  .pinmap .em-pin.em-home { cursor: grab; }
  @media (prefers-reduced-motion: no-preference) {
    .trip.swapin { animation: tripIn .32s cubic-bezier(.2, .8, .2, 1) both; }
    @keyframes tripIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  }

  .tips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .tips .when { min-width: 0; padding: 10px 4px; font-size: 13.5px; line-height: 1.2; }
  .tips .when small { display: block; font-size: 11.5px; font-weight: 500; color: var(--muted); margin-top: 2px; }
  .tips .when[aria-pressed="true"] small { color: inherit; }

  .srow { display: flex; gap: 8px; margin: 0 0 10px; }
  .srow .search { flex: 1; margin: 0; }
  .fbtn { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; padding: 0 14px;
          border-radius: 12px; border: 1px solid var(--line); background: var(--bg-sub); font-size: 14px; font-weight: 650; }

    const r = await fetch(URLB + "/rest/v1/rpc/" + fn, {
      method: "POST",
      headers: {

        apikey: ANON,
        Authorization: "Bearer " + ANON
      },
      body: JSON.stringify(args),
      signal: ctl ? ctl.signal : undefined
    });
    if (!r.ok) throw new Error("network");
    return await r.json();
  } finally {
    if (timer) clearTimeout(timer);
  }
}

function freshLine(l) {
  if (!l || !MENU) return null;
  const it = MENU.items.find(x => x.id === l.item_id);
  if (!it || soldOut(it)) return null;
  const sizes = it.sizes || [];
  const size = l.variant_id != null ? sizes.find(z => z.id === l.variant_id) : null;
  if (l.variant_id != null && !size || l.variant_id == null && sizes.length) return null;
  let price = it.price_cents + (size ? size.delta : 0);
  const opts = Array.isArray(l.options) ? l.options : [];
  for (const sl of it.slots || []) {
    if (!sl.options || !sl.options.length) continue;
    const o = sl.options.find(x => opts.indexOf(x.id) >= 0);
    if (!o) return null;
    price += o.delta;
  }
  const ids = Array.isArray(l.addons) ? l.addons : [];
  if (ids.length && it.no_addons) return null;
  const allow = it.addon_ids && it.addon_ids.length ? it.addon_ids : null;
  for (const id of ids) {
    const a = (MENU.addons || []).find(x => x.id === id);
    if (!a || allow && allow.indexOf(id) < 0) return null;
    price += Math.max(0, a.price_cents || 0);
  }
  const taxFree = !!(it.tax_exempt || it.zero_rated);
  return Object.assign({}, l, {
    name: it.name,
    price: Math.round(price),
    taxExempt: taxFree
  });
}

  try {

    saved = null;
  }
  if (!saved || !(Date.now() - Number(saved.at) < CART_KEEP_MS)) {
    try {
      sessionStorage.removeItem(CART_KEY);
    } catch (e) {}
    return;
  }
  DRAFT = saved.draft && typeof saved.draft === "object" ? saved.draft : {};
  if (STORE && typeof saved.zone === "string") ZONE = saved.zone;
  if (STORE && typeof saved.when === "string") {
    WHEN = saved.when;
    WHENDAY = typeof saved.whenday === "string" ? saved.whenday : "";
  }
  const lines = Array.isArray(saved.lines) ? saved.lines : [];
  if (!lines.length) return;
  CART = lines.map(freshLine).filter(Boolean);
  toast(CART.length === lines.length ? "Your basket is back." : CART.length ? "Your basket is back. Some items are no longer available and were taken out." : "Some items are no longer available and were taken out.");
}

function kmFee(cfg, lat, lng) {
  const R = 6371, rad = d => d * Math.PI / 180;
  const dla = rad(lat - cfg.lat), dlo = rad(lng - cfg.lng);
  const a = Math.sin(dla / 2) ** 2 + Math.cos(rad(cfg.lat)) * Math.cos(rad(lat)) * Math.sin(dlo / 2) ** 2;
  const km = 2 * R * Math.asin(Math.min(1, Math.sqrt(a))) * 1.3;
  if (km > Number(cfg.max_km)) return {
    km: km,
    fee: -1
  };
  return {
    km: km,
    fee: Number(cfg.base_cents) + Math.max(0, Math.ceil(km - Number(cfg.free_km))) * Number(cfg.rate_cents)
  };
}

  lat = Math.round(lat * 1e5) / 1e5;
  lng = Math.round(lng * 1e5) / 1e5;
  if (kmCfg()) {
    const r = kmFee(kmCfg(), lat, lng);
    return {
      lat: lat,
      lng: lng,
      km: r.km,
      fee: r.fee,
      moved: !!moved,
      fromShop: !!fromShop
    };
  }
  return {
    lat: lat,
    lng: lng,
    km: null,
    fee: 0,
    pinOnly: true,
    moved: !!moved,
    fromShop: !!fromShop
  };
}

const vatable = () => CART.reduce((s, l) => s + (l.taxExempt ? 0 : l.price * l.qty), 0) + deliveryFee();

const disc = () => Math.max(0, promoCents());

const svcOf = () => SVCPCT > 0 && SVCTO.indexOf(orderKind()) >= 0 ? Math.round(Math.max(0, subtotal() + deliveryFee() - disc()) * SVCPCT / 100) : 0;

const taxOf = () => {
  const base = subtotal() + deliveryFee();
  const svc = svcOf();
  const vat = vatable();
  if (!(base > 0)) return Math.round((vat + svc) * TAXPCT / 100);
  return Math.round((Math.max(0, vat - disc() * vat / base) + svc * (vat / base)) * TAXPCT / 100);
};

function linesFromServerOrder(o) {
  const lines = [];
  let skipped = 0;
  (o.items || []).forEach(function(l) {
    if (!l.menu_item_id) return;
    const it = MENU.items.find(x => x.id === l.menu_item_id);
    if (!it || soldOut(it) || it.slots && it.slots.length) {
      skipped++;
      return;
    }
    const size = l.variant_id ? (it.sizes || []).find(z => z.id === l.variant_id) : null;
    if (l.variant_id && !size) {
      skipped++;
      return;
    }
    if (!l.variant_id && (it.sizes || []).length) {
      skipped++;
      return;
    }
    const ids = (Array.isArray(l.modifier_ids) ? l.modifier_ids : []).map(e => e && typeof e === "object" ? e.id : e).filter(x => x != null);
    const ads = ids.map(id => MENU.addons.find(a => String(a.id) === String(id))).filter(Boolean);
    if (ads.length !== ids.length) {
      skipped++;
      return;
    }
    const unitPrice = it.price_cents + (size ? size.delta : 0) + ads.reduce((t, a) => t + Math.max(0, a.price_cents || 0), 0);
    lines.push({
      item_id: it.id,
      name: it.name,
      qty: Math.max(1, Math.round(Number(l.qty) || 1)),
      price: Math.round(unitPrice),
      taxExempt: !!(it.tax_exempt || it.zero_rated),
      variant_id: size ? size.id : null,
      variant_label: size ? size.label : null,
      options: [],
      option_labels: [],
      addons: ads.map(a => a.id),
      addon_labels: ads.map(a => a.text),
      note: l.note || ""
    });
  });
  return {
    lines: lines,
    skipped: skipped
  };
}

function hhmm12(t) {
  const m = /^(\d{1,2}):(\d{2})/.exec(String(t || ""));
  if (!m) return "";
  let h = Number(m[1]);
  const ap = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return h + ":" + m[2] + " " + ap;
}

async function claimRecent() {
  if (!ACCT || !EmberAccount.getSession() || ACCT.profile && ACCT.profile.needs_profile) return;
  const cut = Date.now() - 29 * 60 * 1e3;
  const mine = loadOrders().filter(o => o.ref && o.at > cut && !o.claimed && o.state !== "cancelled");
  for (const o of mine) {
    try {
      const r = await EmberAccount.rpc("cust_claim_order", {
        p_session: EmberAccount.getSession(),
        p_token: TOKEN,
        p_order_number: o.num,
        p_client_ref: o.ref
      });
      if (r && r.ok) {
        const a = loadOrders();
        const k = a.findIndex(x => x.num === o.num);
        if (k >= 0) {
          a[k].claimed = true;
          writeOrders(a);
        }
      }
    } catch (e) {}
  }
  if (mine.length) await loadAcct();
}

async function cancelOrder(num) {
  const o = loadOrders().find(x => x.num === num);
  if (!o || !o.ref) return;
  if (!confirm("Cancel this order? The shop has not started on it yet.")) return;
  try {
    const r = await rpc("kiosk_cancel_order", {
      p_token: TOKEN,
      p_order_number: num,
      p_client_ref: o.ref
    });
    if (!r || !r.ok) {
      toast(r && r.error || "Could not cancel. Please call the shop.");
      return;
    }
    markOrder(num, "cancelled");
    patchOrder(num, {
      cancelReason: "customer"
    });
    STEP_MOVED[num] = 1;
    toast("Your order is cancelled.");
    showOrders();
  } catch (e) {
    toast("No connection. Try again, or call the shop.");
  }
}

async function imHere(num) {

const POS_COLORS = [ "#f97316", "#3b82f6", "#22c55e", "#a855f7", "#ec4899", "#ef4444", "#a3e635", "#9ca3af" ];

const HEX = /^#[0-9a-fA-F]{6}$/;

function catFill(id) {
  const n = MENU.categories.findIndex(c => c.id === id);
  const c = MENU.categories[n];
  if (c && HEX.test(c.color || "")) return c.color;
  return POS_COLORS[(n < 0 ? 0 : n) % POS_COLORS.length];
}

function fillOf(i) {
  return HEX.test(i.color || "") ? i.color : catFill(i.category_id);
}

function lineFill(l) {
  const it = MENU && MENU.items.find(m => m.id === l.item_id);
  return it ? fillOf(it) : "#9ca3af";
}

function alsoLike() {
  if (!MENU) return [];
  const inCart = new Set(CART.map(l => l.item_id));
  const cats = new Set(CART.map(l => (MENU.items.find(m => m.id === l.item_id) || {}).category_id));
  const ok = i => i && !inCart.has(i.id) && !soldOut(i) && i.price_cents > 0 && passesFilters(i);
  const out = [];
  CART.forEach(l => (UPSELLS[l.item_id] || []).forEach(id => {
    const it = MENU.items.find(m => m.id === id);
    if (ok(it) && !out.includes(it)) out.push(it);
  }));
  MENU.categories.forEach(c => {
    if (out.length >= 4 || cats.has(c.id)) return;
    const it = MENU.items.find(m => m.category_id === c.id && ok(m));
    if (it && !out.includes(it)) out.push(it);
  });
  return out.slice(0, out.length >= 4 ? 4 : out.length >= 2 ? 2 : 0);
}

  const list = alsoLike();

let SPY = null;

function stickH() {
  const st = document.querySelector(".stick");
  return st ? st.offsetHeight : 104;
}

function markTab(id) {
  let on = null;
  document.querySelectorAll(".cat").forEach(t => {
    const is = String(t.dataset.c) === String(id);
    t.setAttribute("aria-current", is);
    if (is) on = t;
  });
  if (on && on.parentElement) {
    const strip = on.parentElement;
    const want = on.offsetLeft - (strip.clientWidth - on.offsetWidth) / 2;
    const max = strip.scrollWidth - strip.clientWidth;
    strip.scrollTo({
      left: Math.max(0, Math.min(want, max)),
      behavior: "smooth"
    });
  }
}

function watchSections() {
  if (SPY) {
    SPY.disconnect();
    SPY = null;
  }
  const secs = [ ...document.querySelectorAll(".sec[data-sec]") ];
  if (!secs.length || !("IntersectionObserver" in window)) return;
  SPY = new IntersectionObserver(entries => {
    const vis = entries.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
    if (vis.length) markTab(vis[0].target.dataset.sec);
  }, {
    rootMargin: "-" + (stickH() + 8) + "px 0px -55% 0px",
    threshold: 0
  });
  secs.forEach(x => SPY.observe(x));
}

let SHEET_STOP = null, SHEET_DISMISS = null;

let SHEET_SAME = false;

let SHEET_RETURN = null;

let SHEET_CLOSE_T = null;

function dropSheetHooks() {
  const stop = SHEET_STOP;
  SHEET_STOP = null;
  SHEET_DISMISS = null;
  if (stop) {
    try {

    } catch (e) {}

let JUST = null;

const JUST_ATTRS = [ "data-adp", "data-adm", "data-sz", "data-op", "data-ad", "data-fd", "data-fa", "data-tip", "data-when", "data-omode", "data-paych", "data-paywith", "data-kmode", "data-peat" ];

const JUST_SEL = JUST_ATTRS.map(a => "[" + a + "]").join(",");

el("sheet").addEventListener("click", e => {
  JUST = null;
  const t = e.target;
  if (!t || !t.closest) return;
  if (t.closest("#minus, #plus")) {
    JUST = [ "qv" ];
    return;
  }
  const hit = t.closest(JUST_SEL);
  if (hit) for (const a of JUST_ATTRS) if (hit.hasAttribute(a)) {
    JUST = [ a, hit.getAttribute(a) ];
    break;
  }
}, true);

const NUDGE_IDS = [ "add", "fgo", "send" ];

const APPEAR_IDS = [ "whensel", "daysel", "otip", "opaywith", "oaddrsel", "oaddr", "ozone", "ogeo", "oph" ];

const STAGGER = ".row, .opt, .acard, .adet, .fchips .when, .tips .when, .modes button";

function sheetSnapshot() {
  const ids = {}, txt = {};
  el("sheet").querySelectorAll("[id]").forEach(x => {
    ids[x.id] = 1;
  });
  NUDGE_IDS.forEach(id => {
    const x = el(id);
    if (x) txt[id] = x.textContent;
  });
  return {
    ids: ids,
    txt: txt
  };
}

function answerTap(before) {
  const sheet = el("sheet");
  const j = JUST;
  JUST = null;
  if (j && j[0] === "qv") replay(el("qv"), "tick"); else if (j && (j[0] === "data-adp" || j[0] === "data-adm")) {
    const row = [ ...sheet.querySelectorAll("[data-ad]") ].find(x => x.getAttribute("data-ad") === j[1]);
    const b = row && row.querySelector(".adq b");
    if (b) replay(b, "tick");
  } else if (j) {
    const hit = [ ...sheet.querySelectorAll("[" + j[0] + "]") ].find(x => x.getAttribute(j[0]) === j[1]);
    if (hit) replay(hit, "just");
  }
  NUDGE_IDS.forEach(id => {
    const x = el(id);
    if (x && before.txt[id] != null && before.txt[id] !== x.textContent) replay(x, "nudged");
  });
  APPEAR_IDS.forEach(id => {
    const x = el(id);
    if (!x || before.ids[id]) return;
    const box = x.closest(".when-pair") || x;
    replay(box, "swapin");
    const lab = box.previousElementSibling;
    if (lab && lab.classList.contains("label")) replay(lab, "swapin");
  });
}

function labelSheet() {
  const sheet = el("sheet"), h = sheet.querySelector("h2");
  if (h) {
    if (!h.id) h.id = "sheet-h";
    sheet.setAttribute("aria-labelledby", h.id);
  } else sheet.removeAttribute("aria-labelledby");
}

function openSheet(html, full) {
  dropSheetHooks();
  const scrim = el("scrim"), sheet = el("sheet");
  const same = SHEET_SAME && sheetOpen();
  SHEET_SAME = false;
  const fresh = !sheetOpen();
  const before = same ? sheetSnapshot() : null;
  const ae = document.activeElement;
  const fid = same && ae && ae.id && sheet.contains(ae) ? ae.id : "";
  if (SHEET_CLOSE_T) {
    clearTimeout(SHEET_CLOSE_T);
    SHEET_CLOSE_T = null;
  }
  if (!scrim.classList.contains("on")) SHEET_RETURN = document.activeElement;
  const top = same ? sheet.scrollTop : 0;
  scrim.classList.remove("closing");
  sheet.innerHTML = '<div class="grab"></div>' + html;
  el("sheet").classList.toggle("full", !!full);
  scrim.classList.add("on");
  document.body.style.overflow = "hidden";
  sheet.scrollTop = top;
  labelSheet();
  if (same) {
    sheet.classList.remove("intro", "swap");
    if (fid && el(fid)) {
      try {
        el(fid).focus({
          preventScroll: true
        });
      } catch (e) {}
    }
    answerTap(before);
    return;
  }
  JUST = null;
  if (fresh) {
    sheetHistoryPush();
    sheet.classList.remove("swap");
    sheet.style.animation = "none";
    void sheet.offsetWidth;
    sheet.style.animation = "";
    sheet.querySelectorAll(STAGGER).forEach((x, n) => x.style.setProperty("--i", String(Math.min(n, 8))));
    replay(sheet, "intro");
    setTimeout(() => sheet.classList.remove("intro"), 900);
  } else {
    sheet.classList.remove("intro");
    replay(sheet, "swap");
  }
  setTimeout(() => {
    if (!sheetOpen() || sheet.contains(document.activeElement)) return;
    labelSheet();
    const f = sheet.querySelector("button:not([disabled]), [href]");
    if (f) {
      try {
        f.focus({
          preventScroll: true
        });
      } catch (e) {}
    }
  }, 60);
}

function closeSheet() {
  dropSheetHooks();
  SHEET_SAME = false;
  JUST = null;
  document.body.style.overflow = "";
  const scrim = el("scrim"), sheet = el("sheet");
  if (!scrim.classList.contains("on") || scrim.classList.contains("closing")) return;
  const back = SHEET_RETURN;
  SHEET_RETURN = null;
  sheetHistoryDrop();
  const done = () => {
    SHEET_CLOSE_T = null;
    scrim.classList.remove("on", "closing");
    sheet.classList.remove("intro", "swap");
    sheet.innerHTML = "";
  };
  if (calm()) done(); else {
    scrim.classList.add("closing");
    SHEET_CLOSE_T = setTimeout(done, 200);
  }
  if (back && back !== document.body && document.contains(back)) {
    try {
      back.focus({
        preventScroll: true
      });
    } catch (e) {}
  }
}

el("scrim").onclick = e => {
  if (e.target.id === "scrim") dismissSheet();
};

let HIST_BACKING = false;

function sheetHistoryPush() {
  try {
    if (!(history.state && history.state.emberSheet)) history.pushState({
      emberSheet: 1
    }, "");
  } catch (e) {}
}

function sheetHistoryDrop() {
  setTimeout(function() {
    try {
      if (sheetOpen() || !(history.state && history.state.emberSheet)) return;
      HIST_BACKING = true;
      history.back();
    } catch (e) {
      HIST_BACKING = false;
    }
  }, 0);
}

window.addEventListener("popstate", function() {
  if (HIST_BACKING) {
    HIST_BACKING = false;
    if (sheetOpen()) sheetHistoryPush();
    return;
  }
  if (sheetOpen()) dismissSheet();
});

try {
  if (history.state && history.state.emberSheet) history.replaceState(null, "");
} catch (e) {}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") dismissSheet();
});

const CSAT_FACES = [ [ 1, ":-(" ], [ 2, ":-/" ], [ 3, ":-|" ], [ 4, ":-)" ], [ 5, ":-D" ] ];

const CSAT_KEY = "ember.qr.csat." + TOKEN;

let ASK_CSAT = false;

let REVIEW_URL = "";

function csatAnswered() {

function csatSend(score, comment) {

    }).catch(() => {});

function csatHtml() {
  if (!ASK_CSAT) return "";
  if (CSAT_LOW && !CSAT_LOW.sent) return '<div class="csat" id="csat">' + csatLowHtml() + "</div>";
  if (csatAnswered()) return '<div class="csat"><div class="done">Thank you for telling us.</div></div>';
  return '<div class="csat" id="csat"><div class="q">How was it?</div><div class="row">' + CSAT_FACES.map(f => '<button type="button" data-csat="' + f[0] + '" aria-label="' + f[0] + ' out of 5">' + f[1] + "</button>").join("") + "</div></div>";

let CSAT_VIS = false;

function wireCsatLow() {
  const box = el("csat");
  if (!box || !el("csatsend")) return;
  const once = c => {
    if (CSAT_LOW && !CSAT_LOW.sent) {
      CSAT_LOW.sent = true;
      csatSend(CSAT_LOW.score, c);
    }
  };
  const done = () => {
    box.innerHTML = '<div class="done">Thank you. The owner will see it.</div>';
    replay(box, "swapin");
  };
  el("csatwhy").oninput = () => {
    if (CSAT_LOW) CSAT_LOW.text = el("csatwhy").value;
  };
  el("csatsend").onclick = () => {
    once((el("csatwhy").value || "").trim());
    done();
  };
  el("csatskip").onclick = () => {
    once(null);
    done();
  };
  if (!CSAT_VIS) {
    CSAT_VIS = true;
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) once(null);
    });
  }
}

function wireCsat() {
  wireCsatLow();
  document.querySelectorAll("[data-csat]").forEach(b => {
    b.onclick = () => {
      const score = Number(b.getAttribute("data-csat")) || 0;
      try {
        localStorage.setItem(CSAT_KEY, String(Date.now()));
      } catch (e) {}
      const box = el("csat");
      if (score <= 2) {
        CSAT_LOW = {
          score: score,
          sent: false,
          text: ""
        };
        if (box) {
          box.innerHTML = csatLowHtml();
          replay(box, "swapin");
        }
        wireCsatLow();
        return;
      }
      csatSend(score, null);
      if (box) box.innerHTML = score >= 4 && REVIEW_URL ? '<div class="done">Thank you! Would you tell others too?</div>' + '<a class="primary" style="display:inline-block;margin-top:10px;text-decoration:none;padding:10px 16px" target="_blank" rel="noopener" href="' + esc(REVIEW_URL) + '">Leave us a Google review</a>' : '<div class="done">Thank you for telling us.</div>';
      if (box) replay(box, "swapin");
    };
  });
}

function foodFacts(it) {
  const list = v => String(v || "").split(",").map(x => x.trim()).filter(Boolean);
  const allergens = list(it.allergens);
  const diets = list(it.diet_tags).map(k => DIET_LABELS[k]).filter(Boolean);
  const macro = [];
  const g = (v, label) => {
    const n = Number(v);
    if (isFinite(n) && n > 0) macro.push(Math.round(n * 10) / 10 + "g " + label);
  };
  g(it.protein_g, "protein");
  g(it.fat_g, "fat");
  g(it.carbs_g, "carbs");
  const kcal = Number(it.kcal);
  const nutri = [];
  if (isFinite(kcal) && kcal > 0) nutri.push(Math.round(kcal) + " kcal");
  if (macro.length) nutri.push(macro.join(", "));
  return (allergens.length ? '<div class="allergens">Contains: ' + esc(allergens.join(", ")) + "</div>" : "") + (diets.length ? '<div class="diet">' + diets.map(d => "<span>" + esc(d) + "</span>").join("") + "</div>" : "") + (nutri.length ? '<div class="nutri">' + esc(nutri.join(" · ")) + "</div>" : "");
}

function openItem(id, opts) {
  const it = MENU.items.find(x => x.id === id);
  if (soldOut(it)) {
    toast(it.name + " is sold out right now.");
    return;
  }
  let size = it.sizes && it.sizes.length ? it.sizes[0].id : null;
  let qty = Math.max(1, Math.min(20, Number(opts && opts.qty) || 1));
  const picks = {};
  (it.slots || []).forEach(s => {
    if (s.options && s.options.length) picks[s.id] = s.options[0].id;
  });
  const emptySlot = (it.slots || []).find(s => !s.options || !s.options.length) || null;
  const addonQty = new Map;
  const qtyOf = aid => addonQty.get(aid) || 0;
  const addonPicks = {
    has: aid => qtyOf(aid) > 0,
    delete: aid => addonQty.delete(aid),
    add: aid => addonQty.set(aid, qtyOf(aid) + 1)
  };
  const allow = it.addon_ids && it.addon_ids.length ? new Set(it.addon_ids) : null;
  const addons = it.no_addons ? [] : (MENU.addons || []).filter(a => !allow || allow.has(a.id));
  const reqCats = new Set(it.no_addons ? [] : it.required_cats || []);
  const rawMax = () => {
    const v = size && it.sizes ? it.sizes.find(s => s.id === size) : null;
    return v && v.max_picks != null ? v.max_picks : it.addon_max_picks != null ? it.addon_max_picks : null;
  };
  const rawMin = () => {
    const v = size && it.sizes ? it.sizes.find(s => s.id === size) : null;
    return v && v.min_picks != null ? v.min_picks : it.addon_min_picks != null ? it.addon_min_picks : null;
  };
  const minFor = () => {
    const raw = rawMin();
    const min = raw == null ? 1 : Math.max(1, raw);
    const cap = capFor();
    return cap === Infinity ? min : Math.min(min, cap);
  };
  const capFor = () => {
    const raw = rawMax();
    if (raw == null) return 1;
    return raw === 0 ? Infinity : Math.max(1, raw);
  };
  const capOpt = () => {
    const raw = rawMax();
    if (raw == null || raw === 0) return Infinity;
    return Math.max(1, raw);
  };
  const picksIn = key => addons.filter(a => (a.category || "other") === key && addonPicks.has(a.id));
  const countIn = key => addons.reduce((n, a) => n + ((a.category || "other") === key ? qtyOf(a.id) : 0), 0);
  const trimToCap = () => {
    addonGroups.forEach(g => {
      const cap = reqCats.has(g.key) ? capFor() : capOpt();
      if (cap === Infinity) return;
      let room = cap;
      g.items.forEach(a => {
        const have = qtyOf(a.id);
        if (!have) return;
        const keep = Math.max(0, Math.min(have, room));
        room -= keep;
        if (keep) addonQty.set(a.id, keep); else addonQty.delete(a.id);
      });
    });
  };
  const addonGroups = [];
  addons.forEach(a => {
    const k = a.category || "other";
    let g = addonGroups.find(x => x.key === k);
    if (!g) {
      g = {
        key: k,
        items: []
      };
      addonGroups.push(g);
    }
    g.items.push(a);
  });
  const missingCats = () => [ ...reqCats ].filter(c => {
    var got = 0;
    addons.forEach(a => {
      if ((a.category || "other") === c) got += qtyOf(a.id);
    });
    return got < minFor();
  });
  const unit = () => {
    let p = it.price_cents;
    if (size) {
      const v = it.sizes.find(s => s.id === size);
      if (v) p += v.delta;
    }
    (it.slots || []).forEach(s => {
      const o = (s.options || []).find(x => x.id === picks[s.id]);
      if (o) p += o.delta;
    });
    addons.forEach(a => {
      p += Math.max(0, a.price_cents || 0) * qtyOf(a.id);
    });
    return p;
  };
  function draw() {
    openSheet('<div class="shead">' + '<div style="flex:1;min-width:0">' + "<h2 data-notl>" + esc(it.name) + "</h2>" + (it.description ? '<p class="biglead" data-notl>' + esc(it.description) + "</p>" : "") + '<div class="bigprice">' + money(it.price_cents) + "</div>" + (ACCT ? '<button class="ghost favbtn" id="favtog" aria-pressed="' + isFav(it.id) + '">' + (isFav(it.id) ? ICON_HEART_ON + " In your favourites" : ICON_HEART_OFF + " Save as a favourite") + "</button>" : "") + "</div>" + '<button class="x" id="xclose" aria-label="Close">' + ICON_X + "</button>" + "</div>" + foodFacts(it) + (it.sizes && it.sizes.length ? '<div class="label">Size</div>' + it.sizes.map(s => '<button class="opt" data-sz="' + s.id + '" aria-pressed="' + (size === s.id) + '"><span data-notl>' + esc(s.label) + "</span>" + '<span class="delta">' + (s.delta ? (s.delta > 0 ? "+" : "") + money(s.delta) : "Included") + "</span></button>").join("") : "") + (it.slots || []).map(s => '<div class="label" data-notl>' + esc(s.label) + "</div>" + (emptySlot === s ? '<p class="lede" style="font-size:13px;margin:0 0 8px">None left right now.</p>' : "") + (s.options || []).map(o => '<button class="opt" data-sl="' + s.id + '" data-op="' + o.id + '" aria-pressed="' + (picks[s.id] === o.id) + '"><span data-notl>' + esc(o.label) + "</span>" + '<span class="delta">' + (o.delta ? "+" + money(o.delta) : "Included") + "</span></button>").join("")).join("") + addonGroups.map(g => {
      const need = reqCats.has(g.key);
      const unanswered = need && missingCats().indexOf(g.key) >= 0;
      const cap = need ? capFor() : capOpt();
      const badge = need ? cap === Infinity ? "Required" : cap === 1 ? "Pick one" : "Pick up to " + cap : cap === Infinity ? "" : "Up to " + cap;
      return '<div class="label">' + esc(ADDON_LABELS[g.key] || g.key) + (badge ? '<span class="req' + (unanswered ? " req-on" : "") + '">' + badge + "</span>" : "") + "</div>" + g.items.map(a => {
        const n = qtyOf(a.id);
        const stepper = n > 0 && !(need && cap === 1);
        return '<div class="opt" data-ad="' + a.id + '" role="button" tabindex="0" aria-pressed="' + (n > 0) + '">' + "<span data-notl>" + esc(a.text) + "</span>" + '<span class="delta">' + (a.price_cents > 0 ? "+" + money(a.price_cents) : "Free") + "</span>" + (stepper ? '<span class="adq"><button type="button" data-adm="' + a.id + '" aria-label="One less ' + esc(a.text) + '">&minus;</button>' + "<b>" + n + "</b>" + '<button type="button" data-adp="' + a.id + '" aria-label="One more ' + esc(a.text) + '">+</button></span>' : "") + "</div>";
      }).join("");
    }).join("") + '<div class="label">Anything to tell the kitchen?</div>' + '<input class="note-in" id="inote" type="text" maxlength="120" placeholder="Allergies, no onions, extra napkins" aria-label="Note for the kitchen">' + '<div class="label">How many?</div>' + '<div class="stepper"><button id="minus" aria-label="One less">&minus;</button><span id="qv" aria-live="polite">' + qty + "</span>" + '<button id="plus" aria-label="One more">+</button></div>' + '<div class="foot">' + '<button class="ghost" id="cancel">Back</button>' + (emptySlot ? '<button class="primary" id="add" disabled>Not available right now</button>' : missingCats().length ? '<button class="primary" id="add" disabled>Choose ' + esc(missingCats().map(c => (ADDON_LABELS[c] || c).toLowerCase()).join(" and ")) + "</button>" : '<button class="primary" id="add">Add ' + money(unit() * qty) + "</button>") + "</div>", true);
    if (el("xclose")) el("xclose").onclick = closeSheet;
    if (el("favtog")) el("favtog").onclick = async function() {
      const on = !isFav(it.id), b = el("favtog");
      b.disabled = true;
      try {
        const r = await EmberAccount.rpc("cust_favorite", {
          p_session: EmberAccount.getSession(),
          p_token: TOKEN,
          p_item: it.id,
          p_on: on
        });
        if (!r || !r.ok) {
          toast(r && r.error || "Could not save that.");
          b.disabled = false;
          return;
        }
        const f = ACCT.card.favorites = ACCT.card.favorites || [];
        if (on) f.push(it.id); else ACCT.card.favorites = f.filter(x => x !== it.id);
        b.innerHTML = on ? ICON_HEART_ON + " In your favourites" : ICON_HEART_OFF + " Save as a favourite";
        b.setAttribute("aria-pressed", String(on));
        b.disabled = false;
      } catch (e) {
        toast("No connection. Try again.");
        b.disabled = false;
      }
    };
    document.querySelectorAll("[data-sz]").forEach(b => b.onclick = () => {
      size = Number(b.dataset.sz);
      trimToCap();
      redraw();
    });
    document.querySelectorAll("[data-op]").forEach(b => b.onclick = () => {
      picks[Number(b.dataset.sl)] = Number(b.dataset.op);
      redraw();
    });
    function addOne(id) {
      const a = addons.find(x => x.id === id);
      const key = a && a.category || "other";
      const need = reqCats.has(key);
      const cap = need ? capFor() : capOpt();
      if (cap !== Infinity && countIn(key) >= cap) {
        if (need && cap === 1) {
          picksIn(key).forEach(x => addonPicks.delete(x.id));
        } else {
          toast("Up to " + cap + " only for " + (ADDON_LABELS[key] || key).toLowerCase());
          return;
        }
      }
      addonPicks.add(id);
      redraw();
    }
    document.querySelectorAll("[data-adp]").forEach(b => b.onclick = e => {
      e.stopPropagation();
      addOne(Number(b.dataset.adp));
    });
    document.querySelectorAll("[data-adm]").forEach(b => b.onclick = e => {
      e.stopPropagation();
      const id = Number(b.dataset.adm);
      const n = qtyOf(id);
      if (n <= 1) addonPicks.delete(id); else addonQty.set(id, n - 1);
      redraw();
    });
    document.querySelectorAll("[data-ad]").forEach(b => {
      const tap = () => {
        const id = Number(b.dataset.ad);
        if (addonPicks.has(id)) {
          const cat = (addons.find(x => x.id === id) || {}).category || "other";
          if (reqCats.has(cat) && capFor() === 1) return;
          addonPicks.delete(id);
          redraw();
          return;
        }
        addOne(id);
      };
      b.onclick = tap;
      b.onkeydown = e => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          tap();
        }
      };
    });
    el("minus").onclick = () => {
      if (qty > 1) {
        qty--;
        redraw();
      }
    };
    el("plus").onclick = () => {
      if (qty < 20) {
        qty++;
        redraw();
      }
    };
    el("cancel").onclick = closeSheet;
    el("add").onclick = () => {
      const v = size ? it.sizes.find(s => s.id === size) : null;
      if (opts && opts.replaceLine) {
        const at = CART.indexOf(opts.replaceLine);
        if (at >= 0) CART.splice(at, 1);
      }
      CART.push({
        item_id: it.id,
        name: it.name,
        qty: qty,
        price: unit(),
        taxExempt: !!(it.tax_exempt || it.zero_rated),
        variant_id: size,
        variant_label: v ? v.label : null,
        options: Object.values(picks),
        option_labels: (it.slots || []).map(s => {
          const o = (s.options || []).find(x => x.id === picks[s.id]);
          return o ? o.label : null;
        }).filter(Boolean),
        addons: addons.flatMap(a => Array(qtyOf(a.id)).fill(a.id)),
        addon_labels: addons.filter(a => qtyOf(a.id) > 0).map(a => qtyOf(a.id) > 1 ? qtyOf(a.id) + "× " + a.text : a.text),
        note: (el("inote").value || "").trim()
      });
      closeSheet();
      BUMP = true;
      render();
      const meal = it.meal_item_id ? MENU.items.find(x => x.id === it.meal_item_id) : null;
      if (meal) offerMeal(it, meal, CART[CART.length - 1]); else if (!offerUpsell(it)) toast(qty + " " + it.name + " added");
    };
  }
  function redraw() {
    const n = el("inote") ? el("inote").value : "";
    SHEET_SAME = true;
    draw();
    if (n) el("inote").value = n;
  }
  draw();
}

function offerUpsell(from) {
  if (OFFERED[from.id]) return false;
  const inCart = {};
  CART.forEach(l => {
    inCart[l.item_id] = 1;
  });
  const sug = (UPSELLS[from.id] || []).map(id => MENU.items.find(x => x.id === id)).find(x => x && !soldOut(x) && !inCart[x.id]);
  if (!sug) return false;
  OFFERED[from.id] = 1;
  openSheet("<h2>Add " + esc(sug.name) + "?</h2>" + '<p class="lede">It goes well with ' + esc(from.name) + ". " + money(sug.price_cents) + "</p>" + '<div style="display:flex;gap:10px;margin-top:20px">' + '<button class="ghost" id="noup">No thanks</button>' + '<button class="primary" id="yesup">Add it</button></div>');
  el("noup").onclick = () => {
    closeSheet();
    toast(from.name + " added");
  };
  el("yesup").onclick = () => {
    closeSheet();
    openItem(sug.id);
  };
  return true;
}

function lastOrderAgain() {
  if (SHARED) return null;
  const past = loadOrders().find(o => (o.items || []).some(l => l.item_id));
  if (!past) return null;
  const lines = [];
  (past.items || []).forEach(l => {
    const it = l.item_id && MENU.items.find(x => x.id === l.item_id);
    if (!it || soldOut(it) || l.options && l.options.length) return;
    const size = l.variant_id ? (it.sizes || []).find(z => z.id === l.variant_id) : null;
    if (l.variant_id && !size) return;
    if (!l.variant_id && (it.sizes || []).length) return;
    const ads = (l.addons || []).map(id => MENU.addons.find(a => a.id === id)).filter(Boolean);
    if (ads.length !== (l.addons || []).length) return;
    const unitPrice = it.price_cents + (size ? size.delta : 0) + ads.reduce((t, a) => t + Math.max(0, a.price_cents || 0), 0);
    lines.push({
      item_id: it.id,
      name: it.name,
      qty: l.qty || 1,
      price: Math.round(unitPrice),
      taxExempt: !!(it.tax_exempt || it.zero_rated),
      variant_id: size ? size.id : null,
      variant_label: size ? size.label : null,
      options: [],
      option_labels: [],
      addons: l.addons || [],
      addon_labels: ads.map(a => a.text),
      note: l.note || ""
    });
  });
  return lines.length ? lines : null;
}

function offerMeal(from, meal, line) {
  const extra = Math.max(0, meal.price_cents - from.price_cents);
  openSheet("<h2>Make it a meal?</h2>" + '<p class="lede">Add ' + esc(meal.slots.map(s => String(s.label || "").toLowerCase()).join(" and ")) + " for about " + money(extra) + " more.</p>" + '<div style="display:flex;gap:10px;margin-top:20px">' + '<button class="ghost" id="nomeal">No thanks</button>' + '<button class="primary" id="yesmeal">Make it a meal</button></div>');
  el("nomeal").onclick = () => {
    closeSheet();
    toast(from.name + " added");
  };
  el("yesmeal").onclick = () => {
    closeSheet();
    render();
    openItem(meal.id, {
      qty: line ? line.qty : 1,
      replaceLine: line || null

  };
}

function mountPinMap() {
  const slot = el("opinmap");
  if (!slot || !GEO || GEO.lat == null) return;
  const c = kmCfg();
  const key = GEO.lat + "," + GEO.lng;
  if (PINMAP) {
    slot.appendChild(PINMAP.el);
    if (PINMAP.h) {
      PINMAP.h.resize();
      if (PINMAP.pin !== key) {
        PINMAP.h.set("home", {
          lat: GEO.lat,
          lng: GEO.lng
        });
        PINMAP.pin = key;
        PINMAP.h.fit();
      }
    }
    return;
  }
  const box = document.createElement("div");
  slot.appendChild(box);
  const rec = PINMAP = {
    el: box,
    h: null,
    pin: key
  };
  EmberMap.create(box, {
    center: {
      lat: GEO.lat,
      lng: GEO.lng
    },
    zoom: 16
  }).then(function(h) {
    if (PINMAP !== rec) {
      if (h) h.remove();
      return;
    }
    if (!h) {
      PINMAP = null;
      PINMAP_BROKEN = true;
      if (GEO && GEO.fromShop && !GEO.moved) GEO = {
        err: 'The map could not load. Tap "Use my location", or order by phone.'
      };
      if (sheetOpen() && el("send") && CART_REDRAW) CART_REDRAW();
      return;
    }
    rec.h = h;
    if (c) h.set("shop", {
      lat: Number(c.lat),
      lng: Number(c.lng)
    });
    const g = GEO && GEO.lat != null ? GEO : null;
    if (g) {
      h.set("home", {
        lat: g.lat,
        lng: g.lng
      });
      rec.pin = g.lat + "," + g.lng;
    }
    h.movable("home", function(p) {
      GEO = pinAt(p.lat, p.lng, true, false);
      rec.pin = GEO.lat + "," + GEO.lng;
      if (sheetOpen() && el("send") && CART_REDRAW) CART_REDRAW();
    });
    h.map.once("load", function() {
      h.fit();
    });
  });
}

function timesFor(mode) {
  if (!STORE) return false;
  return mode === "delivery" ? !!(STORE.delivery && STORE.delivery_times) : !!(STORE.pickup && STORE.pickup_times);
}

function modeOpen(mode) {

}

function aheadDays() {
  return STORE && SHOPINFO && Number(SHOPINFO.days_ahead) || 0;
}

function availDays() {
  var t = SHOPINFO && /^\d{4}-\d{2}-\d{2}$/.test(SHOPINFO.today || "") ? SHOPINFO.today : null;
  if (!t || !aheadDays()) return [];
  var base = Date.parse(t + "T00:00:00Z"), out = [];
  var off = SHOPINFO && Array.isArray(SHOPINFO.days_off) ? SHOPINFO.days_off : [];
  for (var i = 0; i <= aheadDays(); i++) {
    if (i === 0 && (AHEAD_ONLY && !TODAY_LATER || !whenSlots().length)) continue;
    var d = new Date(base + i * 864e5);
    if (off.indexOf(d.toISOString().slice(0, 10)) >= 0) continue;
    out.push({
      v: i === 0 ? "" : d.toISOString().slice(0, 10),
      label: i === 0 ? "Today" : i === 1 ? "Tomorrow" : d.toLocaleDateString(window.EmberLang && EmberLang.isTagalog() ? "fil-PH" : "en-US", {
        timeZone: "UTC",
        weekday: "short",
        month: "short",
        day: "numeric"
      })
    });
  }
  return out;
}

function daySlots() {
  var om = /^(\d{1,2}):(\d{2})$/.exec(STORE && STORE.open || ""), cm = /^(\d{1,2}):(\d{2})$/.exec(STORE && STORE.close || "");
  var start = om ? Number(om[1]) * 60 + Number(om[2]) : 8 * 60;
  var end = cm ? Number(cm[1]) * 60 + Number(cm[2]) : 20 * 60;
  if (end <= start) end = 24 * 60 - 15; else end -= 1;
  start = Math.ceil(start / 15) * 15;
  var out = [];
  for (var t = start; t <= end && out.length < 96; t += 15) out.push(pad2(Math.floor(t / 60)) + ":" + pad2(t % 60));
  return out;
}

function slotsFor(day) {
  return day ? daySlots() : whenSlots();
}

  var seen = {};

      var k = a.toLowerCase();
      if (!seen[k]) seen[k] = a.charAt(0).toUpperCase() + a.slice(1);

  if (!filtersOn()) return true;

  var al = csvList(i.allergens).map(function(x) {

function shopNowMinutes() {

function whenSlots() {
  var lead = Math.max(0, Number(STORE && STORE.lead_minutes || 20));
  var nowM = shopNowMinutes();
  var start = nowM + lead + 1;
  start = Math.ceil(start / 15) * 15;
  var close = null, cm = /^(\d{1,2}):(\d{2})$/.exec(STORE && STORE.close || "");
  if (cm) close = Number(cm[1]) * 60 + Number(cm[2]);
  var open = null, om = /^(\d{1,2}):(\d{2})$/.exec(STORE && STORE.open || "");
  if (om) open = Number(om[1]) * 60 + Number(om[2]);
  var overnightDay = close !== null && (open !== null ? close < open : close < 6 * 60);
  if (!overnightDay && open !== null && start < open) start = Math.ceil(open / 15) * 15;
  var pz = /^(\d{2}):(\d{2})$/.exec(STORE && STORE.pause_until || "");
  if (pz) {
    var wait = (Number(pz[1]) * 60 + Number(pz[2]) - nowM + 24 * 60) % (24 * 60);
    if (wait <= 65 && start < nowM + wait + 1) start = Math.ceil((nowM + wait + 1) / 15) * 15;
  }
  if (close !== null) {
    var overnight = open !== null ? close < open : close < 6 * 60;
    if (overnight) {
      if (nowM < close) {} else if (open !== null ? nowM >= open : nowM >= 6 * 60) close += 24 * 60; else if (open !== null) {
        if (start < open) start = Math.ceil(open / 15) * 15;
        close = 24 * 60;

    }
    if (close <= start) return [];
  }
  var end = close !== null ? close - 1 : 24 * 60 - 15;
  var out = [];
  for (var t = start; t <= end && out.length < 48; t += 15) {
    var m = t % (24 * 60);
    out.push(pad2(Math.floor(m / 60)) + ":" + pad2(m % 60));
  }
  return out;
}

  var tickPay = function() {
    if (stopped || !el("paystate")) return;
    if (Date.now() > expiresAt + 60 * 1e3 || Date.now() - opened > 35 * 60 * 1e3) {
      expired();
      return;
    }
    payFn({
      action: "kiosk_status",
      token: TOKEN,
      orderNumber: num,
      intentId: intent,
      clientRef: refOf(num)
    }).then(function(st) {
      if (stopped) return;
      st = st || {};
      if (!st.paid && (st.stop || st.code === "paid_at_counter")) {
        stopWith("This order was paid at the counter.");
        return;
      }
      if (st.paid && st.shopCancelled) {
        stopWith("Paid. The shop cancelled this order and will refund you.");
        return;
      }
      if (st.paid) {
        stopped = true;
        markPrepaid(num);
        BANNER_NEW[num] = 1;
        closeSheet();
        showOrders(num);
        toast("Paid, the shop sees it instantly!");
        return;
      }
      if (st.code === "voided") {
        stopWith("The shop cancelled this order. If you already paid, the shop will refund you.");
        return;
      }
      if (st.code === "too_old") {
        stopWith("This order is too old to pay online now. Please pay at the shop.");
        return;
      }
      if (st.code === "bad_link" || st.code === "no_order" || st.code === "not_connected") {
        stopWith(st.error || "This order cannot be paid online now. Please pay at the shop.");
        return;
      }
      if (st.code === "wrong_intent" || st.code === "ref_reused") {
        stopWith("Your payment needs the shop to check it, please show this screen at the counter.");
        return;
      }
      if (st.code === "bad_id") {
        stopWith("That payment code is no longer open. Tap Pay now to start again.");
        return;
      }
      if (st.ok && (st.status === "cancelled" || st.status === "expired" || st.status === "awaiting_payment_method")) {
        expired();
        return;
      }
      setTimeout(tickPay, Date.now() - opened > 5 * 60 * 1e3 ? 6e3 : 3e3);
    }).catch(function() {
      setTimeout(tickPay, 4e3);
    });
  };
  setTimeout(tickPay, 3e3);
}

function payNowShown(o) {

const LS_KEY = "ember.qr." + TOKEN;

const FINAL = {
  collected: 1,
  cancelled: 1
};

function loadOrders() {
  try {
    const now = Date.now();
    const cut = now - 14 * 3600 * 1e3;
    const wantedKeep = o => !!(o.wantedDay && Date.parse(o.wantedDay + "T00:00:00Z") + 48 * 3600 * 1e3 > now);
    return JSON.parse(localStorage.getItem(LS_KEY) || "[]").filter(o => o && (o.at > cut || wantedKeep(o)));
  } catch (e) {
    return [];
  }
}

function writeOrders(list) {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(list.slice(0, 20)));
  } catch (e) {}
}

function rememberOrder(o) {
  const a = loadOrders();
  a.unshift(o);
  writeOrders(a);
}

function patchOrder(num, patch) {
  const a = loadOrders();
  const i = a.findIndex(x => x.num === num);
  if (i < 0) return false;
  let changed = false;
  for (const k in patch) {
    if (a[i][k] !== patch[k]) {
      a[i][k] = patch[k];
      changed = true;
    }
  }
  if (changed) writeOrders(a);
  return changed;
}

function markOrder(num, state, paid) {
  const a = loadOrders();
  const i = a.findIndex(x => x.num === num);
  if (i < 0) return {
    becameReady: false,
    paidChanged: false,
    becameCollected: false
  };
  const becameReady = state === "ready" && a[i].state !== "ready";
  const becameCollected = state === "collected" && a[i].state !== "collected";
  const paidChanged = paid === true && !a[i].paid;
  if (a[i].state !== state || paidChanged) {
    if (state !== "ready") delete a[i].acked;
    a[i].state = state;
    if (paid === true) a[i].paid = true;
    writeOrders(a);
  }
  return {
    becameReady: becameReady,
    paidChanged: paidChanged,
    becameCollected: becameCollected
  };
}

function forgetAll() {

let AUDIO = null;

function primeAudio() {
  try {
    if (!AUDIO) AUDIO = new (window.AudioContext || window.webkitAudioContext);
    if (AUDIO.state === "suspended") AUDIO.resume();
  } catch (e) {}
}

document.addEventListener("pointerdown", primeAudio);

function chime() {
  try {
    if (!AUDIO || AUDIO.state !== "running") return;
    const t = AUDIO.currentTime;
    [ 880, 1175 ].forEach((f, i) => {
      const o = AUDIO.createOscillator(), g = AUDIO.createGain();
      o.frequency.value = f;
      o.connect(g);
      g.connect(AUDIO.destination);
      g.gain.setValueAtTime(1e-4, t + i * .18);
      g.gain.exponentialRampToValueAtTime(.35, t + i * .18 + .02);
      g.gain.exponentialRampToValueAtTime(1e-4, t + i * .18 + .5);
      o.start(t + i * .18);
      o.stop(t + i * .18 + .55);
    });
  } catch (e) {}
}

let ringTimer = null;

function unackedReady() {

function stopRinging() {

    titleTimer = null;
  }

function alertReady(num) {
  var ord = loadOrders().find(function(x) {

  buzz(num);
  if (ringTimer) return;
  ringTimer = setInterval(() => {
    const live = unackedReady();
    if (!live.length) {
      stopRinging();
      return;
    }
    buzz(live[0].num);
  }, 6e3);
}

function resumeRinging() {

function isLaterDay(o) {

let WAKE = null;

async function holdWake() {
  try {
    const live = loadOrders().some(function(o) {
      if (isLaterDay(o)) return false;
      return o.state === "waiting" || o.state === "making" || o.state === "ready" && !o.acked;
    });
    if (!live) {
      if (WAKE) {
        try {
          WAKE.release();
        } catch (e) {}
        WAKE = null;
      }
      return;
    }
    if (WAKE || !("wakeLock" in navigator)) return;
    WAKE = await navigator.wakeLock.request("screen");
    WAKE.addEventListener("release", function() {
      WAKE = null;
    });
  } catch (e) {
    WAKE = null;
  }
}

function askNotify() {

function agoWords(iso) {

function mountTripMaps() {
  document.querySelectorAll("[data-tripmap]").forEach(slot => {
    const num = slot.getAttribute("data-tripmap");
    const t = TRIPS[num];
    const have = TRIPMAPS[num];
    if (have) {
      slot.appendChild(have.el);
      if (have.h) have.h.resize();
      return;
    }
    const box = document.createElement("div");
    slot.appendChild(box);
    const rec = TRIPMAPS[num] = {
      el: box,
      h: null,
      moved: false
    };
    EmberMap.create(box, {
      center: t.lat != null ? {
        lat: t.lat,
        lng: t.lng
      } : t.dest || t.shop
    }).then(h => {
      if (!h) {
        slot.remove();
        delete TRIPMAPS[num];
        return;
      }
      rec.h = h;
      tripPins(h, TRIPS[num] || t);
      h.map.on("dragstart", () => {
        rec.moved = true;
      });
      h.map.on("zoomstart", e => {
        if (e.originalEvent) rec.moved = true;
      });
      h.map.once("load", () => h.fit());
    });
  });
}

async function trackTrips() {
  const mine = loadOrders().filter(tripTrackable);
  if (!mine.length) {
    if (tripTimer) {
      clearInterval(tripTimer);
      tripTimer = null;
    }
    return;
  }
  let redraw = false;
  for (const o of mine) {
    try {
      const r = await rpc("kiosk_track", {
        p_token: TOKEN,
        p_order_number: o.num,
        p_client_ref: o.ref
      });
      if (!r || !r.ok) continue;
      const was = TRIPS[o.num], t = r.trip;
      if (!t) {
        if (was) {
          delete TRIPS[o.num];
          dropTripMap(o.num);
          redraw = true;
        }
        continue;
      }
      TRIPS[o.num] = t;
      if (!was) {
        TRIP_NEW = o.num;
        redraw = true;
        continue;
      }
      if (!!was.delivered_at !== !!t.delivered_at || was.started !== t.started) {
        if (t.delivered_at) dropTripMap(o.num);
        redraw = true;
        continue;
      }
      const info = document.querySelector('[data-tripinfo="' + o.num + '"]');
      if (info) info.textContent = tripInfo(t);
      const m = TRIPMAPS[o.num];
      if (m && m.h) {
        tripPins(m.h, t);
        if (!m.moved) m.h.fit();
      }
    } catch (e) {}
  }
  if (redraw && el("tomenu")) showOrders();
  TRIP_NEW = null;
}

  if (!loadOrders().some(tripTrackable)) return;

    tripTimer = setInterval(trackTrips, 15e3);

}

let tracking = null;

function trackAll() {
  const tick = async () => {
    const live = loadOrders().filter(o => !FINAL[o.state] || !o.paid && o.state !== "cancelled");
    if (!live.length) return;
    let redraw = false;
    for (const o of live) {
      try {
        const r = await rpc("kiosk_order_status", {
          p_token: TOKEN,
          p_order_number: o.num
        });
        if (r && r.ok) {
          const moved = (o.state || "waiting") !== r.state;
          const ch = markOrder(o.num, r.state, r.paid);
          if (r.prepaid && !o.prepaid) {
            markPrepaid(o.num);
            redraw = true;
          }
          if (r.prepaid && !o.prepaid) BANNER_NEW[o.num] = 1;
          if (ch.becameReady) {
            alertReady(o.num);
            notifyReady(o.num, o.pickup);
            redraw = true;
            BANNER_NEW[o.num] = 1;
          }
          if (ch.becameCollected) {
            stopRinging();
            redraw = true;
            BANNER_NEW[o.num] = 1;
          }
          if (ch.paidChanged) redraw = true;
          const patch = {};
          if (r.total_cents != null && isFinite(Number(r.total_cents))) patch.total = Number(r.total_cents) + (Number(r.tip_cents) || 0);
          if (r.state === "cancelled" && r.cancel_reason) patch.cancelReason = String(r.cancel_reason);
          if ("merged_into" in r) patch.mergedInto = r.merged_into ? String(r.merged_into) : null;
          if ("pay_first" in r) patch.payFirst = r.pay_first === true;
          if ("unopened" in r) patch.unopened = r.unopened === true;
          if (patch.unopened && STORE && !SHOPINFO) {
            try {
              const si = await rpc("kiosk_shop_info", {
                p_token: TOKEN
              });
              SHOPINFO = si && si.ok ? si : null;
            } catch (e) {}
          }
          if (patchOrder(o.num, patch)) redraw = true;
          if (moved) STEP_MOVED[o.num] = 1;
          const box = document.querySelector('[data-track="' + o.num + '"]');
          if (box) box.innerHTML = stepsHtml(r.state, o.type, o.wanted, moved, patch.cancelReason || o.cancelReason);
        }
      } catch (e) {}
    }
    if (redraw && el("tomenu")) showOrders(); else clearMoved();
    holdWake();
  };
  tick();
  if (!tracking) tracking = setInterval(tick, 15e3);
}

function fatal(title, msg) {
  el("app").innerHTML = '<div class="center fatal"><h2>' + esc(title) + "</h2><p>" + esc(msg) + "</p>" + '<div style="margin-top:22px"><button class="ghost" id="retry">Try again</button></div></div>';
  el("retry").onclick = () => location.reload();
}

function reopenWords(sh) {
  if (!sh || !/^\d{2}:\d{2}$/.test(sh.reopen_at || "")) return "";
  var at = hhmm12(sh.reopen_at);
  if (!sh.reopen_day || !sh.today || sh.reopen_day === sh.today) return "at " + at;
  var d0 = Date.parse(sh.today + "T00:00:00Z"), d1 = Date.parse(sh.reopen_day + "T00:00:00Z");
  if (d1 - d0 === 864e5) return "tomorrow at " + at;
  return "on " + new Date(d1).toLocaleDateString(window.EmberLang && EmberLang.isTagalog() ? "fil-PH" : "en-US", {
    timeZone: "UTC",
    weekday: "long"
  }) + " at " + at;
}

function closedScreen(m) {
  const sh = m && m.shop || {};
  const name = sh.name || "This shop", when = reopenWords(sh);
  if (sh.closed_why === "paused") fatal(name + " has paused online orders", "Online orders open again " + (when || "soon") + "."); else if (sh.closed_why === "day_off" || sh.closed_why === "holiday") fatal(name + " is closed today", when ? "Online orders open again " + when + "." : "Please come back another day!"); else if (sh.closed_why === "hours") fatal(name + " is closed right now", when ? "Online orders open " + when + "." : "Please come back later!"); else fatal(name + " is closed right now", "Ordering opens again when the counter does. Please come back later!");
  const n = shopNote(m), box = document.querySelector("#app .center");
  if (n && box) box.insertAdjacentHTML("beforeend", '<p class="snote">' + esc(n) + "</p>");
}

function applyMenu(m) {
  MENU = m;
  CUR = m.shop && m.shop.currency || "₱";
  TAXPCT = Number(m.shop && m.shop.tax_percent || 0);
  SVCPCT = Number(m.shop && m.shop.service_charge_pct || 0);
  SVCTO = m.shop && Array.isArray(m.shop.service_charge_to) ? m.shop.service_charge_to : [];
  HASPROMO = !!(m.shop && m.shop.ordering && m.shop.ordering.has_promo === true);
}

function storeOf(m) {
  var sh = m && m.shop || {};
  return Object.assign({}, sh.ordering || {}, {
    now_read_at: Date.now()
  }, {
    pause_until: sh.closed_why === "paused" ? sh.reopen_at || null : null
  });
}

async function canOrderAhead(m) {
  var ord = m && m.link && m.link.kind === "store" && m.shop && m.shop.ordering || null;
  if (!ord || !(ord.pickup && ord.pickup_times || ord.delivery && ord.delivery_times)) return false;
  if (!SHOPINFO) {
    try {
      const si = await rpc("kiosk_shop_info", {
        p_token: TOKEN
      });
      SHOPINFO = si && si.ok ? si : null;
    } catch (e) {}
  }
  var keep = {
    s: STORE,
    m: MENU
  };
  STORE = storeOf(m);
  MENU = m;
  AHEAD_ONLY = true;
  TODAY_LATER = (m.shop.closed_why === "hours" || m.shop.closed_why === "paused") && whenSlots().length > 0;
  if (TODAY_LATER || availDays().length > 0) return true;
  STORE = keep.s;
  MENU = keep.m;
  AHEAD_ONLY = false;
  TODAY_LATER = false;
  return false;
}

let MENU_BUSY = false, MENU_AT = 0;

async function refreshMenu(gapMs) {
  if (MENU_BUSY || !MENU || !TOKEN) return;
  if (gapMs && Date.now() - MENU_AT < gapMs) return;
  MENU_BUSY = true;
  try {
    let m = null;
    try {
      m = await rpc("kiosk_menu", {
        p_token: TOKEN
      });
    } catch (e) {
      return;
    }
    if (!m || !m.ok) return;
    MENU_AT = Date.now();
    const q = el("q");
    const onMenu = !document.querySelector("[data-track]") && !sheetOpen() && !(q && document.activeElement === q);
    let moved = false;
    if (m.shop && m.shop.closed && !AHEAD_ONLY) {
      if (!(m.link && m.link.kind === "store" && await canOrderAhead(m))) {
        if (onMenu && !CART.length) closedScreen(m);
        return;
      }
      moved = true;
      WHEN = null;
      WHENDAY = "";
      toast(aheadLede());
    } else if (!(m.shop && m.shop.closed) && AHEAD_ONLY) {
      AHEAD_ONLY = false;
      TODAY_LATER = false;
      WHEN = null;
      WHENDAY = "";
      if (STORE) STORE = storeOf(m);
      moved = true;
    }
    if (!Array.isArray(m.items) || !m.items.length) return;
    if (!moved && JSON.stringify(m) === JSON.stringify(MENU) && !el("retry")) return;
    applyMenu(m);
    const was = JSON.stringify(CART);
    const n = CART.length;
    CART = CART.map(freshLine).filter(Boolean);
    if (CART.length < n) toast("Some items are no longer available and were taken out.");
    if (JSON.stringify(CART) !== was || moved) {
      saveCart();
      if (sheetOpen() && el("send")) {
        if (CART.length) openCart(); else {
          closeSheet();
          render();
        }
        return;
      }
    }
    if (onMenu) render();
  } finally {
    MENU_BUSY = false;
  }
}

function loadExtras() {
  (async () => {
    try {
      const pairs = await rpc("kiosk_upsells", {
        p_token: TOKEN
      });
      if (Array.isArray(pairs)) pairs.forEach(p => {
        (UPSELLS[p.t] = UPSELLS[p.t] || []).push(p.s);
      });
    } catch (e) {
      UPSELLS = {};
    }
  })();
  (async () => {
    try {
      ASK_CSAT = await rpc("kiosk_asks_csat", {
        p_token: TOKEN
      }) === true;
    } catch (e) {
      ASK_CSAT = false;
    }
    if (ASK_CSAT) {
      try {
        const u = await rpc("kiosk_review_url", {
          p_token: TOKEN
        });
        REVIEW_URL = typeof u === "string" && /^https:\/\//i.test(u) ? u : "";

  })();
  if (STORE && window.EmberAccount) {
    (async () => {

async function openLinkedOrder() {
  if (!LINK_ORDER && !LINK_REF) return;
  try {
    const u = new URL(location.href);
    u.searchParams.delete("o");
    u.searchParams.delete("r");
    history.replaceState(history.state, "", u.pathname + u.search + u.hash);
  } catch (e) {}
  if (!STORE || SHARED || !LINK_ORDER || !LINK_REF) return;
  if (loadOrders().some(o => o.num === LINK_ORDER)) {
    if (!sheetOpen()) showOrders(LINK_ORDER);
    return;
  }
  let r = null;
  try {
    r = await rpc("kiosk_order_status", {
      p_token: TOKEN,
      p_order_number: LINK_ORDER
    });
  } catch (e) {
    r = null;
  }
  if (!r || !r.ok) {
    toast("That order could not be found. It may be more than a day old.");
    return;
  }
  const linked = {
    num: LINK_ORDER,
    ref: LINK_REF,
    at: Date.now(),
    claimed: true,
    linked: true,
    type: r.order_type || null,
    state: r.state || "waiting",
    paid: r.paid === true,
    prepaid: r.prepaid === true,
    pickup: r.pickup || null,
    total: null,
    tip: 0,
    items: []
  };
  if ("pay_first" in r) linked.payFirst = r.pay_first === true;
  rememberOrder(linked);
  if (!sheetOpen()) showOrders(LINK_ORDER);
}

async function saveOrderLink(num) {
  const o = loadOrders().find(x => x.num === num);
  if (!o || !o.ref) return;
  const url = location.origin + location.pathname + "?t=" + encodeURIComponent(TOKEN) + "&o=" + encodeURIComponent(o.num) + "&r=" + encodeURIComponent(o.ref);
  if (navigator.share) {
    try {
      await navigator.share({
        title: "Order " + pickupNum(o.num, o.pickup) + ", " + shopName(),
        url: url
      });
      return;
    } catch (e) {
      if (e && e.name === "AbortError") return;
    }
  }
  try {
    await navigator.clipboard.writeText(url);
    toast("Link copied. Open it on any phone to follow this order.");
    return;
  } catch (e) {}
  window.prompt("Copy this link to follow your order:", url);
}

    if (!STORE) {
      setInterval(function() {
        if (!CART.length && !sheetOpen() && document.visibilityState !== "hidden" && !document.querySelector("[data-track]")) refreshMenu();
      }, 10 * 60 * 1e3);
    }
  } catch (e) {
    fatal("No connection", "Check your signal and try again.");
  }
})();
</script>
