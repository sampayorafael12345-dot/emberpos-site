<!doctype html>
<html lang="en">
<head>

<script>if (window.top !== window.self) { document.documentElement.style.display = 'none'; try { window.top.location.replace(window.self.location.href); } catch (e) {} }</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f0b09">
<meta name="color-scheme" content="dark">
<title>Check your laundry ticket</title>
<link rel="icon" href="favicon.png">

<style>
  :root { color-scheme: dark; --bg: #0f0b09; --panel: rgba(255, 244, 228, 0.05); --line: rgba(232, 194, 122, 0.22); --text: #f6ead9; --muted: #c9b39c; --gold: #e8c27a; --ok: #7fd9a0; --warn: #ffcf87; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; line-height: 1.45; }
  main { max-width: 420px; margin: 0 auto; padding: calc(28px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); text-align: center; }
  h1 { margin: 0 0 4px; font-family: Georgia, 'Times New Roman', serif; font-size: 24px; color: var(--gold); }
  .panel { margin-top: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px 16px; }
  .label { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .num { font-size: 56px; font-weight: 700; line-height: 1.1; margin: 4px 0 12px; font-variant-numeric: tabular-nums; }
  .stage { display: inline-block; padding: 8px 18px; border-radius: 999px; border: 1px solid var(--line); font-size: 20px; font-weight: 600; }
  .stage.ready { color: var(--ok); border-color: var(--ok); }
  .row { margin-top: 16px; }
  .row b { display: block; font-size: 18px; font-weight: 600; }
  .pay { color: var(--warn); } .paid { color: var(--ok); }
  .note { margin-top: 18px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1 id="shop"></h1>
  <div class="panel" id="panel" aria-live="polite"><div class="label">Checking your ticket</div></div>
  <p class="note">This page updates by itself. Ask at the counter if something looks wrong.</p>
</main>
<script>
const URLB = 'https://qqmkgafyfxrcnwdkkyxc.supabase.co';
const ANON = 'sb_publishable_-cAsxVwroAl8NPHIQnrKMw_PsBEYAYX';
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const el = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function rpc(fn, args) {
  const r = await fetch(URLB + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: ANON, Authorization: 'Bearer ' + ANON },
    body: JSON.stringify(args),
  });
  if (!r.ok) throw new Error('network');
  return await r.json();
}

function when(iso) {
  if (!iso) return 'Not set';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return 'Not set';
  return d.toLocaleString(undefined, { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
}

function fmt(cents, sym) {
  return (sym || '₱') + (cents / 100).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function show(r) {
  el('shop').textContent = r.shop || '';
  const bal = Math.round(Number(r.balance_cents) || 0);
  const money = fmt(bal, r.symbol);
  const done = r.stage === 'Handed over' || r.stage === 'Cancelled';
  el('panel').innerHTML =
    '<div class="label">Ticket</div><div class="num">' + esc(r.number) + '</div>' +
    '<span class="stage' + (r.stage === 'Ready' ? ' ready' : '') + '">' + esc(r.stage) + '</span>' +
    (done ? '' : '<div class="row"><span class="label">Ready</span><b>' + esc(when(r.promised_at)) + '</b></div>') +
    '<div class="row"><span class="label">Balance</span><b class="' + (bal > 0 ? 'pay' : 'paid') + '">' + (r.stage === 'Cancelled' ? 'Cancelled' : bal > 0 ? esc(money) + ' to pay' : 'Paid') + '</b></div>';
}

function none(text) {
  el('panel').innerHTML = '<div class="label">' + esc(text) + '</div>';
}

async function load() {
  if (!/^[0-9a-f]{22}$/.test(TOKEN)) { none('This link is not a ticket. Please scan the code on your stub again.'); return; }
  try {
    const r = await rpc('laundry_ticket_status', { p_token: TOKEN });
    if (r && r.ok) show(r); else none('We could not find this ticket. Please ask at the counter.');
  } catch (e) {
    if (!el('panel').querySelector('.num')) none('Could not reach the shop. Please try again in a moment.');
  }
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
